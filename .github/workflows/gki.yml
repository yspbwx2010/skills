name: gki

# The template compile check (tools/check_gki.py) needs a kernel source tree plus the output of a
# full kernel build, which a hosted runner does not have; it is run locally before committing.

on:
  push:
    branches: [main]
    paths: ["gki/**", ".github/workflows/gki.yml"]
  pull_request:
    paths: ["gki/**", ".github/workflows/gki.yml"]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: gki

jobs:
  gki:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Agent Skills spec (frontmatter, size, links)
        run: python3 tools/validate_skill.py

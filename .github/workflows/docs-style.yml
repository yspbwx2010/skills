name: docs-style

on:
  push:
    branches: [main]
    paths: ["docs-style/**", ".github/workflows/docs-style.yml"]
  pull_request:
    paths: ["docs-style/**", ".github/workflows/docs-style.yml"]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: docs-style

jobs:
  docs-style:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Agent Skills spec (frontmatter, size, links)
        run: python3 tools/validate_skill.py

      - name: Checker self-test
        run: python3 skills/docs-style/scripts/check_style.py --self-test

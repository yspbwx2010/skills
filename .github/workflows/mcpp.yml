name: mcpp

on:
  push:
    branches: [main]
    paths: ["mcpp/**", ".github/workflows/mcpp.yml"]
  pull_request:
    paths: ["mcpp/**", ".github/workflows/mcpp.yml"]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: mcpp

jobs:
  mcpp:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Agent Skills spec (frontmatter, size, links)
        run: python3 tools/validate_skill.py

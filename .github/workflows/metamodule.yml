name: metamodule

on:
  push:
    branches: [main]
    paths: ["metamodule/**", ".github/workflows/metamodule.yml"]
  pull_request:
    paths: ["metamodule/**", ".github/workflows/metamodule.yml"]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: metamodule

jobs:
  metamodule:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Agent Skills spec (frontmatter, size, links)
        run: python3 tools/validate_skill.py

      - name: Template scaffolds a valid metamodule
        run: python3 tools/check_metamodule.py

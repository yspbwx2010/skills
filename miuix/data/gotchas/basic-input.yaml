Slider:
  summary: "A horizontal slider. A thick pill track (28.dp) with an embedded white-dot thumb, supporting steps hard-stepping or keyPoints magnetic snapping, with three levels of haptic feedback."
  gotchas:
    - text: "showKeyPoints's KDoc says 'Only works when keyPoints is not null', which is the opposite of the implementation and wrong both ways: (1) passing keyPoints without showKeyPoints=true, the key points aren't drawn (but snapping still works); (2) without keyPoints, with only steps>0 and showKeyPoints=true, the step points are drawn normally. To display key points you must explicitly set showKeyPoints = true."
      severity: high
      evidence: miuix-ui/src/commonMain/kotlin/top/yukonga/miuix/kmp/basic/Slider.kt:1328
    - text: "The accessibility setProgress action is attached to semantics, outside the enabled check. When enabled=false all gesture Modifiers are removed, but screen-reader software can still call setProgress to change the value and trigger onValueChange —— a disabled slider is writable by accessibility services."
      severity: high
      evidence: miuix-ui/src/commonMain/kotlin/top/yukonga/miuix/kmp/basic/Slider.kt:245
    - text: "onDragStarted immediately computes the value from the touch position and calls back, meaning a tap anywhere on the track jumps the thumb straight there (unlike M3, where you must drag the thumb itself). There is no toggle to disable this behavior."
      severity: medium
      evidence: miuix-ui/src/commonMain/kotlin/top/yukonga/miuix/kmp/basic/Slider.kt:220
    - text: "Two require checks throw during composition rather than silently falling back: steps must be >= 0, and valueRange.start must be strictly less than endInclusive. Using 0f..0f or a reversed range crashes outright."
      severity: medium
      evidence: miuix-ui/src/commonMain/kotlin/top/yukonga/miuix/kmp/basic/Slider.kt:104
    - text: "isPressed (collectIsPressedAsState) is always false: nothing in the whole file emits a PressInteraction to interactionSource (interactionSource is only wired to hoverable and indication(_, null); draggable doesn't take it). So the thumb enlargement is driven only by dragging and mouse hover; a touchscreen 'press and hold' doesn't enlarge it. Likewise .indication(interactionSource, null) is a no-op."
      severity: low
      evidence: miuix-ui/src/commonMain/kotlin/top/yukonga/miuix/kmp/basic/Slider.kt:119
    - text: "steps > 0 and keyPoints are two mutually exclusive branches, with steps taking priority: whenever steps>0, the magnetThreshold and keyPoints snapping logic is never reached. The key-point radius in Slider is barHeight/7.5 (3.733.dp at 28.dp), while RangeSlider uses SliderDefaults.KeyPointRadius = 3.855.dp, a 3% difference when placed side by side on the same page."
      severity: low
      evidence: miuix-ui/src/commonMain/kotlin/top/yukonga/miuix/kmp/basic/Slider.kt:1264
  visual:
    track: 28.dp tall (SliderDefaults.MinHeight), clipped into a pill, width fillMaxWidth
    thumb: radius = track radius × 0.72 (diameter about 20.2.dp at 28.dp), drawn inside the track; ×1.127 on drag/hover
    press: during drag the whole track overlays a 4.4% black layer (tween 150)
    key_point: radius barHeight/7.5
  state: "Purely controlled. onValueChange fires every frame, onValueChangeFinished fires once on release. value is coerceIn'd to valueRange, and the displayed value goes through animateFloatAsState (spring(0.9,1755), stiffer, during drag; spring(0.96,322), softer, after release). Three haptic levels: None / Edge (default, only 0% and 100%) / Step."
  m3: "Corresponds to material3.Slider. Differences: no thumb/track slots; the appearance is 'a small dot embedded in a thick track' rather than 'a thin track + a large thumb outside the track'; adds keyPoints snapping, reverseDirection, hapticEffect; the touch target is only 28.dp."

VerticalSlider:
  summary: "A vertical slider, the same algorithm as Slider with height swapped for width. By default it grows from bottom to top."
  gotchas:
    - text: "The parameter effect: Boolean = false is never referenced anywhere in the function body; it is a completely dead parameter (the docs slider.md even describe it as 'whether to show a special effect'). Passing true does nothing."
      severity: high
      evidence: miuix-ui/src/commonMain/kotlin/top/yukonga/miuix/kmp/basic/Slider.kt:306
    - text: "reverseDirection's meaning is opposite to the horizontal version: horizontal false = left to right, vertical false = bottom to top (true is top to bottom). Also the vertical version doesn't read LocalLayoutDirection at all and has no RTL mirroring (which vertical genuinely doesn't need, but don't expect symmetry with the horizontal version's behavior)."
      severity: medium
      evidence: miuix-ui/src/commonMain/kotlin/top/yukonga/miuix/kmp/basic/Slider.kt:861
    - text: "The size parameter is called width (not height), and its default still reuses SliderDefaults.MinHeight = 28.dp. The length is provided by an external modifier (internally it's fillMaxHeight), so placed in a parent with unbounded height it collapses to 0."
      severity: medium
      evidence: miuix-ui/src/commonMain/kotlin/top/yukonga/miuix/kmp/basic/Slider.kt:470
    - text: "Like the horizontal Slider, when enabled=false the setProgress semantics are still writable; isPressed is likewise always false. It also doesn't attach .hoverable, so its structure is asymmetric with the horizontal version (hover detection is maintained by a bare pointerInput; functionality is unaffected)."
      severity: low
      evidence: miuix-ui/src/commonMain/kotlin/top/yukonga/miuix/kmp/basic/Slider.kt:448
  visual:
    track: 28.dp wide (default, parameter name width), height fillMaxHeight, clipped into a pill
    thumb: same as Slider, radius = track radius × 0.72
    direction: bottom to top when reverseDirection=false

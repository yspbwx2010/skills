BasicComponent:
  summary: "The layout skeleton of the entire Miuix list-item/settings-item system (all of miuix-preference is built on it); not a 'visible component'. The structure is [start slot] 8dp [title/summary or arbitrary content] 8dp [end slot], with an optional bottomAction below."
  gotchas:
    - text: "AGENTS.md:185 says it's a '2:5:3 weighted distribution', but there is no 2:5:3 in the code at all. The current implementation is: start is measured with the full maxWidth and has no cap; end goes through maxIntrinsicWidth and is hard-capped at 6/10 of the remaining width; center takes what's left. Don't compute layout results from 2:5:3."
      severity: high
      evidence: miuix-ui/src/commonMain/kotlin/top/yukonga/miuix/kmp/basic/Component.kt:217
    - text: "The endActions slot is measured with maxIntrinsicWidth. Putting a component that doesn't support intrinsic measurement (LazyRow/LazyColumn and the like) into it throws outright. The end slot should only hold things with a computable intrinsic width, like switches, arrows, and short text."
      severity: high
      evidence: miuix-ui/src/commonMain/kotlin/top/yukonga/miuix/kmp/basic/Component.kt:216
    - text: "startAction has no width cap at all (measured with the full maxWidth). The design assumes it's an icon or a small avatar; putting a long Text into it eats the whole row, squeezing center to 0 width and stacking the text vertically one character at a time."
      severity: high
      evidence: miuix-ui/src/commonMain/kotlin/top/yukonga/miuix/kmp/basic/Component.kt:211
    - text: "heightIn(min = 56.dp) and fillMaxWidth() are both placed after modifier and are forced: a list item always fills the width and is at least 56.dp tall, and can't be made into a wrap-content inline element."
      severity: medium
      evidence: miuix-ui/src/commonMain/kotlin/top/yukonga/miuix/kmp/basic/Component.kt:161
    - text: "The custom Layout guards height against Constraints.Infinity but not width (layout(width = maxWidth, ...) uses maxWidth directly). Putting BasicComponent in a horizontally scrollable parent (horizontalScroll / LazyRow) yields an infinite-width constraint. This path has no guard."
      severity: medium
      evidence: miuix-ui/src/commonMain/kotlin/top/yukonga/miuix/kmp/basic/Component.kt:236
    - text: "The convenience overload's title/summary take only the fontSize from textStyles (title additionally hardcodes FontWeight.Medium), not the whole TextStyle —— properties like lineHeight in headline1/body2 won't take effect. For full typography control switch to the overload with a content slot."
      severity: medium
      evidence: miuix-ui/src/commonMain/kotlin/top/yukonga/miuix/kmp/basic/Component.kt:92
    - text: "The KDoc explicitly requires interactionSource to stay 'always null' or 'always non-null' over the component's lifecycle; switching midway reallocates the internal source and drops unfinished interactions."
      severity: low
      evidence: miuix-ui/src/commonMain/kotlin/top/yukonga/miuix/kmp/basic/Component.kt:55
    - text: "When both start and end are null it takes a fast path (a plain Column), bypassing the custom Layout and intrinsic measurement entirely. Only when the two side slots are actually needed do you pay the cost of intrinsic measurement."
      severity: low
      evidence: miuix-ui/src/commonMain/kotlin/top/yukonga/miuix/kmp/basic/Component.kt:167
  visual:
    min_height: 56.dp (heightIn, forced)
    inside_margin: PaddingValues(16.dp)
    column_gap: 8.dp (hardcoded, not configurable)
    end_cap: the end slot takes at most 60% of 'the width remaining after deducting start and the gaps', and shrinks by intrinsic (if the content isn't wide it doesn't take the space)
    bottom_gap: 8.dp between bottomAction and the main row
  state: "Purely stateless. onClick is nullable; when null or enabled=false no clickable is installed. clickableModifier is cached with remember, keyed on the boolean onClick != null rather than the lambda itself (the lambda is held by rememberUpdatedState), so a freshly created lambda each frame doesn't rebuild the Modifier chain. holdDownState goes through HoldDownObserver. The three columns are each vertically centered, and end sticks to the right via placeRelative (auto-mirrored in RTL)."
  m3: "Corresponds to material3.ListItem. Differences: Miuix uses a custom Layout + intrinsic measurement for the three-column distribution (AGENTS.md explicitly forbids changing it to Row + weight(1f); a past change caused text to stack vertically one character at a time when start/end overflowed); no ListItemColors multi-slot coloring, only titleColor/summaryColor; none of the leadingContent/trailingContent/overlineContent/supportingContent naming."

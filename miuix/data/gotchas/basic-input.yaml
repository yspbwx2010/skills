  m3: "No counterpart (Material3 has no official vertical Slider)."

RangeSlider:
  summary: "A two-thumb range slider. It has cross-over takeover logic (once the two values coincide, pushing further automatically switches which side is being dragged)."
  gotchas:
    - text: "Accessibility is incomplete: semantics has only a stateDescription string, no progressBarRangeInfo and no setProgress (both of which Slider and VerticalSlider have). A screen reader can read out the current range but cannot adjust it at all."
      severity: high
      evidence: miuix-ui/src/commonMain/kotlin/top/yukonga/miuix/kmp/basic/Slider.kt:793
    - text: "During a drag it ignores the externally passed value (it only syncs its local mirror when !isDragging). So a controlled pattern like 'clamp/quantize the value in onValueChange and write it back' doesn't take effect during the drag; only after release is it overwritten by the external value."
      severity: medium
      evidence: miuix-ui/src/commonMain/kotlin/top/yukonga/miuix/kmp/basic/Slider.kt:538
    - text: "There is no reverseDirection parameter (direction only auto-mirrors with RTL), and no 'minimum gap' parameter —— the two thumbs can fully coincide, and pushing further after coinciding triggers cross-over takeover, switching the drag target."
      severity: medium
      evidence: miuix-ui/src/commonMain/kotlin/top/yukonga/miuix/kmp/basic/Slider.kt:498
    - text: "value is of type ClosedFloatingPointRange<Float>, written as a..b; it is likewise subject to require(valueRange.start < endInclusive), so a degenerate range crashes during composition. The key-point radius here uses SliderDefaults.KeyPointRadius (3.855.dp), inconsistent with Slider's barHeight/7.5."
      severity: low
      evidence: miuix-ui/src/commonMain/kotlin/top/yukonga/miuix/kmp/basic/Slider.kt:991
  visual:
    track: 28.dp tall (height parameter), the span between the two thumbs is the foreground color
    thumb: two of them, radius = track radius × 0.72, each with independent hover/drag scaling
    key_point: radius SliderDefaults.KeyPointRadius = 3.855.dp
  state: "Controlled + a local mirror during drag. onValueChange returns a new ClosedFloatingPointRange. Haptics are managed per side by RangeSliderHapticState, and on cross-over takeover the key-point state is handed over to the other side to avoid duplicate haptics."
  m3: "Corresponds to material3.RangeSlider. Differences: no startThumb/endThumb/track slots; no setProgress accessibility action; adds keyPoints snapping and hapticEffect."

NumberPicker:
  summary: "An inertial wheel number picker (the kind in the HyperOS time picker). It simulates depth with scaling + fade, with no 3D cylindrical perspective."
  gotchas:
    - text: "Two require checks throw during composition: visibleItemCount must be odd and >= 3, and range must not be empty. Writing visibleItemCount = 4 crashes outright, not silently rounded."
      severity: high
      evidence: miuix-ui/src/commonMain/kotlin/top/yukonga/miuix/kmp/basic/NumberPicker.kt:82
    - text: "It hardcodes fillMaxWidth() internally, placed after modifier. When several NumberPickers are placed side by side in a Row (the most common hour/minute/second usage), each grabs the full width and causes overflow —— you must pass Modifier.weight(1f) to each."
      severity: high
      evidence: miuix-ui/src/commonMain/kotlin/top/yukonga/miuix/kmp/basic/NumberPicker.kt:161
    - text: "Fully controlled: after release-and-snap it calls onValueChange(newValue) and immediately snapTo(0f) on the internal offset. If the caller doesn't write the new value back to value (or writes it back a frame late), the view instantly snaps back to the old value. You must never ignore onValueChange."
      severity: high
      evidence: miuix-ui/src/commonMain/kotlin/top/yukonga/miuix/kmp/basic/NumberPicker.kt:217
    - text: "The height is hardcoded to itemHeight × visibleItemCount (default 45 × 5 = 225.dp), and a height given by an external modifier is overridden. To change the height you can only adjust itemHeight or visibleItemCount."
      severity: medium
      evidence: miuix-ui/src/commonMain/kotlin/top/yukonga/miuix/kmp/basic/NumberPicker.kt:162
    - text: "All item rendering is wrapped in if (itemHeightPx > 0), and itemHeightPx only gets a value after onSizeChanged returns —— the wheel is blank on the first composition frame. When it appears in a dialog/BottomSheet you may see a one-frame blank."
      severity: low
      evidence: miuix-ui/src/commonMain/kotlin/top/yukonga/miuix/kmp/basic/NumberPicker.kt:231
    - text: "itemHeightPx = size.height / visibleItemCount is integer division, so at densities where 45.dp converts to a non-divisible pixel count it accumulates a few pixels of error, showing as a slight deviation between the wheel item spacing and itemHeight."
      severity: low
      evidence: miuix-ui/src/commonMain/kotlin/top/yukonga/miuix/kmp/basic/NumberPicker.kt:168
  visual:
    item_height: 45.dp (NumberPickerDefaults.ItemHeight)
    total_height: itemHeight × visibleItemCount (default 225.dp, not changeable via modifier)
    text: default textStyles.title1 (32.sp); if the passed style's fontWeight is null it auto-fills SemiBold
    falloff: "alpha = (1-d)(1-0.5d), scale = 1-0.2d, color linearly interpolated between selected↔unselected (d is the normalized distance from center)"
  state: "Purely controlled. value must be updated externally in response to onValueChange. Drag offset and inertial offset are two separate things (dragOffset + Animatable), and after release it runs a four-step coroutine 'transfer → decay → snap → commit → reset'. It fires a haptic each time it crosses an item, and an isUserScrolling gate ensures programmatic value changes don't fire haptics."
  m3: "No counterpart (Material3 has no wheel picker). The closest is M3's internal TimePicker implementation, but it's not exposed as a public component."

Badge:
  summary: "The red-dot/number badge itself. With no content it's a 6.dp dot; with content it's a pill of at least 16.dp. It usually goes into BadgedBox's badge slot."
  gotchas:
    - text: "Badge itself does no positioning; it's just a rounded Row; the 'floating at the top-right' effect comes entirely from BadgedBox. Using Badge alone you must offset it yourself."
      severity: low
      evidence: miuix-ui/src/commonMain/kotlin/top/yukonga/miuix/kmp/basic/Badge.kt:143
    - text: "With content it overrides the entire LocalTextStyles via CompositionLocalProvider (replacing main with footnote2 + a 16.sp line height, centered). So a Text inside the badge gets a different default style than outside; this is to keep the number vertically centered under cross-platform font metrics, so don't manually change lineHeight inside it."
      severity: low
      evidence: miuix-ui/src/commonMain/kotlin/top/yukonga/miuix/kmp/basic/Badge.kt:163
  visual:
    dot_size: 6.dp (BadgeDefaults.Size, when no content)
    with_content: minimum 16.dp (LargeSize), plus 4.dp padding on each side
    shape: CircleShape
    colors: error background / onError text
  state: "Purely stateless. content is nullable; whether there is content decides the size and padding."
  m3: "Corresponds to material3.Badge. The structure is essentially a port of M3 (the same layoutId/Ruler mechanism), with minor numeric tweaks."

BadgedBox:
  summary: "A layout container that hangs a badge at the anchor's top-right. Its own size exactly equals the anchor, and the badge is drawn overflowing beyond the bounds."
  gotchas:
    - text: "The badge measurement only clears minHeight; minWidth is passed through as-is (the comment says 'we don't want the text to take more space than needed', but it only handles height). Once BadgedBox lands in a parent with minWidth > 0 (a fillMaxWidth Row/Column, or any propagateMinConstraints=true container like Card/Surface/Button), the badge is stretched to full width, so hasContent = badgePlaceable.width > 6.dp is inevitably misjudged as true, the whole set of offsets takes the wrong branch (using 12/14.dp instead of 6.dp), and the badge position shifts overall. Workaround: wrap BadgedBox in something like wrapContentWidth to break the minimum-width constraint."
      severity: high
      evidence: miuix-ui/src/commonMain/kotlin/top/yukonga/miuix/kmp/basic/Badge.kt:74
    - text: "The layout's width and height are taken entirely from the anchor's size. A badge with content (height ≥16.dp, offset 12/14.dp) has a negative y and also overflows on the right, so it gets clipped by an ancestor's clipToBounds / clip(shape) (e.g. Card's squircleSurface, Surface's clip); to leave room you must add padding to the anchor yourself. The content-less 6.dp dot computes x = anchorWidth-6, y = 0, sitting exactly at the edge without overflowing, unaffected by clipping."
      severity: high
      evidence: miuix-ui/src/commonMain/kotlin/top/yukonga/miuix/kmp/basic/Badge.kt:84
    - text: "It has a built-in Ruler clamping mechanism (BadgeTopRuler/BadgeEndRuler) to keep the badge from crossing a certain ancestor boundary, but the Modifier.badgeBounds() that provides the ruler is internal and unusable outside the library. When no ancestor provides one it degrades to 'no clamping'."
      severity: medium
      evidence: miuix-ui/src/commonMain/kotlin/top/yukonga/miuix/kmp/basic/Badge.kt:238
    - text: "'Whether there is content' is inferred from the badge's measured width > 6.dp, not from whether content is null. Adding Modifier.size(10.dp) to a content-less Badge makes it judged as having content and positioned with the 12/14.dp offset."
      severity: medium
      evidence: miuix-ui/src/commonMain/kotlin/top/yukonga/miuix/kmp/basic/Badge.kt:93
  visual:
    offset_no_content: 6.dp both horizontal and vertical
    offset_with_content: horizontal 12.dp / vertical 14.dp
    baseline: forwards only the anchor's FirstBaseline/LastBaseline; text inside the badge doesn't pollute the parent's baseline alignment
  state: "A purely stateless layout. The badge parameter is required and comes first; content (the anchor) is the trailing lambda."
  m3: "Corresponds to material3.BadgedBox. The structure shares an origin, but the M3 version's minWidth handling and offset constants may differ; the Miuix version's failure to zero out minWidth is a genuine behavioral defect."

HorizontalDivider:
  summary: "A horizontal divider. Implemented with Canvas + drawLine (not Box + background), default 0.75.dp, color dividerLine."
  gotchas:
    - text: "It hardcodes fillMaxWidth() internally and always fills the available width. For a list divider with 'left indentation', you can only add padding in the passed-in modifier (padding takes effect before fillMaxWidth); you can't narrow it via width/wrapContentWidth."

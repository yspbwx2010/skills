# Basic input and content controls
# Evidence paths are relative to the miuix repo root (https://github.com/compose-miuix-ui/miuix)
# Common prefix ui/basic/ = miuix-ui/src/commonMain/kotlin/top/yukonga/miuix/kmp/basic/

Button:
  summary: "Miuix's basic button, squircle corners + content slot (RowScope). The default is a gray-background button; for a blue-background primary button you must explicitly swap colors."
  gotchas:
    - text: "The default colors is buttonColors(), whose background is secondaryVariant (light theme 0xFFF0F0F0, a near-white gray; dark 0xFF434343), not the theme color. Writing Button(onClick){Text(\"OK\")} per M3 intuition gives a gray button; for a blue background with white text you must explicitly pass colors = ButtonDefaults.buttonColorsPrimary()."
      severity: medium
      evidence: miuix-ui/src/commonMain/kotlin/top/yukonga/miuix/kmp/basic/Button.kt:181
    - text: "There is no shape parameter, only cornerRadius(Dp); no elevation / tonalElevation / contentPadding. Shapes other than a rounded rectangle (e.g. a cut corner) are impossible; you can only change the radius. The padding parameter is called insideMargin."
      severity: medium
      evidence: miuix-ui/src/commonMain/kotlin/top/yukonga/miuix/kmp/basic/Button.kt:76
    - text: "Button's content slot injects no text style; a bare Text inside it gets LocalTextStyles.main (17sp) rather than textStyles.button; only TextButton explicitly applies textStyles.button. The two happen to both be 17sp, so no difference shows today, but relying on this is unsafe."
      severity: low
      evidence: miuix-ui/src/commonMain/kotlin/top/yukonga/miuix/kmp/basic/Button.kt:147
    - text: "minWidth/minHeight go through defaultMinSize and can be overridden by an external modifier's size/widthIn (the opposite of Switch/Checkbox's requiredSize)."
      severity: low
      evidence: miuix-ui/src/commonMain/kotlin/top/yukonga/miuix/kmp/basic/Button.kt:67
  visual:
    min_size: 58×40.dp (defaultMinSize, overridable by modifier)
    corner: 16.dp squircle (not RoundedCornerShape)
    inside_margin: "horizontal 16.dp / vertical 13.dp"
  state: "Purely stateless. onClick is required and non-null; when enabled=false, clickable is turned off and it switches to disabledColor/disabledContentColor. contentColor is propagated via CompositionLocalProvider(LocalContentColor), so the inner Icon/Text follow the color automatically."
  m3: "Corresponds to androidx.compose.material3.Button. Differences: the default fill is gray, not primary; no elevation/ripple (press feedback comes from MiuixIndication's alpha overlay); shape→cornerRadius:Dp; contentPadding→insideMargin; none of the ElevatedButton/OutlinedButton/FilledTonalButton variants."

TextButton:
  summary: "A convenience wrapper for a button with text; internally it maps TextButtonColors to ButtonColors and delegates to Button. Note it also has a background by default."
  gotchas:
    - text: "colors is of type TextButtonColors, not ButtonColors; the two classes' fields correspond one-to-one but with different names (contentColor vs textColor). Passing ButtonDefaults.buttonColorsPrimary() to TextButton fails to compile; you must use textButtonColorsPrimary()."
      severity: high
      evidence: miuix-ui/src/commonMain/kotlin/top/yukonga/miuix/kmp/basic/Button.kt:119
    - text: "The default background is secondaryVariant (gray), not transparent. M3's TextButton is a background-less text-only button; Miuix's TextButton is just 'Button + an auto-wrapped Text' and looks exactly like Button. For a transparent button you must pass color = Color.Transparent yourself."
      severity: high
      evidence: miuix-ui/src/commonMain/kotlin/top/yukonga/miuix/kmp/basic/Button.kt:217
    - text: "There is no content slot; you can only pass a String. To place an icon + text, use Button directly. textStyle is nullable; when null it uses MiuixTheme.textStyles.button."
      severity: low
      evidence: miuix-ui/src/commonMain/kotlin/top/yukonga/miuix/kmp/basic/Button.kt:121
  visual:
    min_size: 58×40.dp (same as Button)
    corner: 16.dp squircle
  state: "Purely stateless; all parameters are passed through to Button."
  m3: "Corresponds to material3.TextButton. The differences are large: M3's TextButton has no background and no border, while Miuix's has a gray fill by default; and its colors type is separate and not interchangeable with Button's."

IconButton:
  summary: "An icon-only button, transparent background by default, 40×40, fully pill-shaped corners. Commonly used in TopAppBar / toolbars."
  gotchas:
    - text: "enabled=false merely swaps the whole clickable for an empty Modifier and does no graying-out. A disabled-state icon looks identical to the enabled state, so users can't tell it isn't clickable. To show disabled state you must dim the Icon tint in content yourself."
      severity: high
      evidence: miuix-ui/src/commonMain/kotlin/top/yukonga/miuix/kmp/basic/IconButton.kt:63
    - text: "There is no IconButtonColors class, only a bare backgroundColor: Color, defaulting to Color.Unspecified (transparent). There is also no contentColor —— the icon color is entirely decided by the external LocalContentColor; IconButton injects none."
      severity: medium
      evidence: miuix-ui/src/commonMain/kotlin/top/yukonga/miuix/kmp/basic/IconButton.kt:45
    - text: "It exposes no interactionSource / indication parameter and builds its own MutableInteractionSource internally. To observe the pressed state externally you can only drive it in reverse via holdDownState (which mirrors the boolean into a HoldDownInteraction)."
      severity: low
      evidence: miuix-ui/src/commonMain/kotlin/top/yukonga/miuix/kmp/basic/IconButton.kt:51
  visual:
    min_size: 40×40.dp (defaultMinSize, overridable)
    corner: 40.dp squircle —— equals MinHeight, i.e. fully pill/circular by default
  state: "Purely stateless. onClick is required. When holdDownState=true it stays in the pressed visual (used for 'menu is open, keep the anchor highlighted')."
  m3: "Corresponds to material3.IconButton. Differences: M3 has IconButtonColors (including disabledContentColor) that automatically grays the disabled-state icon, which Miuix does not do at all; M3 defaults to a 48dp touch target, Miuix is 40dp with no minimumInteractiveComponentSize compensation."

FloatingActionButton:
  summary: "A floating action button, 60×60 true circle (built on Surface + CircleShape, not squircle), with a 4.dp shadow."
  gotchas:
    - text: "When it delegates to Surface it passes only color=containerColor and no contentColor, so Surface uses the default MiuixTheme.colorScheme.onSurface to provide LocalContentColor. Result: the Icon in the default blue FAB gets onSurface (a dark text color) instead of onPrimary, which in a light theme is a 'blue background with a black icon'. You must explicitly write tint = MiuixTheme.colorScheme.onPrimary in content —— example/shared/src/commonMain/kotlin/AppContent.kt:645 does exactly this, but the example in the official docs docs/components/floatingactionbutton.md:24 omits it, so copying the docs gives the wrong contrast."
      severity: high
      evidence: miuix-ui/src/commonMain/kotlin/top/yukonga/miuix/kmp/basic/FloatingActionButton.kt:46
    - text: "It is the only button at this layer that still exposes shape: Shape (default CircleShape), because it builds on Surface rather than squircleSurface. So the FAB is a mathematically exact circle, not the same curvature as the squircle outline of adjacent Card/Button."
      severity: low
      evidence: miuix-ui/src/commonMain/kotlin/top/yukonga/miuix/kmp/basic/FloatingActionButton.kt:39
    - text: "There is no enabled parameter, so it can't be disabled; there is also no extended (icon + text) variant, and the width is driven by content (minWidth is only defaultMinSize)."
      severity: medium
      evidence: miuix-ui/src/commonMain/kotlin/top/yukonga/miuix/kmp/basic/FloatingActionButton.kt:36
  visual:
    min_size: 60×60.dp (defaultMinSize)
    shape: CircleShape (true circle, not squircle)
    shadow: 4.dp (graphicsLayer shadowElevation, clip=false)
  state: "Purely stateless, marked @NonRestartableComposable. Positioning/avoidance is left entirely to the caller (Scaffold has a floatingActionButton slot)."
  m3: "Corresponds to material3.FloatingActionButton. Differences: no elevation state changes (no rise on press), no SmallFAB/LargeFAB/ExtendedFAB variants, no enabled, and the content color is not automatically taken as onPrimary (see above)."

Card:
  summary: "A rounded-corner container with two overloads: one with no input and one with onClick/onLongPress. Default padding is 0; it is often used as the shell around a list item, wrapping a BasicComponent."
  gotchas:
    - text: "insideMargin defaults to PaddingValues(0.dp), not 16.dp. Dropping a Text into a Card per M3 intuition makes it hug the edge. This is deliberate (it usually holds a BasicComponent/Preference that carries its own 16.dp padding), but placing custom content directly requires passing insideMargin yourself."
      severity: high
      evidence: miuix-ui/src/commonMain/kotlin/top/yukonga/miuix/kmp/basic/Card.kt:195
    - text: "The clickable overload's pressFeedbackType defaults to None and showIndication defaults to false —— meaning a Card given an onClick has no visual feedback on tap by default. For a sink animation pass pressFeedbackType = PressFeedbackType.Sink (or Tilt); for an alpha overlay pass showIndication = true; the two are independent channels."
      severity: high
      evidence: miuix-ui/src/commonMain/kotlin/top/yukonga/miuix/kmp/basic/Card.kt:92
    - text: "The two overloads share exactly the same leading parameters and all have defaults, so `Card { }` resolves to the no-input overload (Kotlin picks the more specific, fewer-parameter overload). Passing any named parameter unique to the interactive overload (any one of pressFeedbackType / showIndication / holdDownState / onClick / onLongPress) resolves to the interactive overload. But only onClick and onLongPress actually make it clickable —— Card.kt:118 `isClickable = hasOnClick || hasLongPress`, so writing only showIndication = true gives a Card that took the interactive overload yet installs no combinedClickable, and tapping it does nothing."
      severity: medium
      evidence: miuix-ui/src/commonMain/kotlin/top/yukonga/miuix/kmp/basic/Card.kt:87
    - text: "Press feedback uses pressable(delay = null), skipping Pressable's default 150ms TAP_INDICATION_DELAY (that delay exists to distinguish 'press' from 'start scrolling'). Put a Card with Sink/Tilt in a scrollable list and swiping a finger across it triggers the sink animation immediately."
      severity: medium
      evidence: miuix-ui/src/commonMain/kotlin/top/yukonga/miuix/kmp/basic/Card.kt:140
  visual:
    corner: 16.dp squircle
    inside_margin: PaddingValues(0.dp) (no padding by default)
    colors: surfaceContainer / onSurfaceContainer
  state: "Purely stateless. onClick / onLongPress are both nullable; when both are null no combinedClickable is installed. holdDownState goes through HoldDownObserver. Physical feedback (Sink/Tilt) is attached to the card's outer modifier, and the alpha overlay is attached to the inner Column."
  m3: "Corresponds to material3.Card / Card(onClick=). Differences: no elevation/border/CardColors 4-color system (only color+contentColor); a tap has no ripple and no feedback by default; default contentPadding is 0 (M3 is also 0, but M3's ListItem is not); adds the pressFeedbackType physical-deformation feedback."

Surface:
  summary: "The lowest-level container primitive: shape + background + optional border + optional shadow. It is the only container at this layer that still accepts an arbitrary Shape, and FloatingActionButton is built on top of it."
  gotchas:
    - text: "The default shape is RectangleShape, not rounded. For rounded corners you must pass shape yourself; and it uses a standard Compose Shape rather than squircle, so its outline curvature differs from Card/Button and the difference shows when mixed."
      severity: medium
      evidence: miuix-ui/src/commonMain/kotlin/top/yukonga/miuix/kmp/basic/Surface.kt:150
    - text: "The non-interactive overload adds semantics{isTraversalGroup = true}; the overload with onClick does not. That means a clickable Surface is not an accessibility traversal group, so screen-reader order may differ from what you expect."
      severity: low
      evidence: miuix-ui/src/commonMain/kotlin/top/yukonga/miuix/kmp/basic/Surface.kt:107
    - text: "A graphicsLayer is inserted only when shadowElevation>0, with clip=false —— the shadow is drawn outside the clip. The background is drawn by background() after clip(shape), so the border is clipped by the shape. There is no tonalElevation (Miuix does no elevation tonal lightening)."
      severity: low
      evidence: miuix-ui/src/commonMain/kotlin/top/yukonga/miuix/kmp/basic/Surface.kt:134
  visual:
    shape: RectangleShape (default)
    shadow: 0.dp (no shadow by default)
    colors: surface / onSurface
  state: "Purely stateless. Two overloads: one without onClick and one with. Both have propagateMinConstraints=true (min constraints are passed to content) and propagate contentColor via LocalContentColor."
  m3: "Corresponds to material3.Surface. Differences: no tonalElevation (M3 uses it for dark-mode lightening), only shadowElevation; no checked/selected overloads."

Text:
  summary: "A thin wrapper over BasicText; the default style is taken from LocalTextStyles.current.main (17sp). Four overloads: String/AnnotatedString × Color/ColorProducer."
  gotchas:
    - text: "LocalTextStyles is internal and unavailable outside the library, so you can't use CompositionLocalProvider to swap the default text style for a subtree. To override locally you can only nest MiuixTheme(textStyles = ...) (copying the entire 14-item TextStyles bag), or pass style explicitly on every Text. Miuix also has no single-value LocalTextStyle like M3's."
      severity: high
      evidence: miuix-ui/src/commonMain/kotlin/top/yukonga/miuix/kmp/theme/TextStyles.kt:250
    - text: "The color fallback chain is explicit color → style.color → LocalContentColor, and LocalContentColor's default is Color.Black. MiuixTheme's controller overload provides LocalContentColor, but the MiuixTheme(colors = ...) overload does not —— with the latter in a dark theme, a Text with no explicit color will be black text on a black background."
      severity: high
      evidence: miuix-ui/src/commonMain/kotlin/top/yukonga/miuix/kmp/theme/MiuixTheme.kt:62
    - text: "The ColorProducer overload's lambda is not a composable context (ColorProducer is an ordinary fun interface, and Text is not inline), so writing MiuixTheme.colorScheme.xxx inside it fails to compile. The theme color must be read outside first and then passed into the lambda. The example in the docs components/text.md is wrong."
      severity: high
      evidence: miuix-ui/src/commonMain/kotlin/top/yukonga/miuix/kmp/basic/Text.kt:191
    - text: "The AnnotatedString overload automatically adds 'primary color + underline' to every LinkAnnotation that doesn't already carry a style. For a different link style you must fill in styles when constructing the AnnotatedString, or it will be overwritten."
      severity: medium
      evidence: miuix-ui/src/commonMain/kotlin/top/yukonga/miuix/kmp/basic/Text.kt:315
    - text: "Within the same file onTextLayout has two signatures: the String overload is ((TextLayoutResult)->Unit)? = null, and the AnnotatedString overload is (TextLayoutResult)->Unit = {}. Passing null when switching overloads fails to compile."
      severity: low
      evidence: miuix-ui/src/commonMain/kotlin/top/yukonga/miuix/kmp/basic/Text.kt:309
    - text: "The AnnotatedString overload's inlineContent is a bare Map, which is unstable to Compose and prevents this Text from skipping recomposition."
      severity: low
      evidence: miuix-ui/src/commonMain/kotlin/top/yukonga/miuix/kmp/basic/Text.kt:308
  visual:
    default_style: LocalTextStyles.current.main = 17.sp
    overflow: TextOverflow.Clip (no ellipsis by default)
  state: "Purely stateless. The ColorProducer overload is a zero-recomposition channel for 'high-frequency color changes'; the color is read at draw time, skipping the entire color fallback chain."
  m3: "Corresponds to material3.Text. Differences: the default style comes from LocalTextStyles.main rather than an externally providable LocalTextStyle; the theme's text styles are a 14-item bag, and you can't override just one item; it adds automatic link coloring."

TextField:
  summary: "A filled text field, squircle background + a 2.dp border that grows on focus + a floating label. Three overloads correspond to the TextFieldState / TextFieldValue / String state models."
  gotchas:
    - text: "In the TextFieldState overload, remember(label, useLabelAsPlaceholder){ derivedStateOf { … state.text … } } has no state in its key, yet the closure reads it. After swapping the TextFieldState instance (e.g. rebuilding state per form-field id, or switching the edited object at the same position), the label state machine keeps watching the old instance forever: typing in the new field doesn't float the label up, and clearing doesn't drop it back. The other two overloads put the value in the key; only this one doesn't. Workaround: wrap this position in key(state){ … } or use the String overload."
      severity: high
      evidence: miuix-ui/src/commonMain/kotlin/top/yukonga/miuix/kmp/basic/TextField.kt:108
    - text: "TextFieldColors has only three fields — backgroundColor / labelColor / borderColor — with no disabled or error variants. A field with enabled=false looks exactly like an enabled one (it just doesn't respond to input), and the error state has no built-in appearance at all —— you must draw it yourself."
      severity: high
      evidence: miuix-ui/src/commonMain/kotlin/top/yukonga/miuix/kmp/basic/TextField.kt:419
    - text: "There are no placeholder / supportingText / isError / prefix / suffix / shape parameters, and no OutlinedTextField variant. The placeholder role is served by label + useLabelAsPlaceholder=true (when there is text the label simply isn't drawn, rather than floating up)."
      severity: medium
      evidence: miuix-ui/src/commonMain/kotlin/top/yukonga/miuix/kmp/basic/TextField.kt:89
    - text: "insideMargin is a DpSize (a horizontal and a vertical value) rather than PaddingValues, so asymmetric padding is impossible. Also the label and the input area are overlaid in the same Box, offset by ±insideMargin.height/2, so shrinking insideMargin.height clips the floated-up label."
      severity: medium
      evidence: miuix-ui/src/commonMain/kotlin/top/yukonga/miuix/kmp/basic/TextField.kt:379
    - text: "The label's font-size animation is carried by animateDpAsState and consumed via `.value.sp` (Compose has no ready-made TextUnit animation, TextField.kt:451/525). Note Dp is only the animation carrier; after `.value` takes the raw Float it still sets fontSize in sp, so the label size scales with system font size like the body text. What does not scale is the float-up offset ±insideMargin.height/2 (DpSize, TextField.kt:446/533): with a larger font the gap between label and body text doesn't grow proportionally, so the floated-up state may sit too close."
      severity: medium
      evidence: miuix-ui/src/commonMain/kotlin/top/yukonga/miuix/kmp/basic/TextField.kt:525
  visual:
    corner: 16.dp squircle
    inside_margin: DpSize(16.dp, 16.dp)
    border: 0.dp when unfocused, animates up to 2.dp on focus, color gradients from backgroundColor to primary
    label_font: "17 in resting state (dp used as sp), 10 when floated up"
    colors: secondaryContainer background / onSecondaryContainer label / primary border and cursor
  state: "Choose one of three models: TextFieldState (self-holding, recommended), TextFieldValue+onValueChange, or String+onValueChange (the latter two are purely controlled). The focus state is driven by interactionSource.collectIsFocusedAsState, and when null is passed it is built internally. cursorBrush defaults to colors.borderColor."
  m3: "Corresponds to material3.TextField / OutlinedTextField. Differences: only one appearance (filled squircle); no isError/supportingText/placeholder/prefix/suffix; no disabled colors; the focus indicator is a border growing from 0 to 2.dp rather than an underline."

InputField:
  summary: "A pill-shaped input field dedicated to SearchBar (defined in SearchBar.kt, not TextField.kt). It ships with a search icon, a clear button, and an IME Search action, and must be used paired with the expanded state."
  gotchas:
    - text: "It clears the text on collapse: in LaunchedEffect(expanded), when expanded becomes false and it currently has focus, it delays(100), fades the text out, and calls onQueryChange(\"\"). That is, collapsing the search box = discarding the user's input; this is not optional and there is no toggle."
      severity: high
      evidence: miuix-ui/src/commonMain/kotlin/top/yukonga/miuix/kmp/basic/SearchBar.kt:302
    - text: "In onFocusChanged, as soon as it gains focus it unconditionally calls onExpandedChange(true). So expanded / onExpandedChange must actually be wired to a state; using it as an ordinary input field (writing onExpandedChange as an empty lambda) makes it fail to expand on tap and gives wrong keyboard and clear-button behavior."
      severity: high
      evidence: miuix-ui/src/commonMain/kotlin/top/yukonga/miuix/kmp/basic/SearchBar.kt:242
    - text: "On Android SDK ≤ 27 there is a system bug in focus reassignment (issuetracker 433382598). The code's workaround is: in the collapsed state, set BasicTextField's enabled to false and take over taps via pointerInput. The condition is `hasFocusReassignBug = Build.VERSION.SDK_INT <= Build.VERSION_CODES.O_MR1` (miuix-core/src/androidMain/kotlin/top/yukonga/miuix/kmp/utils/Utils.android.kt:24), and the library's minSdk is 24 (build-plugins/src/main/kotlin/BuildConfig.kt:14), so it actually affects API 24-27 (the comment at SearchBar.kt:226 says 'API 26-27', which is narrower than the implementation). On these versions the collapsed-state InputField is not a truly enabled input field."
      severity: medium
      evidence: miuix-ui/src/commonMain/kotlin/top/yukonga/miuix/kmp/basic/SearchBar.kt:249
    - text: "If leadingIcon/trailingIcon are not passed, you get the built-in search icon and clear button (the clear button fades in only when query is non-empty, and a tap calls onQueryChange(\"\")). Passing custom icons removes the clear functionality entirely and you must implement it yourself. The default background is surfaceContainerHigh; to draw your own background (e.g. a blur backdrop) pass color = Color.Transparent."
      severity: low
      evidence: miuix-ui/src/commonMain/kotlin/top/yukonga/miuix/kmp/basic/SearchBar.kt:188
  visual:
    shape: CircleShape pill
    min_height: 45.dp (SearchBarDefaults.InputFieldMinHeight)
    label_font: 17.sp Medium
    icon_padding: "leading icon start 16 / end 8, trailing icon start 8 / end 16"
  state: "Purely controlled and tightly coupled: the four-piece set query/onQueryChange and expanded/onExpandedChange are all required. singleLine is hardcoded to true and imeAction hardcoded to Search. The text style = textStyles.main + Medium, then merged with the caller's textStyle, and the color is forced to LocalContentColor."
  m3: "Corresponds to material3.SearchBarDefaults.InputField. Behavior is close, but the Miuix version actively clears query on collapse and has no placeholder parameter (label serves that role)."

Checkbox:
  summary: "A tri-state checkbox, circular (not square), fixed 26.dp size; the check mark is a hand-drawn animation clipped by arc length."
  gotchas:
    - text: "The API is Checkbox(state: ToggleableState, onClick: (() -> Unit)?); there is no Boolean + onCheckedChange overload. Writing Checkbox(checked = x, onCheckedChange = { }) per M3 fails to compile. The correct form passes ToggleableState(bool) (or On/Off/Indeterminate), with onClick taking no argument and the caller computing the next state itself."
      severity: high
      evidence: miuix-ui/src/commonMain/kotlin/top/yukonga/miuix/kmp/basic/Checkbox.kt:60
    - text: "The size uses requiredSize(26.dp) placed after modifier, so it ignores externally passed constraints. Wrapping it in Modifier.size(40.dp) or sizeIn(min = 48.dp) changes nothing —— the touch hit area is always 26.dp (below the 48dp accessibility minimum target, with no compensating padding). To enlarge the hit area you must wrap it in your own clickable Box."
      severity: high
      evidence: miuix-ui/src/commonMain/kotlin/top/yukonga/miuix/kmp/basic/Checkbox.kt:173
    - text: "Miuix's Checkbox is circular (CircleShape); the unchecked state is a filled gray circle (uncheckedBackgroundColor = secondary), not M3's hollow rounded square. Visually it belongs to the same family as Switch/RadioButton and matches no M3 design mockup."
      severity: medium
      evidence: miuix-ui/src/commonMain/kotlin/top/yukonga/miuix/kmp/basic/Checkbox.kt:141
    - text: "The sink feedback (SinkFeedback 0.85) is attached via pressable and controlled by the enabled parameter, not by onClick. A 'read-only' checkbox with onClick=null still shrinks a bit when pressed but its state doesn't change, which is easily mistaken for a broken tap. For it to be fully silent you also need enabled=false."
      severity: medium
      evidence: miuix-ui/src/commonMain/kotlin/top/yukonga/miuix/kmp/basic/Checkbox.kt:174
    - text: "The internal triStateToggleable is passed a null interactionSource, pressable uses its own private source, and the component exposes no interactionSource parameter. There is no way to observe its pressed/hovered state externally."
      severity: low
      evidence: miuix-ui/src/commonMain/kotlin/top/yukonga/miuix/kmp/basic/Checkbox.kt:160
  visual:
    size: 26×26.dp (requiredSize, not adjustable via modifier)
    shape: CircleShape (circular)
    stroke: check-mark stroke width = 9% of size (about 2.34.dp at 26.dp), round cap and join
    anim: background/foreground color tween(300), check-mark alpha enter 10ms / exit 150ms, the check tip overshoots (0.85 at 200ms → 0.803 at 300ms)
  state: "Purely controlled. Both state and onClick are required (onClick can be explicitly null → degrades to a pure semantics node, non-interactive). The Indeterminate state is not a separate path; it lerps the check's three points toward the center, collapsing them into a horizontal line. The haptic type is decided by the current state at press time."
  m3: "Corresponds to material3.TriStateCheckbox (not Checkbox). Differences: no Boolean convenience overload, no interactionSource parameter, circular rather than rounded square, size hardcoded to 26.dp and unchangeable, no 48dp touch-target compensation."

Switch:
  summary: "A switch. A 49×28 pill track + 20.dp thumb, with half-sensitivity dragging and hysteresis haptics; it is the most finely tuned component at this layer for feel."
  gotchas:
    - text: "onCheckedChange is nullable but has no default, so it is required. For a read-only switch you must explicitly write onCheckedChange = null (the component then degrades to a pure semantics node, recognizable by screen readers but non-interactive); simply omitting the parameter fails to compile."
      severity: high
      evidence: miuix-ui/src/commonMain/kotlin/top/yukonga/miuix/kmp/basic/Switch.kt:68
    - text: ".size(49.dp, 28.dp) placed after modifier silently overrides the caller's size. Passing Modifier.size(80.dp, 40.dp) doesn't give a large switch, only a 49×28 switch centered in an empty 80×40 box (there's also a wrapContentSize(Center) before it). The switch size is entirely non-configurable in the current implementation."
      severity: high
      evidence: miuix-ui/src/commonMain/kotlin/top/yukonga/miuix/kmp/basic/Switch.kt:143
    - text: "The drag gesture is attached only to the 20.dp thumb, not the track. Pressing and dragging horizontally on an empty part of the track won't move the thumb (it's only recognized as a tap toggle or swallowed by the parent's scroll)."
      severity: medium
      evidence: miuix-ui/src/commonMain/kotlin/top/yukonga/miuix/kmp/basic/Switch.kt:168

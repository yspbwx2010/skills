VerticalDivider:
  summary: "A vertical divider, the symmetric implementation of HorizontalDivider."
  gotchas:
    - text: "It hardcodes fillMaxHeight() internally. Placed in a parent with unbounded height (e.g. a Row inside a vertical scroll, or a Row without IntrinsicSize.Min), fillMaxHeight gets no finite constraint and the divider's height collapses to 0 —— looking like it 'wasn't drawn'. The standard fix is to add Modifier.height(IntrinsicSize.Min) or an explicit height to the parent Row."
      severity: high
      evidence: miuix-ui/src/commonMain/kotlin/top/yukonga/miuix/kmp/basic/Divider.kt:57
  visual:
    thickness: 0.75.dp
    color: MiuixTheme.colorScheme.dividerLine
  state: "Purely stateless, @NonRestartableComposable."
  m3: "Corresponds to material3.VerticalDivider; the same unbounded-height problem exists in M3 too; the only difference is the default thickness."

Icon:
  summary: "A monochrome icon container; tint defaults to LocalContentColor, so placed inside Button/Card/Badge it follows the color automatically. Four overloads: ImageVector / ImageBitmap / Painter+Color / Painter+ColorProducer."
  gotchas:
    - text: "24.dp is only the fallback when 'the painter has no intrinsic size', not a default size. ImageVector uses its own defaultWidth/defaultHeight, and Miuix's built-in icon sizes are all over the map (ArrowRight 10×16, Search 20×20, Check 26×26, Close/Sidebar 24×24, SearchCleanup 18.199984×18.199984). To unify icon sizes you must pass Modifier.size(...) yourself (the external modifier comes first and correctly overrides the fallback)."
      severity: high
      evidence: miuix-ui/src/commonMain/kotlin/top/yukonga/miuix/kmp/basic/Icon.kt:193
    - text: "contentDescription has no default and is a required parameter; for decorative icons pass null explicitly (when null is passed the component adds no semantics)."
      severity: medium
      evidence: miuix-ui/src/commonMain/kotlin/top/yukonga/miuix/kmp/basic/Icon.kt:55
    - text: "The ColorProducer overload's parameter order is (painter, tint, contentDescription, modifier), with tint before contentDescription, the opposite of the other three overloads. Positional arguments silently pick the wrong overload or fail to compile; always name them. It keeps a resident GraphicsLayer to buy 'a tint change only redraws, not recomposes'."
      severity: medium
      evidence: miuix-ui/src/commonMain/kotlin/top/yukonga/miuix/kmp/basic/Icon.kt:171
    - text: "Passing tint = Color.Unspecified means no tinting (use this for multicolor icons); the ColorProducer overload instead passes null to mean no tinting. The two ways of writing 'no tinting' differ."
      severity: low
      evidence: miuix-ui/src/commonMain/kotlin/top/yukonga/miuix/kmp/basic/Icon.kt:131
  visual:

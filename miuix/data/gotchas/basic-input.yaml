    content_scale: ContentScale.Fit
  state: "Purely stateless. tint defaults to LocalContentColor.current, i.e. decided by the containing container (Button/Card/Surface/Badge all provide it)."
  m3: "Corresponds to material3.Icon. Behavior is essentially the same, with one extra ColorProducer overload. Note Miuix's built-in icons aren't uniformly 24dp like material-icons."

SmallTitle:
  summary: "A group sub-title for settings pages (the HyperOS-style bluish-gray bold small text). At 43 lines, it's the smallest component at this layer."
  gotchas:
    - text: "There are no style / fontSize / fontWeight parameters; the style is hardcoded to MiuixTheme.textStyles.subtitle (14.sp Bold), and you can only change the color and padding. For a different font size you must forgo it and write Text directly."

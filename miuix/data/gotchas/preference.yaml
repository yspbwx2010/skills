OverlaySpinnerPreference:
  summary: "A heavier selection row than OverlayDropdownPreference: options are DropdownItem (supporting per-item icon, summary, and individual disabling), and it can be presented as either a popup menu or a dialog."
  gotchas:
    - text: "popup mode and dialog mode are not a boolean toggle but are **selected by whether or not dialogButtonString is passed**, choosing the overload. It is required, has no default, and its position varies by overload: it is the 4th parameter in the items version and the 3rd in the entry / entries versions. Without it you land on the popup overload, with it you land on the dialog overload -- there are 6 functions of the same name in all, and it is very easy to pick the wrong one in IDE completion."
      severity: high
      evidence: miuix-preference/src/commonMain/kotlin/top/yukonga/miuix/kmp/preference/OverlaySpinnerPreference.kt:288
    - text: "The three dialog-mode overloads **have no maxHeight parameter**, so the dialog height cannot be limited (the list relies on an internal Layout measuring the button first and then giving the remaining height to the LazyColumn). Only popup mode has maxHeight."
      severity: medium
      evidence: miuix-preference/src/commonMain/kotlin/top/yukonga/miuix/kmp/preference/OverlaySpinnerPreference.kt:288
    - text: "The default colors of the two modes differ: popup uses DropdownDefaults.dropdownColors() (selected background surfaceContainer), dialog uses dialogDropdownColors() (selected background tertiaryContainer, transparent container). The same data in a different mode gives the selected item a different background color."
      severity: medium
      evidence: miuix-preference/src/commonMain/kotlin/top/yukonga/miuix/kmp/preference/OverlaySpinnerPreference.kt:298
    - text: "popup mode's expanded state uses rememberSaveable, while dialog mode and all other Dropdown/Menu components use ordinary remember. Consequence: after an Android config change or process restore, the popup-mode Spinner will **re-pop its menu by itself**; meanwhile the isHoldDown restored at the same moment is false (ordinary remember), so the press highlight and the expanded state do not match."
      severity: medium
      evidence: miuix-preference/src/commonMain/kotlin/top/yukonga/miuix/kmp/preference/OverlaySpinnerPreference.kt:174
    - text: "The element type of items is DropdownItem, not List<String> (DropdownPreference is String). Internally it converts with item.copy(selected = ..., onClick = { onSelectedIndexChange(index); item.onClick?.invoke() }), which **keeps and chains** the onClick you originally wrote on the item -- both callbacks execute."
      severity: medium

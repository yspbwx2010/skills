WindowIconCascadingDropdownMenu:
  summary: "An IconButton-triggered two-level cascading menu on a platform window; it does not depend on a Scaffold."
  gotchas:
    - text: "The depth is hard-limited to 2; deeper children are ignored and a warning is println'd once (not entirely silently)."
      severity: medium
      evidence: miuix-ui/src/commonMain/kotlin/top/yukonga/miuix/kmp/layout/CascadingMorphContent.kt:117
    - text: "During the time the menu is expanded, the order of entry / item must stay stable: the cascade layer tracks the expanded item by positional index rather than object reference, so reordering while expanded misaligns the submenu."
      severity: high
      evidence: miuix-preference/src/commonMain/kotlin/top/yukonga/miuix/kmp/menu/WindowIconCascadingDropdownMenu.kt:27
    - text: "Both collapseOnSelection overloads default to true, unlike other entries overloads which default to `entries.size <= 1`."
      severity: low
      evidence: miuix-preference/src/commonMain/kotlin/top/yukonga/miuix/kmp/menu/WindowIconCascadingDropdownMenu.kt:77
    - text: "A first-level item with children has its onClick ignored (clicking expands it), while second-level items are treated as leaves and call onClick -- the rule \"non-null children means onClick is ignored\" only holds at the first level."
      severity: medium
      evidence: miuix-ui/src/commonMain/kotlin/top/yukonga/miuix/kmp/layout/CascadingListPopupLayout.kt:325
    - text: "There is no renderInRootScaffold; constructing entries/children inline creates new instances on every recomposition, and the KDoc requires stabilizing with remember."
      severity: medium
      evidence: miuix-ui/src/commonMain/kotlin/top/yukonga/miuix/kmp/basic/Dropdown.kt:336
  visual:
    submenu_marker: "A row with a submenu draws a 10×16.dp chevron at its end instead of a checkmark, in a softer summary color; the accessibility role switches from RadioButton to Button"
    button: "IconButton defaults to minimum 40×40.dp, corner radius 40.dp"
  state: "No value state. The expanded state, press state, and the currently-expanded first-level item are all held internally; the expanded first-level item is recorded by position."
  m3: "No counterpart. material3 has no built-in cascading-submenu DropdownMenu."

WindowDropdownPopup:
  summary: "The Window-layer dropdown overlay primitive, shared by the Window variants of Dropdown/Spinner/Menu. Use it directly when you want to assemble your own trigger."
  gotchas:

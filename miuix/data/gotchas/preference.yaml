    - text: "The example in windowspinnerpreference.md writes `private class RoundedRectanglePainter(...)` as a local class inside the composable body -- Kotlin local classes cannot have the private modifier, so copying it fails to compile. The sister page overlayspinnerpreference.md and the demo both omit private."
      severity: high
      evidence: docs/components/windowspinnerpreference.md:55
  visual:
    dialog_layout: "Inside the dialog it first measures the bottom confirm button and then gives the remaining height to the LazyColumn, so the button is never pushed off-screen by a long list; the list is flush left/right with 24.dp top/bottom; the button has 24.dp left/right, 12.dp top, and a minimum height of 50.dp"

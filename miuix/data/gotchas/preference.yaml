WindowIconDropdownMenu:
  summary: "An IconButton-triggered action menu on a platform window; it does not depend on a Scaffold."
  gotchas:
    - text: "It has no Preference slots such as title/summary and renders `Box { IconButton; Popup }`; the trigger's appearance is decided by the final required content trailing lambda."

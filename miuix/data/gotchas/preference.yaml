  visual:
    button: "IconButton defaults to minimum 40×40.dp, corner radius 40.dp; the four IconButtonDefaults parameters are forwarded as-is"
    popup: "Width 200–288.dp, only the first 8 items measured for width; rows 20.dp left/right, first/last 20.dp and the rest 12.dp, inner text limited to 216.dp width; right-aligned"

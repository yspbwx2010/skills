    - text: "The KDoc says `@param spinnerColors The [SpinnerColors] ...`, but SpinnerColors is already @Deprecated (a typealias of DropdownColors), and you should actually pass DropdownColors. Worse is another typealias: `SpinnerEntry = DropdownItem` (a single item), not DropdownEntry (a group). Literally translating SpinnerEntry → DropdownEntry by name from the old Spinner API is guaranteed to be wrong."
      severity: medium
      evidence: miuix-ui/src/commonMain/kotlin/top/yukonga/miuix/kmp/basic/Dropdown.kt:536
    - text: "Same as OverlayDropdownPreference: it must be wrapped in a Scaffold; the entry/entries overloads have no onSelectedIndexChange; empty entries auto-resolve to disabled; the expanded state is self-held and cannot be driven externally."

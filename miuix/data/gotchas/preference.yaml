    - text: "It has only the entry / entries overloads, no convenient items version; and no renderInRootScaffold."
      severity: high
      evidence: miuix-preference/src/commonMain/kotlin/top/yukonga/miuix/kmp/menu/WindowIconDropdownMenu.kt:63
    - text: "When entries is all empty the IconButton is directly disabled and grays out, rather than \"tapping produces no menu\"."
      severity: medium
      evidence: miuix-preference/src/commonMain/kotlin/top/yukonga/miuix/kmp/menu/WindowIconDropdownMenu.kt:92
    - text: "It lives in the optional artifact miuix-preference (the WindowDropdownPopup it transitively calls is also in that artifact), so a project depending only on miuix-ui cannot use this component; the doc frontmatter only writes requiresScaffoldHost / hostComponent / popupHost, with no statement of artifact ownership."
      severity: medium
      evidence: miuix-preference/src/commonMain/kotlin/top/yukonga/miuix/kmp/menu/WindowIconDropdownMenu.kt:28
    - text: "The doc example's Import section is missing the extension icons (MiuixIcons.Edit etc. are in the separate artifact miuix-icons), so copying it gives an unresolved reference."
      severity: medium

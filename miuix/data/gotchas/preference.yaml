# Preference components
#
# Shared premises for the whole module (not repeated on each component entry):
#   1. This is not the counterpart of androidx.preference. The whole module has zero persistence, with no
#      key/defaultValue/DataStore concept; every component is purely controlled: value in, callback out.
#   2. There is no group container and no code that rounds a group's first/last item together. Grouping is
#      assembled by the caller with SmallTitle + Card; the Card's squircle mask clips the overflow uniformly.
#   3. Overlay* must be used inside a Scaffold; Window* need not be.

ArrowPreference:
  summary: "A navigation-style settings row with a fixed arrow on the right, used to drill into a sub-page or open a self-managed dialog; it only handles appearance and clicks, and holds no value."
  gotchas:
    - text: "The arrow color is in fact not customizable. `ArrowPreferenceDefaults.endActionColors()` is public and looks like a configuration entry point, but ArrowPreference's parameter list has no argument that accepts EndActionColors; the factory is only called internally by the private ArrowPreferenceEndAction. Both fields of EndActionColors are private val and their accessor functions are internal, so even with an instance you cannot read them. To change the arrow color you must draw your own inside endActions."
      severity: medium
      evidence: miuix-preference/src/commonMain/kotlin/top/yukonga/miuix/kmp/preference/ArrowPreference.kt:95
    - text: "The default value of endActions is `{}` rather than null, so the wrapping Row with padding(end = 8.dp) always exists. Even if you pass no endActions at all, there is always an 8dp gap between the title and the arrow -- unlike CheckboxPreference/SliderPreference (default null, no Row when not passed)."
      severity: low
      evidence: miuix-preference/src/commonMain/kotlin/top/yukonga/miuix/kmp/preference/ArrowPreference.kt:71
    - text: "It does not pass a role to BasicComponent. The Switch/Checkbox/RadioButton/Dropdown in the same group all pass an explicit semantic role; only ArrowPreference and the two Sliders do not, so screen readers will not announce this row as a button. The Preference layer also does not expose onClickLabel."
      severity: low
      evidence: miuix-preference/src/commonMain/kotlin/top/yukonga/miuix/kmp/preference/ArrowPreference.kt:63
    - text: "Omitting onClick makes the whole row non-clickable: BasicComponent only attaches Modifier.clickable when `enabled && onClick != null`. The arrow is still drawn, but it neither consumes gestures nor gives any press feedback -- it looks tappable but does nothing."
      severity: medium
      evidence: miuix-ui/src/commonMain/kotlin/top/yukonga/miuix/kmp/basic/Component.kt:146
  visual:
    arrow: "A 10×16.dp Image (MiuixIcons.Basic.ArrowRight), fixed size and not adjustable; RTL uses graphicsLayer scaleX = -1f to mirror it, not a different icon"
    row: "Minimum height 56.dp, default padding 16.dp on all four sides (BasicComponentDefaults.InsideMargin)"
    text: "Title uses headline1 size + FontWeight.Medium, summary uses body2; neither passes maxLines/overflow, so long text always wraps, never ellipsizes, and the line height grows"
    gap: "A fixed 8.dp between endActions and the arrow"
  state: "Pure forwarding, zero state of its own. onClick is the only interaction entry. holdDownState is an \"externally injected press state\": when the caller opens its own Dialog it sets it true, keeping this row highlighted as pressed until it is manually set back to false in the Dialog's onDismissFinished -- it needs a remember/rememberSaveable MutableState held by the caller."
  m3: "No one-to-one counterpart. The closest is material3's ListItem with a chevron in trailingContent, or androidx.preference's Preference(fragment=...). Differences: M3 ListItem has no external press-state injection like holdDownState, and no fixed startAction/endActions/bottomAction three-slot layout; conversely ArrowPreference has none of M3's overlineContent/supportingContent multi-line structure."

SwitchPreference:
  summary: "A settings row with a switch; the whole row is clickable to toggle. Used for boolean settings. Purely controlled: checked in, onCheckedChange out."
  gotchas:
    - text: "The parameter order is the reverse of CheckboxPreference: SwitchPreference is (checked, onCheckedChange, title, ...), CheckboxPreference is (title, checked, onCheckedChange, ...). Copy-pasting positional arguments between the two fails to compile (String passed to Boolean). Always use named arguments."
      severity: high
      evidence: miuix-preference/src/commonMain/kotlin/top/yukonga/miuix/kmp/preference/SwitchPreference.kt:46
    - text: "onCheckedChange is a non-null `(Boolean) -> Unit`, inconsistent with the nullable types of CheckboxPreference/RadioButtonPreference in the same group. The underlying Switch supports passing a null callback for read-only semantics (no toggleable attached), but the Preference layer does not forward null, so you cannot make a read-only switch here -- you can only use enabled = false."
      severity: medium
      evidence: miuix-preference/src/commonMain/kotlin/top/yukonga/miuix/kmp/preference/SwitchPreference.kt:47
    - text: "Haptic feedback fires only when you tap the switch itself. Once the Switch receives a non-null callback it attaches toggleable and emits ToggleOn/ToggleOff haptics; tapping other areas of the row goes through BasicComponent.onClick with no haptics at all. On the same settings page, Switch/Checkbox have control-level haptics while RadioButtonPreference has row-level haptics, so the three feel inconsistent."
      severity: low
      evidence: miuix-ui/src/commonMain/kotlin/top/yukonga/miuix/kmp/basic/Switch.kt:119
    - text: "There are two toggleable nodes in the accessibility tree: the outer row clickable(role = Role.Switch) and the inner Switch toggleable(role = Role.Switch). A screen reader may read it twice."
      severity: low
      evidence: miuix-preference/src/commonMain/kotlin/top/yukonga/miuix/kmp/preference/SwitchPreference.kt:90
    - text: "In the Chinese doc switchpreference.md the \"Type\" column of the property table was written as `Yes` (the value from the English Required column shifted over), so following it you would not know the callback signature. The actual type is `(Boolean) -> Unit`, and it is required."
      severity: medium
      evidence: docs/zh_CN/components/switchpreference.md:63
  visual:
    row: "Minimum height 56.dp, default padding 16.dp; the switch body's size is decided by miuix-ui's Switch, the Preference layer only forwards switchColors"
    gap: "A fixed 8.dp between endActions and the switch (endActions defaults to `{}`, so that wrapping Row always exists)"
  state: "Purely controlled. The caller keeps its own `var checked by remember { mutableStateOf(false) }` and, inside onCheckedChange, both updates the state and persists it. The component does not remember, restore, or know about a settings key."
  m3: "Corresponds to material3's ListItem + Switch combination, or androidx.preference's SwitchPreferenceCompat. The fundamental difference from the latter is zero persistence: no key, no defaultValue, no automatic write to SharedPreferences. The difference from M3 Switch is that there is no thumbContent slot here, and the whole-row click and the control click are two different gesture paths (different haptics)."

CheckboxPreference:
  summary: "A settings row with a checkbox that can sit at the row's start or end; used for multi-select lists or boolean items. Purely controlled."
  gotchas:
    - text: "onCheckedChange is nullable but **has no default value**, so it must be passed explicitly (you can pass null). The doc checkboxpreference.md writes No in the Required column; omitting the parameter as it suggests fails to compile directly. Nullable ≠ omittable."
      severity: high
      evidence: miuix-preference/src/commonMain/kotlin/top/yukonga/miuix/kmp/preference/CheckboxPreference.kt:52
    - text: "The parameter order is (title, checked, onCheckedChange), the reverse of SwitchPreference's (checked, onCheckedChange, title). Positional arguments cannot be swapped between the two."
      severity: high
      evidence: miuix-preference/src/commonMain/kotlin/top/yukonga/miuix/kmp/preference/CheckboxPreference.kt:50
    - text: "Passing onCheckedChange = null does not turn the row into a static display. The onClick handed to BasicComponent is always a non-null lambda, so the row still attaches clickable and still shows press highlight; it just does nothing when tapped (the checkbox body does correctly become non-clickable). To be truly non-interactive you must pass enabled = false."
      severity: medium
      evidence: miuix-preference/src/commonMain/kotlin/top/yukonga/miuix/kmp/preference/CheckboxPreference.kt:123
    - text: "Tri-state checkbox (Indeterminate) is unreachable at this layer. Internally it always constructs `ToggleableState(checked)` from a Boolean; the underlying Checkbox supports Indeterminate but Preference has no entry point. For tri-state you must assemble your own BasicComponent with miuix-ui's Checkbox."
      severity: medium
      evidence: miuix-preference/src/commonMain/kotlin/top/yukonga/miuix/kmp/preference/CheckboxPreference.kt:151
    - text: "Haptics fire only when the checkbox body itself is tapped (Checkbox's internal triStateToggleable provides them); tapping other areas of the row has no haptics."
      severity: low
      evidence: miuix-ui/src/commonMain/kotlin/top/yukonga/miuix/kmp/basic/Checkbox.kt:146
  visual:
    spacing: "The checkbox has its own padding(end = 5.dp); the user's startAction adds another 5.dp via StartActionSlot; BasicComponent adds a further 8.dp between the start slot and the body. So \"checkbox → icon\" is 5.dp and \"icon → title\" is 5+8=13.dp"
    empty_slot: "When checkboxLocation = End and no startAction is passed, the start slot is passed null as a whole, BasicComponent takes the no-start branch, and that 8.dp is not produced either (it is not a blank placeholder)"
    row: "Minimum height 56.dp, default padding 16.dp"
  state: "Purely controlled. checked is held by the caller; internally the component only uses rememberUpdatedState to stabilize the callback, with no self-held state. CheckboxLocation is an ordinary enum parameter, not state."
  m3: "Corresponds to material3 ListItem + Checkbox, or androidx.preference's CheckBoxPreference. Differences: M3's TriStateCheckbox tri-state capability is cut at this layer; androidx's automatic persistence and dependency linkage do not exist here; conversely this adds checkboxLocation (start/end), something M3 ListItem needs a manual slot swap to achieve."

RadioButtonPreference:
  summary: "A settings row with a radio button; the whole row is clickable. Used for a set of mutually exclusive options. When selected, the title and summary change color -- it is the only component in this group with a selected-state text feedback."
  gotchas:
    - text: "There is no titleColor / summaryColor parameter; instead they are merged into a single `colors: RadioButtonPreferenceColors`. Copying `titleColor = ...` over from SwitchPreference / CheckboxPreference fails to compile (No parameter with name titleColor). To change colors you must go through RadioButtonPreferenceDefaults.radioButtonPreferenceColors(...)."
      severity: high
      evidence: miuix-preference/src/commonMain/kotlin/top/yukonga/miuix/kmp/preference/RadioButtonPreference.kt:58
    - text: "onClick is nullable but **has no default value** and must be passed explicitly. Passing null causes the same problem as CheckboxPreference: the row is still clickable, still shows press highlight, and just does nothing when tapped."
      severity: medium
      evidence: miuix-preference/src/commonMain/kotlin/top/yukonga/miuix/kmp/preference/RadioButtonPreference.kt:55
    - text: "When selected, the title and summary default to the theme primary color. If your intuition from other Preferences assumes text color is constant, the selected item in a radio group will suddenly change color -- this is intentional design, but it is the only component in this group that does so. If you do not want it, explicitly set selectedTitleColor/selectedSummaryColor back to the normal color."
      severity: medium
      evidence: miuix-preference/src/commonMain/kotlin/top/yukonga/miuix/kmp/preference/RadioButtonPreference.kt:149
    - text: "The RadioButton body is explicitly passed onClick = null, so it is not clickable and emits no haptics on its own; the whole-row click is the only interaction path, and the haptic fires at row level. The haptic type also depends on the selected state **before** the click: tapping an already-selected item again emits ToggleOff rather than ToggleOn."
      severity: low
      evidence: miuix-preference/src/commonMain/kotlin/top/yukonga/miuix/kmp/preference/RadioButtonPreference.kt:86
    - text: "All four fields of RadioButtonPreferenceColors are private val with only internal accessor methods. The doc listing them as readable properties is wrong; once you have an instance you cannot read any color."
      severity: low
      evidence: miuix-preference/src/commonMain/kotlin/top/yukonga/miuix/kmp/preference/RadioButtonPreference.kt:163
  visual:
    spacing: "The radio button has its own padding(end = 5.dp); startAction adds another 5.dp via StartActionSlot; BasicComponent adds a further 8.dp. Structurally identical to CheckboxPreference"
    selected_color: "Selected-state title/summary default to MiuixTheme.colorScheme.primary"
    row: "Minimum height 56.dp, default padding 16.dp"
  state: "Purely controlled. selected and the mutual-exclusion logic are entirely on the caller: typically `var selectedIndex by remember { mutableIntStateOf(0) }`, with each row passing `selected = index == selectedIndex` and `onClick = { selectedIndex = index }`. The components do not know about each other, and there is no RadioGroup-style container."
  m3: "Corresponds to material3 ListItem + RadioButton (with Modifier.selectableGroup()), or the expanded form of androidx.preference's ListPreference. Differences: there is no selectableGroup semantic container here, so a radio group is not recognized as one group in the accessibility tree; conversely M3 has no built-in \"text turns theme color when selected\"."

SliderPreference:
  summary: "A settings row with a slider below the title, optionally showing the current value text on the right; used for continuous adjustments like volume, brightness, or font size. The slider renders in BasicComponent's bottomAction area, not inline in the row."
  gotchas:
    - text: "The bottomAction you pass is not the \"bottom-most\" content but is redefined as content \"above the slider\" -- internally the component wraps bottomAction into `Column { your bottomAction; Slider }`. There is no slot to place something below the slider."
      severity: medium
      evidence: miuix-preference/src/commonMain/kotlin/top/yukonga/miuix/kmp/preference/SliderPreference.kt:147
    - text: "\"Clickable\" and \"shows an arrow\" are bound together: `showArrow = onClick != null`. Passing onClick necessarily produces the right arrow; you cannot have a clickable slider row without an arrow, nor conversely show only an arrow without responding to clicks."
      severity: medium
      evidence: miuix-preference/src/commonMain/kotlin/top/yukonga/miuix/kmp/preference/SliderPreference.kt:112
    - text: "The KDoc for showKeyPoints says \"Only works when keyPoints is not null\", but the actual semantics are exactly the opposite: computeKeyPointFractions branches so that if keyPoints is non-null it draws the custom points (ignoring showKeyPoints), and showKeyPoints only decides whether to draw the points at step positions when keyPoints == null. Writing `keyPoints = listOf(...)` + `showKeyPoints = false` per the doc expecting no points to be drawn will still draw them."
      severity: high
      evidence: miuix-ui/src/commonMain/kotlin/top/yukonga/miuix/kmp/basic/Slider.kt:1329
    - text: "The real condition under which magnetThreshold takes effect is stronger than the doc: resolveValueFromFraction returns straight into the quantization branch when steps > 0, so the magnet code never runs. Magnet only makes sense when steps == 0 and keyPoints != null. The doc only says \"Only applies when keyPoints is set\"."
      severity: medium
      evidence: miuix-ui/src/commonMain/kotlin/top/yukonga/miuix/kmp/basic/Slider.kt:1264
    - text: "An illegal valueRange or a negative steps throws IllegalArgumentException directly, not the \"will be coerced\" the doc implies. The underlying Slider has require(steps >= 0) and require(valueRange.start < valueRange.endInclusive), so an empty or reversed range crashes on the spot. Only value itself is coerced."
      severity: medium
      evidence: miuix-ui/src/commonMain/kotlin/top/yukonga/miuix/kmp/basic/Slider.kt:104
    - text: "The valueText's size and color are hard-coded in the component (body2 + onSurfaceVariantActions / disabled color), do not go through any colors parameter, and are not affected by summaryColor. To customize it you can only switch to drawing your own via endActions."
      severity: low
      evidence: miuix-preference/src/commonMain/kotlin/top/yukonga/miuix/kmp/preference/SliderPreference.kt:132
    - text: "The doc's \"With Start Icon\" example uses `MiuixIcons.Basic.Audio`, which does not exist -- the Basic icon set has only seven: ArrowRight / ArrowUpDown / Check / Close / Search / SearchCleanup / Sidebar. Copying it fails to compile (unresolved reference)."
      severity: high
      evidence: docs/components/sliderpreference.md:114
    - text: "The doc's property table places title before modifier, while the source order is (value, onValueChange, modifier, title, ...). Writing positional arguments in the table's order causes type mismatches."
      severity: medium
      evidence: miuix-preference/src/commonMain/kotlin/top/yukonga/miuix/kmp/preference/SliderPreference.kt:84
    - text: "It does not pass a role, so a screen reader will not announce this row as an adjustable control (the slider body carries its own semantics, but the outer row does not)."
      severity: low
      evidence: miuix-preference/src/commonMain/kotlin/top/yukonga/miuix/kmp/preference/SliderPreference.kt:115
  visual:
    title: "title is String? -- the only Preference in this group that allows no title; passing null produces no Text at all (not a blank placeholder row)"
    arrow: "10×16.dp, a line-by-line copy of ArrowPreference's arrow (same RTL scaleX mirroring, same reuse of ArrowPreferenceDefaults.endActionColors())"
    gap: "A fixed 8.dp between the title area and the slider (a Spacer BasicComponent inserts before bottomAction), not adjustable"
    row: "Minimum height 56.dp, but the slider and text stretch it taller; default padding 16.dp"
  state: "Purely controlled. value and onValueChange are held by the caller; onValueChangeFinished is only for knowing that dragging ended -- do not write the value back inside it. Of the 25 parameters, the vast majority flatten the underlying Slider's tuning surface as-is; the Preference layer does no processing."
  m3: "Corresponds to material3's ListItem + Slider combination; androidx.preference's SeekBarPreference is the closest. Differences: SeekBarPreference auto-persists an integer value and has XML attributes for min/max/increment, none of which exist here; conversely this adds keyPoints (custom key points), magnetThreshold (magnet), hapticEffect, and reverseDirection, capabilities M3 Slider lacks."

RangeSliderPreference:
  summary: "The two-thumb version of SliderPreference; value is a ClosedFloatingPointRange, used for price ranges, frequency bands, upper/lower thresholds, and similar dual-end selections."
  gotchas:
    - text: "It has one fewer parameter than SliderPreference: no reverseDirection (24 parameters vs 25). Copying call code from SliderPreference that includes reverseDirection = ... fails to compile."
      severity: medium
      evidence: miuix-preference/src/commonMain/kotlin/top/yukonga/miuix/kmp/preference/SliderPreference.kt:212
    - text: "Same as SliderPreference: the doc semantics of showKeyPoints are reversed. When keyPoints is non-null, points are drawn regardless of whether showKeyPoints is true or false; showKeyPoints only decides whether to draw the step points when keyPoints == null."
      severity: high
      evidence: miuix-ui/src/commonMain/kotlin/top/yukonga/miuix/kmp/basic/Slider.kt:1329
    - text: "The underlying RangeSlider likewise has require(steps >= 0) and require(valueRange.start < valueRange.endInclusive), so an illegal range throws rather than being silently corrected."
      severity: medium
      evidence: miuix-ui/src/commonMain/kotlin/top/yukonga/miuix/kmp/basic/Slider.kt:513
    - text: "bottomAction is likewise redefined as content \"above the slider\"; onClick is likewise bound to the right arrow; valueText color is likewise hard-coded. All three are line-for-line the same as SliderPreference."
      severity: medium
      evidence: miuix-preference/src/commonMain/kotlin/top/yukonga/miuix/kmp/preference/SliderPreference.kt:275
    - text: "The doc's \"With Start Icon\" example likewise uses the non-existent `MiuixIcons.Basic.Audio`; copying it fails to compile."
      severity: high
      evidence: docs/components/rangesliderpreference.md:113
  visual:
    title: "title is String?, omittable"
    arrow: "10×16.dp, sharing the same private implementation as SliderPreference"
    gap: "A fixed 8.dp between the title area and the slider"
  state: "Purely controlled. value is a ClosedFloatingPointRange<Float>, remembered by the caller; onValueChange returns the new range every frame. There is no role, so the screen-reader semantics come only from the underlying RangeSlider."
  m3: "material3 has a RangeSlider but no corresponding Preference wrapper; androidx.preference has no range-type Preference at all. This is a Miuix-specific addition."

OverlayDropdownPreference:
  summary: "A settings row that shows the current selected value on the right and, when clicked, pops up a dropdown menu in a Scaffold overlay. Suited for cases with few options that need to follow the Scaffold's blur/scale effects."
  gotchas:
    - text: "It must be wrapped in a Scaffold. Without one, LocalPopupStates degrades to a default list that no host renders, and the overlay **silently fails to appear** -- no error, no crash, no log, just nothing happening on tap. Several doc examples (such as the Disabled State in overlaydropdownpreference.md) themselves fail to wrap it in a Scaffold."
      severity: high
      evidence: miuix-ui/src/commonMain/kotlin/top/yukonga/miuix/kmp/utils/MiuixPopupUtils.kt:595
    - text: "Only the `items: List<String>` overload has onSelectedIndexChange. The entry / entries overloads **have no such parameter at all**: the selection callback must be written into each DropdownItem.onClick, and the selected state must be computed and passed in yourself as `selected = ...`. Calling the entries overload the way the items overload is written fails to compile."
      severity: high
      evidence: miuix-preference/src/commonMain/kotlin/top/yukonga/miuix/kmp/preference/OverlayDropdownPreference.kt:217
    - text: "When items is empty the component automatically becomes disabled: `actualEnabled = enabled && itemsNotEmpty`. Even if you pass enabled = true, an empty list grays out this row, makes it non-clickable, and the popup never enters composition. When data loads asynchronously this is the expected \"auto-gray while loading\" behavior, but it is not in the doc."
      severity: high
      evidence: miuix-preference/src/commonMain/kotlin/top/yukonga/miuix/kmp/preference/OverlayDropdownPreference.kt:146
    - text: "The default value of collapseOnSelection varies by overload: the items overload hard-codes true and does not expose the parameter; the entry overload defaults to true; the entries overload defaults to `entries.size <= 1` -- meaning with multiple groups it **does not collapse after selecting**."
      severity: medium
      evidence: miuix-preference/src/commonMain/kotlin/top/yukonga/miuix/kmp/preference/OverlayDropdownPreference.kt:232
    - text: "The entries overload's default collapseOnSelection uses the **unfiltered** entries.size, while rendering uses nonEmptyEntries after empty groups are filtered out. Passing an empty DropdownEntry (making size 2) silently flips the default from true to false, while the screen still shows only one group."
      severity: medium
      evidence: miuix-preference/src/commonMain/kotlin/top/yukonga/miuix/kmp/preference/OverlayDropdownPreference.kt:250
    - text: "The selected-value Text shown by the entries overload has no weight/align, while the single-group entry overload has `weight(1f, fill = false)` + align(CenterVertically). BasicComponent clamps the end area's width to 60% of the remaining width, and under that constraint weightless long text fills the Row and pushes the following 10dp arrow past the boundary. In the multi-group case a long selected value risks clipping the arrow."
      severity: medium
      evidence: miuix-preference/src/commonMain/kotlin/top/yukonga/miuix/kmp/preference/OverlayDropdownPreference.kt:291
    - text: "The multi-group overload joins the text of the selected item in every group with newlines into one block, rather than showing only one value. Moreover this concatenation is written inside the endActions lambda without remember, re-traversing all groups on every recomposition."
      severity: low
      evidence: miuix-preference/src/commonMain/kotlin/top/yukonga/miuix/kmp/preference/OverlayDropdownPreference.kt:282
    - text: "The expanded state is self-held and **one-way out only**: there is only onExpandedChange to observe, no expanded input parameter, so the outside cannot programmatically expand or collapse the menu. The entire Dropdown/Spinner/Menu family is like this (isHoldDown too); none of them provides a controlled expanded."
      severity: medium
      evidence: miuix-preference/src/commonMain/kotlin/top/yukonga/miuix/kmp/preference/OverlayDropdownPreference.kt:132
    - text: "The items overload's `remember(items, selectedIndex, onSelectedIndexChange)` treats the callback lambda as a key. Call sites almost always write an inline lambda, whose identity changes on every recomposition, so the cache is invalidated every frame and the whole DropdownItem list is rebuilt every frame. To avoid it, remember a stable callback reference outside yourself."
      severity: medium
      evidence: miuix-preference/src/commonMain/kotlin/top/yukonga/miuix/kmp/preference/OverlayDropdownPreference.kt:77
    - text: "The press highlight is not released as soon as you let go: isHoldDown is reset by the overlay's onDismissFinished, i.e. this row does not return to normal until the menu's exit animation finishes. This is the intentional MIUI feel, but if you have wrapped your own animation listener you may feel the state is stuck."
      severity: low
      evidence: miuix-preference/src/commonMain/kotlin/top/yukonga/miuix/kmp/preference/OverlayDropdownPreference.kt:200
    - text: "All four doc pages (overlaydropdownpreference / overlayspinnerpreference / windowdropdownpreference / windowspinnerpreference) write the default-value column of onSelectedIndexChange as `-` (meaning no default), while the source is actually `= null` and can be omitted. The Required column on the same row says No, contradicting itself."
      severity: medium
      evidence: docs/components/overlaydropdownpreference.md:218
  visual:
    end_arrow: "DropdownArrowEndAction, a 10×16.dp bidirectional up-down arrow (MiuixIcons.Basic.ArrowUpDown), not ArrowRight"
    value_text: "body2 size, color onSurfaceVariantActions; when disabled/empty-list it is uniformly changed to disabledOnSecondaryVariant (arrow the same color)"
    popup_align: "The overlay is fixed to right alignment (PopupPositionProvider.Align.End), not changeable"
    popup_width: "Clamped by ListPopupColumn between 200.dp–288.dp, and only the **first 8 items'** intrinsic widths participate in measurement -- from the 9th item on, no matter how long, they do not contribute to the width and may be truncated"
    popup_row: "In popup mode each row has 20.dp left/right; the top of the first row and the bottom of the last row of the whole overlay are 20.dp, the rest 12.dp; a single line's inner text is limited to 216.dp width. This is the library's only \"first/last item special-casing\", and it changes padding, not corner radius"
    divider: "A 1.5.dp divider between groups, 20.dp left/right and 4.dp top/bottom; empty groups are filtered out beforehand, so dividers never appear on either side of an empty group"
    row: "Minimum height 56.dp, default padding 16.dp"
  state: "Value is controlled + expanded state is self-held. selectedIndex / DropdownItem.selected are given by the caller; isDropdownExpanded and isHoldDown are remembered internally (not rememberSaveable, so the menu collapses after a config change). Disabling has three layers ANDed together: row-level enabled → DropdownEntry.enabled (grays out the whole group but the menu still pops) → DropdownItem.enabled; in overlay rows the disabled color has the highest priority, overriding the selected state."
  m3: "Corresponds to material3's ExposedDropdownMenuBox + ExposedDropdownMenu, or androidx.preference's ListPreference. Differences: M3's expanded is controlled state held by the caller, whereas here it is self-held by the component and cannot be driven externally; M3's menu anchors on the text field with width following the anchor, while here it is fixed right-aligned with width clamped to 200–288dp; androidx's ListPreference has built-in entries/entryValues and persistence, none of which exist here."

WindowDropdownPreference:
  summary: "Structurally identical to OverlayDropdownPreference, differing only in that the overlay uses a platform window rather than a Scaffold overlay slot; it does not depend on a Scaffold, and the menu can extend beyond the host window's bounds."
  gotchas:

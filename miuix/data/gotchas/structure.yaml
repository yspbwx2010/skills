  m3: "No counterpart. The closest is M3's indeterminate CircularProgressIndicator, but the visual language is completely different (M3 is a gapped-arc sweep, this is a full ring + orbiting dot)."

Snackbar:
  summary: "The default appearance of a single snackbar (message + optional action button + optional dismiss button). Usually not used directly; it is called by SnackbarHost's default content, and you write it explicitly only when customizing the appearance."
  gotchas:
    - text: "It takes SnackbarData, not a string. When customizing content you must read values via `data.visuals.message` / `.actionLabel` / `.withDismissAction`, and call `data.performAction()` / `data.dismiss()` in the buttons to wrap up — if you don't, the suspended coroutine of showSnackbar never returns."
      severity: "high"
      evidence: "miuix-ui/src/commonMain/kotlin/top/yukonga/miuix/kmp/basic/Snackbar.kt:392"
    - text: "The constructor of SnackbarDuration.Custom carries `require(durationMillis > 0)`, so passing 0 or a negative number throws rather than \"disappearing immediately\" or \"never disappearing\" (the latter uses Indefinite). Also, within the SnackbarDuration scope `Long` resolves to the sibling `data object Long`, so the source must write kotlin.Long."
      severity: "medium"
      evidence: "miuix-ui/src/commonMain/kotlin/top/yukonga/miuix/kmp/basic/Snackbar.kt:91"
    - text: "The shadow parameters are hard-coded (radius=10.dp / black / alpha=0.1f); there is no elevation parameter to tune."
      severity: "low"
      evidence: "miuix-ui/src/commonMain/kotlin/top/yukonga/miuix/kmp/basic/Snackbar.kt:405"
  visual:
    corner_radius: "16.dp (squircle)"

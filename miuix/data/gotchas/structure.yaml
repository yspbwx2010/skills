    outer_padding: "PaddingValues(start = 12.dp, end = 12.dp, top = 8.dp)"
    action_button: "corner radius 50.dp, inner padding horizontal 12.dp / vertical 0.dp"
    shadow: "fixed radius=10.dp / black / alpha=0.1f"
  state: "Stateless. It provides colors.contentColor as LocalContentColor via CompositionLocalProvider, so the internal Text/Icon automatically pick up the correct foreground color."
  m3: "Corresponds to material3.Snackbar. M3's Snackbar also takes SnackbarData (or an overload taking action/dismissAction slots directly); the difference is that M3 has finer parameters like shape/containerColor/contentColor/actionContentColor/actionOnNewLine/elevation, while Miuix only has cornerRadius/colors/insideMargin, and elevation is not tunable."

SnackbarHost:
  summary: "The host and stack layout for snackbars — it watches the SnackbarHostState queue, plays enter/exit animations, runs the auto-dismiss timer, and handles swipe-to-dismiss. Put it in the Scaffold's snackbarHost slot."
  gotchas:
    - text: "The auto-dismiss timer lives in SnackbarHost, not in SnackbarHostState. Without mounting SnackbarHost into composition (the Scaffold's snackbarHost defaults to an empty lambda), showSnackbar's coroutine suspends forever and entries keep piling up in the state. This is the root cause of \"calling showSnackbar and nothing happens.\""
      severity: "high"
      evidence: "miuix-ui/src/commonMain/kotlin/top/yukonga/miuix/kmp/basic/Snackbar.kt:302"
    - text: "The parameter name is state, not hostState (the doc example writing `SnackbarHost(hostState = ...)` won't compile)."
      severity: "high"
      evidence: "miuix-ui/src/commonMain/kotlin/top/yukonga/miuix/kmp/basic/Snackbar.kt:273"
    - text: "It is stack-based rather than queue-based: calling showSnackbar multiple times makes several show at once (the new one is added to the head of the list + LazyColumn reverseLayout, so visually the newer is below), rather than playing them one at a time in a queue. For \"show only the latest\" you must dismiss the old ones yourself first."
      severity: "medium"
      evidence: "miuix-ui/src/commonMain/kotlin/top/yukonga/miuix/kmp/basic/Snackbar.kt:224"
    - text: "The timeout duration is adjusted by the accessibility service's calculateRecommendedTimeoutMillis (and is always reported as \"with icon + with text\"), so on a device with the accessibility service enabled the actual dwell time is longer than 4000/10000ms."
      severity: "low"
      evidence: "miuix-ui/src/commonMain/kotlin/top/yukonga/miuix/kmp/basic/Snackbar.kt:255"
    - text: "\"Logical removal\" and \"composition removal\" are separate: dismiss only sets visible to false, and the actual removal from the list is done by the UI side after the exit animation goes idle. So the length of currentSnackbars is briefly larger than the visible entries."
      severity: "low"
      evidence: "miuix-ui/src/commonMain/kotlin/top/yukonga/miuix/kmp/basic/Snackbar.kt:299"
  visual:
    host_bottom_padding: "12.dp"
    duration: "Short 4000ms / Long 10000ms / Indefinite Long.MAX_VALUE / Custom custom (must be > 0)"
    swipe_threshold: "dismisses once the displacement exceeds half the width (positionalThreshold = distance * 0.5f)"
    enter: "slideInVertically + expandVertically(clip = false)"
    exit: "the bottommost one (index == 0) slides out, the rest use fadeOut; all with shrinkVertically(clip = false)"
  state: "SnackbarHostState is `remember { SnackbarHostState() }` by the caller (not rememberSaveable, not restored on process death). showSnackbar is suspend and suspends until that entry is dismissed or performAction'd, returning a SnackbarResult; therefore it must be called inside rememberCoroutineScope().launch. newestSnackbarData() / oldestSnackbarData() are suspend member functions (not extension functions)."
  m3: "Corresponds to material3.SnackbarHost. The biggest difference is that M3's SnackbarHostState shows only one at a time (a new one cancels the old, serialized via a Mutex), whereas Miuix is a stack that can layer several at once; M3's host does only single-entry animation, while Miuix's host is internally a reverseLayout LazyColumn. M3's parameter name is hostState, Miuix's is state."

TooltipBox:
  summary: "A container that attaches a tooltip to any anchor — triggered by long-press (touch) or hover (mouse). There are two overloads: the full version takes positionProvider + a tooltip slot + state, and the convenience version takes only a text string."
  gotchas:
    - text: "The convenience version `TooltipBox(text = ...)` has a fully hard-coded style: body2 font size, maxLines = 2, Ellipsis truncation, with no configurable parameters. Slightly longer text gets truncated to two lines with an ellipsis; for more control you must switch to the full version + PlainTooltip."
      severity: "medium"
      evidence: "miuix-ui/src/commonMain/kotlin/top/yukonga/miuix/kmp/basic/Tooltip.kt:621"
    - text: "The tooltip's orientation is not inferred from the positionProvider's behavior but by casting it to TooltipPopupPositionProvider and reading the positioning field; if the cast fails it is always treated as Below. When passing a custom PopupPositionProvider, the caret of PlainTooltip/RichTooltip is drawn on the wrong side (or not drawn at all)."
      severity: "medium"
      evidence: "miuix-ui/src/commonMain/kotlin/top/yukonga/miuix/kmp/basic/Tooltip.kt:283"
    - text: "All gesture entries (long-press, mouse hover) call show() with MutatePriority.UserInput, while the timeout branch is taken only when \"not persistent and the priority is not UserInput\" — that is, a tooltip popped by a touch long-press never times out automatically and can only be dismissed by tapping elsewhere or an explicit dismiss. The mouse one retracts when the pointer leaves the anchor. Only programmatically calling state.show() consumes TooltipDuration."
      severity: "high"
      evidence: "miuix-ui/src/commonMain/kotlin/top/yukonga/miuix/kmp/basic/Tooltip.kt:202"
    - text: "focusable defaults to false. When a RichTooltip carries a clickable action you must explicitly pass focusable = true, otherwise clicking outside won't close it and its inner buttons may be unclickable."
      severity: "medium"
      evidence: "miuix-ui/src/commonMain/kotlin/top/yukonga/miuix/kmp/basic/Tooltip.kt:278"
  visual:
    enter: "fadeIn + scaleIn(initialScale = 0.9f), reusing ListPopupDefaults's animation spec"
    exit: "fadeOut + scaleOut(targetScale = 0.9f); the exit scale deliberately uses a spring rather than a tween (so it can pick up the unfinished enter velocity and avoid a \"pause then reverse\")"
  state: "state is hosted by rememberTooltipState() and required (the convenience version has a default). TooltipState uses a MutatorMutex to ensure only one tooltip is visible at a time. isVisible is judged by `transition.targetState || !transition.isIdle`, i.e. it counts as visible even while the animation hasn't finished, ensuring an interrupted enter can play its exit animation in reverse."
  m3: "Corresponds to material3.TooltipBox (also a positionProvider + tooltip + state + content structure). This Miuix set is forked from foundation's experimental BasicTooltipBox, and the only substantive behavior change is: when the mouse leaves the anchor, a persistent tooltip is not closed (so the cursor can move onto a RichTooltip to click its buttons) — which is exactly M3's behavior. M3's TooltipDefaults provides factories like rememberPlainTooltipPositionProvider(), while Miuix expresses the orientation with the TooltipAnchorPosition enum."

PlainTooltip:
  summary: "An appearance container for a simple text tooltip; it can only be written in TooltipBox's tooltip slot."

  state: "Stateless, purely controlled. progress == null means the indeterminate state."
  m3: "Corresponds to material3.CircularProgressIndicator, with differences the same as LinearProgressIndicator (nullable Float vs two overloads; no fine-grained parameters beyond gapSize/trackColor)."

InfiniteProgressIndicator:
  summary: "An \"infinite\" indicator of one ring + one orbiting dot, for waiting scenarios where there is no progress to speak of."
  gotchas:

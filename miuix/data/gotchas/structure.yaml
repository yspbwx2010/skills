  m3: "No counterpart."

FloatingToolbar:
  summary: "A container responsible only for appearance (a rounded card + optional shadow/outline); its position on screen is decided by the parent — the typical usage is to place it in the Scaffold's floatingToolbar slot and position it with floatingToolbarPosition."
  gotchas:
    - text: "The KDoc says \"arranged either horizontally or vertically,\" but the component has no orientation parameter; internally it is just a Box. Whether it is horizontal or vertical depends entirely on whether you put a Row or a Column in content yourself."
      severity: "medium"
      evidence: "miuix-ui/src/commonMain/kotlin/top/yukonga/miuix/kmp/basic/FloatingToolbar.kt:70"
    - text: "shadowElevation is a boolean switch; the shadow parameters are hard-coded to radius=10.dp, black, alpha=0.1f. 4.dp and 40.dp render the same."
      severity: "medium"
      evidence: "miuix-ui/src/commonMain/kotlin/top/yukonga/miuix/kmp/basic/FloatingToolbar.kt:57"
    - text: "It handles no window insets itself, and doesn't know bottomBar exists. When placed in the Scaffold's floatingToolbar slot with a Bottom* position it covers the NavigationBar (see the Scaffold entry); with a Top*/Center* position it shifts down by one status-bar height due to Scaffold's topInset double-counting."
      severity: "medium"
      evidence: "miuix-ui/src/commonMain/kotlin/top/yukonga/miuix/kmp/basic/Scaffold.kt:282"
  visual:
    corner_radius: "50.dp"
    outside_padding: "PaddingValues(12.dp, 8.dp)"
    shadow: "fixed radius=10.dp / black / alpha=0.1f"
    divider: "same as FloatingNavigationBar, drawing the border with \"an outline-colored squircle + 0.75.dp padding\""
  state: "Stateless. Here the modifier is at the head of the chain (opposite to FloatingNavigationBar), which is idiomatic Compose. It is marked @NonRestartableComposable and is a pure delegating wrapper."
  m3: "Corresponds to material3 expressive's HorizontalFloatingToolbar / VerticalFloatingToolbar. The differences are obvious: that M3 set comes with orientation, expanded/collapsed animation, a floatingActionButton slot, and scroll linkage (FloatingToolbarScrollBehavior); this Miuix one is only 101 lines, a pure appearance container, with orientation and animation all left to the caller. The ToolbarPosition enum is defined in Scaffold.kt, not here."

TabRow:
  summary: "A flat segmented tab bar (no outer frame); the selected item is indicated by a squircle background block, and when labels exceed the width it can scroll horizontally and automatically scrolls the selected item to center."
  gotchas:
    - text: "The maxWidth parameter (and its default TabRowMaxWidth = 98.dp) actually clamps nothing. Entering the `idealWidth > maxWidth` branch in calculateTabWidth already presupposes that `totalMaxWidth < availableWidth` holds, so it always returns idealWidth, and the `else maxWidth` line is an unreachable branch. Result: the tab width has only a lower bound, no upper bound, and always splits to fill the container — placing two or three tabs on a wide screen gives giant tabs hundreds of dp wide; passing maxWidth won't stop it, and you can only wrap the TabRow in a widthIn yourself."
      severity: "high"
      evidence: "miuix-ui/src/commonMain/kotlin/top/yukonga/miuix/kmp/basic/TabRow.kt:494"
    - text: "The modifier is sandwiched inside `Modifier.fillMaxWidth().then(modifier).height(height)`. Writing `.height(...)` in the modifier is overridden by the trailing height parameter, and writing `.width(...)` is interfered with by the leading fillMaxWidth — to change the size use the height parameter and an outer container."
      severity: "medium"
      evidence: "miuix-ui/src/commonMain/kotlin/top/yukonga/miuix/kmp/basic/TabRow.kt:105"
    - text: "There is one interactionSource for the whole TabRow, passed to every TabItem. Once you explicitly pass one, pressing any tab makes all tabs show press feedback simultaneously. The default null (each selectable builds its own internally) is the normal behavior."
      severity: "medium"
      evidence: "miuix-ui/src/commonMain/kotlin/top/yukonga/miuix/kmp/basic/TabRow.kt:181"
    - text: "indication defaults to null, so there is no ripple by default. This is a deliberate performance tradeoff — only when you pass indication is a squircleClip (an off-screen layer) added."
      severity: "low"
      evidence: "miuix-ui/src/commonMain/kotlin/top/yukonga/miuix/kmp/basic/TabRow.kt:366"
    - text: "The selected indicator is placed directly at `selectedTabIndex * (tabWidth + spacing) - scrollOffset`, with no animation, so switching is a hard jump. For a sliding animation use TabRowWithContour."
      severity: "low"
      evidence: "miuix-ui/src/commonMain/kotlin/top/yukonga/miuix/kmp/basic/TabRow.kt:155"
  visual:
    height: "42.dp (TabRowDefaults.TabRowHeight)"
    corner_radius: "12.dp"
    min_width: "76.dp (the only width constraint that actually takes effect)"
    max_width: "98.dp (declared value, does not actually take effect, see above)"
    item_spacing: "9.dp (a default literal, not in Defaults)"
    item: "unselected has a 1.dp squircle outline, selected has no outline; horizontal inner padding 12.dp; font size body1; maxLines=1 + Ellipsis"
  state: "Purely controlled (selectedTabIndex + onTabSelected). The internal LazyListState can be passed in (the listState parameter); if not passed it is built internally. The selected item auto-scrolls to center: the first time uses scrollToItem for an instant jump, afterward uses animateScrollToItem. The horizontal remaining scroll amount is entirely consumed by a NestedScrollConnection while the vertical is passed through unchanged, so scrolling the TabRow to its end doesn't drag the outer horizontal, but the outer vertical list still scrolls normally."
  m3: "Corresponds to material3's TabRow/ScrollableTabRow + PrimaryTabRow family, but the form is completely different. M3 is \"an underline indicator + text tabs,\" while Miuix is an iOS/MIUI-style segmented control (the selected item gets a rounded background block). M3 uses a tabs slot + Tab child components, while Miuix takes a `List<String>` directly and cannot customize the content of an individual tab (there is no entry for an icon or a custom composable)."

TabRowWithContour:
  summary: "A segmented tab bar with an outer frame — compared with TabRow it adds a background frame and inset, and the selected indicator has a 200ms sliding animation. The parameter list is word-for-word identical to TabRow, only the defaults differ."
  gotchas:
    - text: "It shares the same calculateTabWidth as TabRow, so maxWidth (default TabRowWithContourMaxWidth = 84.dp) likewise never takes effect, and tabs always split to fill."
      severity: "high"
      evidence: "miuix-ui/src/commonMain/kotlin/top/yukonga/miuix/kmp/basic/TabRow.kt:494"
    - text: "There are four differences from TabRow: an extra outer frame inset by 5.dp (outer corner radius = cornerRadius + 5.dp); the indicator slides with Animatable + tween(200, LinearEasing) rather than jumping hard; the item font size is body2 whereas TabRow's is body1, and the item has no extra horizontal 12.dp padding; TabItemWithContour also does not draw TabRow's \"unselected 1.dp squircle outline\" (TabRow.kt:360-364 vs 409-429). The rest (width calculation, center scrolling, nested scroll consuming the horizontal) is all the same — which to pick depends only on whether you want an outer frame and a sliding animation."
      severity: "low"
      evidence: "miuix-ui/src/commonMain/kotlin/top/yukonga/miuix/kmp/basic/TabRow.kt:226"
    - text: "The outer BoxWithConstraints has no background (TabRow does); the background is drawn on the inner layer. So passing it `Modifier.background(...)` lands differently than with TabRow."
      severity: "low"
      evidence: "miuix-ui/src/commonMain/kotlin/top/yukonga/miuix/kmp/basic/TabRow.kt:229"
  visual:
    height: "45.dp"
    corner_radius: "8.dp (outer-frame corner radius = 8 + 5 = 13.dp)"
    contour_padding: "5.dp (a hard-coded literal, not configurable)"
    min_width: "62.dp"
    max_width: "84.dp (declared value, does not actually take effect)"
    item_spacing: "5.dp"
    indicator_anim: "tween(200ms, LinearEasing); the first placement uses snapTo, only afterward animateTo"
  state: "The same controlled model as TabRow, plus an extra internal Animatable driving the indicator displacement and a lastSettledSelectedTabIndex used to distinguish \"first placement\" from \"subsequent switch.\""
  m3: "Same as TabRow — M3 has no framed segmented-control counterpart; the closest is SingleChoiceSegmentedButtonRow, but that is button-group semantics, not tabs."

BreadcrumbBar:
  summary: "A file-manager-style path breadcrumb — capsule segments + arrow separators; on overflow it scrolls horizontally rather than collapsing into an ellipsis, and automatically scrolls the highlighted segment to center."
  gotchas:
    - text: "highlightIndex defaults to items.lastIndex; passing a negative value (e.g. -1) turns off both the highlight and the auto-scroll. It is decoupled from items — you can show the full path while highlighting any segment (e.g. the parent directory the user backed into)."
      severity: "medium"
      evidence: "miuix-ui/src/commonMain/kotlin/top/yukonga/miuix/kmp/basic/BreadcrumbBar.kt:95"
    - text: "The auto-scroll coordinate reconstructs content coordinates with `positionInRoot().x + scrollState.value`, which implicitly assumes \"the BreadcrumbBar's own left edge is the window's left edge.\" Placing it in a Row with left padding, or to the right of a NavigationRail, will shift the highlighted segment's centered position overall."
      severity: "medium"
      evidence: "miuix-ui/src/commonMain/kotlin/top/yukonga/miuix/kmp/basic/BreadcrumbBar.kt:206"
    - text: "When enabled = false the arrow separators also switch to disabledColor rather than separatorColor, i.e. the description of separatorColor only holds in the enabled state; but horizontal scrolling still works in the disabled state."
      severity: "low"
      evidence: "miuix-ui/src/commonMain/kotlin/top/yukonga/miuix/kmp/basic/BreadcrumbBar.kt:147"
    - text: "BreadcrumbItem's text is optional and falls back to path when null. To display \"My Phone\" while the path is /storage/emulated/0, you rely on separating these two fields."
      severity: "low"
      evidence: "miuix-ui/src/commonMain/kotlin/top/yukonga/miuix/kmp/basic/BreadcrumbBar.kt:151"
    - text: "insideMargin is added inside horizontalScroll (`modifier.horizontalScroll(...).padding(insideMargin)`), so this inner padding scrolls away with the content rather than staying fixed at the container's edge."
      severity: "low"
      evidence: "miuix-ui/src/commonMain/kotlin/top/yukonga/miuix/kmp/basic/BreadcrumbBar.kt:141"
  visual:
    item_height: "32.dp (capsule, CircleShape)"
    item_horizontal_padding: "10.dp (equal to the corner radius, making the two ends full semicircles)"
    item_max_width: "160.dp (overflow is Ellipsis-truncated)"
    inside_margin: "PaddingValues(horizontal = 12.dp, vertical = 8.dp)"
    separator: "a 10×16.dp arrow icon, 4.dp on each side; mirrored with scaleX = -1 under RTL"
    colors: "the background color is derived from the text color (onBackground alpha 0.1, primary alpha 0.2), auto-adapting to light/dark themes"
  state: "Purely controlled (items + onItemClick + highlightIndex). scrollState can be passed in to preserve the scroll position; if not passed it is rememberScrollState internally. The first positioning uses scrollTo for an instant jump, subsequent highlightIndex changes use animateScrollTo."
  m3: "No counterpart. Material3 has no breadcrumb component; the biggest difference from a Web breadcrumb is that on overflow it scrolls horizontally rather than collapsing into `...`."

"List<BreadcrumbItem>.joinToPath":
  summary: "An extension function that joins the path segments of a breadcrumb list into a complete path string."
  gotchas:
    - text: "It joins each item's path field, not the display text. In scenarios where an item was given an alias text, joinToPath's result is the real path rather than the text you see — this is exactly its intent, but it's easily misused as \"joining display text.\""
      severity: "low"
      evidence: "miuix-ui/src/commonMain/kotlin/top/yukonga/miuix/kmp/basic/BreadcrumbBar.kt:334"
    - text: "separator defaults to \"/\", and a no-argument call does not automatically add leading/trailing slashes — `listOf(a, b).joinToPath()` gives \"a/b\" rather than \"/a/b\". For Windows style pass \"\\\\\" explicitly (a single-backslash literal in Kotlin source)."
      severity: "low"
      evidence: "miuix-ui/src/commonMain/kotlin/top/yukonga/miuix/kmp/basic/BreadcrumbBar.kt:334"
  visual: {}
  state: "A pure function, stateless."
  m3: "No counterpart."

SearchBar:
  summary: "A search-bar shell — responsible for showing outsideEndAction (a cancel button and the like) and the results-area content when expanded, and registering back-key handling. The actual input field is the paired but independent InputField."
  gotchas:
    - text: "The SearchBar's expanded and the InputField's expanded are two independent parameters that the caller must wire together manually with the same state. Passing expanded only to SearchBar while InputField is not wired means the input field won't gain focus or trigger expansion."
      severity: "high"
      evidence: "miuix-ui/src/commonMain/kotlin/top/yukonga/miuix/kmp/basic/SearchBar.kt:86"
    - text: "Undocumented side effect: when expanded becomes false, InputField automatically clears the query — delay(100) → text fades out → calls onQueryChange(\"\") → restores opacity → clearFocus. Code that saves query as the \"submitted search term\" will have it wiped by the component; the hand-written `searchText = \"\"` in the doc example is actually redundant."
      severity: "high"
      evidence: "miuix-ui/src/commonMain/kotlin/top/yukonga/miuix/kmp/basic/SearchBar.kt:304"
    - text: "SearchBar internally registers a NavigationBackHandler: when expanded is true it intercepts the system back and calls back onExpandedChange(false). This brings a runtime dependency (androidx.navigationevent), and also means your own back handling will be preempted by it."
      severity: "medium"
      evidence: "miuix-ui/src/commonMain/kotlin/top/yukonga/miuix/kmp/basic/SearchBar.kt:122"
    - text: "InputField's expansion is focus-driven (onFocusChanged → onExpandedChange(true)), and it has a workaround for the focus-reassignment bug on Android API 26-27: when collapsed the whole TextField is disabled, and click-to-expand is instead handled by an external pointerInput. So on these OS versions the collapsed TextField is enabled=false, and any custom logic depending on its editability will break."
      severity: "medium"
      evidence: "miuix-ui/src/commonMain/kotlin/top/yukonga/miuix/kmp/basic/SearchBar.kt:229"
  visual:
    inside_margin: "DpSize(12.dp, 0.dp) (horizontal 12dp, vertical 0dp)"
    input_field_shape: "CircleShape (capsule)"
    outside_end_action_anim: "expandHorizontally + slideInHorizontally (slides in from the right)"
  state: "SearchBar itself is stateless; expanded is fully controlled (the default false is only the value when the parameter is omitted, it does not mean it flips itself). InputField is also controlled and only internally holds a focusRequester, interactionSource, and an Animatable for fade-out. Three state edges: gaining focus → expand; expanded becomes true → request focus; expanded becomes false while focused → clear + unfocus."
  m3: "Corresponds to material3.SearchBar / DockedSearchBar + SearchBarDefaults.InputField. The structure is similar (both are a shell + inputField slot + controlled expanded), but M3's SearchBar covers the full screen when expanded and comes with an animation container, while Miuix just expands an AnimatedVisibility block in place; M3 does not clear query for you on collapse, Miuix does."

PullToRefresh:
  summary: "A MIUI-style pull-to-refresh container (damping curve + capsule indicator). Wrap scrollable content in it; it can cooperate with a TopAppBar's collapse behavior."
  gotchas:
    - text: "isRefreshing is a level value that the caller must host; the component calls onRefresh only once when the pull passes the threshold. If onRefresh doesn't set isRefreshing to true, the indicator immediately retracts; if it isn't set back to false after refresh completes, it spins forever."
      severity: "high"
      evidence: "miuix-ui/src/commonMain/kotlin/top/yukonga/miuix/kmp/basic/PullToRefresh.kt:159"
    - text: "Only a touch/touchpad press-pan gesture can start a pull session: the mouse wheel (PointerEventType.Scroll) does not change the session state, and mouse press is also explicitly excluded (`it.type != PointerType.Mouse`). On desktop and Web you can never pull out the refresh indicator with a mouse — this is deliberate (the wheel has no \"release\" event), but it makes people think the component is broken."
      severity: "high"
      evidence: "miuix-ui/src/commonMain/kotlin/top/yukonga/miuix/kmp/basic/PullToRefresh.kt:199"
    - text: "The name contentPadding is misleading: it is never applied to content; its only use is `RefreshHeader(modifier = Modifier.offset(y = contentPadding.calculateTopPadding()))`, and left/right/bottom are all ignored. It is actually \"the top offset of the refresh indicator,\" used to push the indicator below the TopAppBar."
      severity: "high"
      evidence: "miuix-ui/src/commonMain/kotlin/top/yukonga/miuix/kmp/basic/PullToRefresh.kt:234"
    - text: "After passing topAppBarScrollBehavior, the appbar's scroll events are forwarded via PullToRefresh's arbitrating connection (when Idle the appbar collapses first, during a pull refresh takes priority, during refreshing everything is consumed). Don't additionally attach the same scrollBehavior.nestedScrollConnection to the inner list, or the same scroll amount gets consumed twice."
      severity: "medium"
      evidence: "miuix-ui/src/commonMain/kotlin/top/yukonga/miuix/kmp/basic/PullToRefresh.kt:174"
    - text: "onPullProgress is collected by snapshotFlow, and at composition it immediately calls back once with the current value (usually 0f), only then followed by real changes. Don't treat \"receiving the callback\" as the signal that \"the user started pulling.\""
      severity: "low"
      evidence: "miuix-ui/src/commonMain/kotlin/top/yukonga/miuix/kmp/basic/PullToRefresh.kt:151"
    - text: "The default strings are four hard-coded English lines (\"Pull down to refresh\" / \"Release to refresh\" / \"Refreshing...\" / \"Refreshed successfully\"), and the default color is Color.Gray rather than a theme color. For localization and coloring you must explicitly pass refreshTexts and color."
      severity: "medium"
      evidence: "miuix-ui/src/commonMain/kotlin/top/yukonga/miuix/kmp/basic/PullToRefresh.kt:1027"
  visual:
    damping_curve: "f(x) = x - x² + x³/3, slope decreasing monotonically from 1 to 0 (1:1 tracking at the start, heavier the more you pull); f(1) = 1/3, i.e. the maximum damped displacement is one third of the window height"
    trigger_threshold: "default refreshThreshold = 0.25 → trigger displacement = 0.25 × H/3 = H/12; converted to a finger travel of about 0.091×H (about 219px on a 2400px screen)"
    indicator_full_scale: "H × (1/6) × (1/4) = H/24, i.e. a finger slide of about 0.044×H (about 104px) already fills the indicator"
    circle_size: "20.dp"
    text_style: "14.sp / Bold / Color.Gray"
    complete_anim: "tween(200ms, CubicBezierEasing(0f, 0f, 0f, 0.37f)) (fast first, then extremely slow)"
  state: "Bidirectional level sync — the external isRefreshing and the internal five-state machine (Idle / Pulling / ThresholdReached / Refreshing / RefreshComplete) drive each other, with the effect keyed by refreshState so as to re-sample the level (preventing a true→false pulse within one frame from being lost). The indicator displacement is driven by a hand-written frame loop + a spring engine, updating both dragOffset (visual) and currentTouch (the input of the damping curve) every frame, so that when the user grabs the list mid-way it doesn't jump."
  m3: "Corresponds to material3.PullToRefreshBox / rememberPullToRefreshState. M3's state only manages progress and animation, and the indicator is fully replaceable (an indicator slot); Miuix's indicator is four hard-coded Canvas drawings, only color/size/text are changeable, with no indicator slot. M3's Modifier.pullToRefresh also works, Miuix only has the wrapper container. Also, M3's pull is draggable with a mouse on desktop, while Miuix explicitly excludes the mouse."

rememberPullToRefreshState:
  summary: "Creates and remembers the visual state object for pull-to-refresh. You only need to call it explicitly when tuning the threshold or reading the pull progress externally."
  gotchas:
    - text: "It uses remember rather than rememberSaveable — the state resets to zero after a screen rotation or process death. The isRefreshing that truly needs to survive configuration changes must be hosted by the caller with rememberSaveable (this is also why the signature splits it out)."
      severity: "medium"
      evidence: "miuix-ui/src/commonMain/kotlin/top/yukonga/miuix/kmp/basic/PullToRefresh.kt:262"
    - text: "refreshThreshold is \"the fraction of the full damping travel\" rather than pixels or dp, and is coerceIn(0f, 1f). The trigger point is triggerProgressOffset = refreshThreshold × full damping travel, determined independently (PullToRefresh.kt:511 / 579), so passing 0f indeed triggers on any bit of pull, and lowering it lowers it without bound. The other hard-coded threshold refreshThresholdOffset (window height × 1/6 × 1/4) participates in only two places: taken as max with triggerProgressOffset as the denominator of pullProgress (effectiveThresholdOffset, PullToRefresh.kt:319-320), and taken as min to decide the indicator's full-draw point (visualProgress, PullToRefresh.kt:364-365)."
      severity: "medium"
      evidence: "miuix-ui/src/commonMain/kotlin/top/yukonga/miuix/kmp/basic/PullToRefresh.kt:272"
    - text: "The threshold depends on LocalWindowInfo.current.containerSize.height, and on the first frame the window size may still be 0, at which point the threshold is 0. The code has a SideEffect and a while loop specifically to remedy this startup race; a side effect is that in scenarios where isRefreshing is set to true programmatically on the first frame, the indicator position is retroactively corrected once."
      severity: "low"
      evidence: "miuix-ui/src/commonMain/kotlin/top/yukonga/miuix/kmp/basic/PullToRefresh.kt:269"
    - text: "The cachedNestedScrollConnection on PullToRefreshState is a public var, an internal implementation detail leaking into the public API. Don't read or write it."
      severity: "low"
      evidence: "miuix-ui/src/commonMain/kotlin/top/yukonga/miuix/kmp/basic/PullToRefresh.kt:331"
  visual: {}
  state: "Holds the visual state itself (dragOffset / refreshState / three progress values), with the logical state isRefreshing externalized. Publicly readable are refreshThreshold and three derivedStateOf progress values: pullProgress (relative to the trigger threshold, saturating at 1), fullDragProgress (relative to the full range, used for onPullProgress), and visualProgress (relative to the smaller of the two thresholds, ensuring the indicator is certainly fully drawn when entering ThresholdReached)."
  m3: "Corresponds to material3.rememberPullToRefreshState. M3's state only exposes distanceFraction and an animate method; Miuix adds threshold configuration, the five-state machine, and three progress values with distinct semantics."

VerticalScrollBar:
  summary: "An independent scrollbar attached beside scrollable content (it does not wrap the content). The whole ScrollBar API is marked @ExperimentalScrollBarApi."
  gotchas:
    - text: "The whole ScrollBar API requires opt-in (@ExperimentalScrollBarApi), though the level is WARNING not ERROR — it compiles without @OptIn, just with a warning. The annotation's own description says \"has known issues and may change without notice,\" and it is the only component in this group without a docs page (there is no scrollbar.md under docs/components/)."
      severity: "medium"
      evidence: "miuix-ui/src/commonMain/kotlin/top/yukonga/miuix/kmp/interfaces/ExperimentalScrollBarApi.kt:15"
    - text: "It does not wrap content but is a sibling node that occupies its own place: in measurePolicy the width is fixed at thumbWidth + endPadding×2 and the height fills constraints.maxHeight. The correct usage is to put it and the scrolling content together in a Box and align it to the edge; placing it directly in a Column takes up a row."
      severity: "high"
      evidence: "miuix-ui/src/commonMain/kotlin/top/yukonga/miuix/kmp/basic/ScrollBar.kt:464"
    - text: "The initial opacity is 0f, and in drawBehind `opacity <= 0f` returns directly — that is, the scrollbar is completely invisible on first entering the page; you must scroll once (or hover the mouse) for it to fade in, then it fades out after 1 second. What seems like \"it didn't render\" is mostly this."
      severity: "high"
      evidence: "miuix-ui/src/commonMain/kotlin/top/yukonga/miuix/kmp/basic/ScrollBar.kt:272"
    - text: "The fade-out animation is hard-coded as `animate(initialValue = 1f, ...)`, so when interrupted and re-triggered mid-way it first jumps back to fully opaque and then fades out, showing a flicker."
      severity: "low"
      evidence: "miuix-ui/src/commonMain/kotlin/top/yukonga/miuix/kmp/basic/ScrollBar.kt:301"
    - text: "Clicking the empty track area neither pages nor jumps — the gesture has two layers of filtering: first whether it falls within the 48dp touch band, then whether it falls within the thumb's pixel range; only when both pass does dragging begin."
      severity: "low"
      evidence: "miuix-ui/src/commonMain/kotlin/top/yukonga/miuix/kmp/basic/ScrollBar.kt:366"
    - text: "The thumb-length animation is implemented by writing snapshot state and launching a coroutine inside drawBehind (an explicit Compose anti-pattern; it only avoids entering an infinite redraw thanks to two gates, \"difference ≥ 1px\" and \"skip if the previous animation hasn't finished\"). This is one of the main reasons this component is marked experimental, and it risks blowing up on future Compose versions."
      severity: "medium"
      evidence: "miuix-ui/src/commonMain/kotlin/top/yukonga/miuix/kmp/basic/ScrollBar.kt:415"
  visual:
    thumb_width: "3.64.dp (animates to 6.dp on hover/drag, tween 150ms)"
    end_padding: "3.46.dp"
    thumb_min_length: "36.dp"
    corner_radius: "Dp.Unspecified → takes half of thumbWidth"
    alpha: "0.1 normally, 0.3 on hover/drag (when thumbColor is Unspecified; if a color is passed explicitly it uses that color's own alpha)"
    fade: "starts fading out 1000ms after scrolling stops, fade-out takes 500ms"
    touch_target: "a 48.dp-wide touch band"
  state: "Holds no scroll state at all — it reads only the three quantities \"total content length / current offset / viewport length\" from a ScrollBarAdapter, and scrolling is still owned by the original ScrollState/LazyListState. Internally it only has visual state like opacity, isDragging, and displayedThumbLength."
  m3: "No counterpart (Material3 mobile has no scrollbar component). By lineage it is JetBrains Compose Desktop's Scrollbar: structures and names like ScrollBarAdapter, LazyLineContentAdapter, and firstFloatingVisibleItemIndex all come from there."

HorizontalScrollBar:
  summary: "A horizontal scrollbar; its parameter list is word-for-word identical to VerticalScrollBar, only the direction differs."
  gotchas:
    - text: "The value of trackPadding in the horizontal branch hard-codes LayoutDirection to Ltr (`trackPadding.calculateLeftPadding(LayoutDirection.Ltr)` / `calculateRightPadding(LayoutDirection.Ltr)`). Under an RTL layout the start/end padding is taken from the opposite side."
      severity: "medium"

    corner_radius: "12.dp"
    inside_margin: "PaddingValues(horizontal = 12.dp, vertical = 8.dp)"
    caret_size: "DpSize(16.dp, 8.dp); its position is coerceIn-clamped within the corner radius so it doesn't run onto the corner"
  state: "Stateless. It obtains positioning and obtainAnchorBounds() via TooltipScope to decide the caret's orientation and horizontal position."
  m3: "Corresponds to material3.PlainTooltip (also a TooltipScope extension). M3's caret is a real Shape provided via TooltipDefaults and customizable, while Miuix's caretShape is just a boolean switch; M3's PlainTooltip has maxWidth/shape/contentColor/containerColor/tonalElevation/shadowElevation, while Miuix lacks the two elevation items."

RichTooltip:
  summary: "A rich tooltip with a title, body, and action buttons; it can only be written in TooltipBox's tooltip slot."
  gotchas:
    - text: "It is also a `TooltipScope` extension function, and its three caretShape limitations are exactly the same as PlainTooltip's (no caret by default, Shape is just a switch, only above/below orientations supported)."
      severity: "high"
      evidence: "miuix-ui/src/commonMain/kotlin/top/yukonga/miuix/kmp/basic/Tooltip.kt:498"
    - text: "To make it \"stay until the user acts\" you must do both: use `rememberTooltipState(isPersistent = true)` for state, and pass focusable = true to TooltipBox. Doing only the former means clicking outside won't close it; doing only the latter means one popped by a touch long-press still doesn't time out (see TooltipBox), but it disappears once the mouse moves away."
      severity: "high"
      evidence: "miuix-ui/src/commonMain/kotlin/top/yukonga/miuix/kmp/basic/Tooltip.kt:219"
  visual:
    max_width: "320.dp"
    corner_radius: "16.dp"
    inside_margin: "PaddingValues(all = 16.dp)"
    action_button: "corner radius 8.dp, inner padding horizontal 12.dp / vertical 6.dp"
    caret_size: "DpSize(16.dp, 8.dp), only Above/Below take effect"
  state: "No state of its own; persistence is decided by the external TooltipState(isPersistent). When persistent, dismiss() actively cancels the suspended show coroutine."
  m3: "Corresponds to material3.RichTooltip (the title/action/text three-slot structure is consistent). Differences are the same as PlainTooltip: the caret is just a switch, no elevation parameter; also M3's RichTooltip more commonly defaults to a persistent + focusable combination, while Miuix needs it configured by hand."

RichTooltipBox:
  summary: "A convenience wrapper around RichTooltip — it takes the three content blocks title / text / action directly and internally builds a persistent state and RichTooltip for you."
  gotchas:
    - text: "Its state default is `rememberTooltipState(isPersistent = true)`, opposite to TooltipBox's convenience version's `isPersistent = false`. When mixing the two, note that the difference between \"disappears on a tap\" and \"must be closed manually\" comes from here."
      severity: "medium"
      evidence: "miuix-ui/src/commonMain/kotlin/top/yukonga/miuix/kmp/basic/Tooltip.kt:675"
    - text: "A persistent tooltip does not time out automatically (the timeout branch takes effect only for non-persistent and non-UserInput priority), so using this convenience version means you must give the user a way to close it — an action button, clicking outside (requires focusable), or an explicit state.dismiss()."
      severity: "high"
      evidence: "miuix-ui/src/commonMain/kotlin/top/yukonga/miuix/kmp/basic/Tooltip.kt:202"
  visual:
    inherits_rich_tooltip: "max_width 320.dp / corner_radius 16.dp / inside_margin 16.dp"
  state: "Internally builds a persistent TooltipState by default, or one can be passed in externally for programmatic show/hide control."
  m3: "No one-to-one counterpart — M3 has only the single TooltipBox container, and the difference between rich and plain is reflected by which component you put in the tooltip slot. Miuix additionally provides this convenience shell."

rememberTooltipState:
  summary: "Creates and remembers a tooltip's show/hide state, deciding whether it is a \"brief hint\" or a \"persistent card.\""
  gotchas:
    - text: "isPersistent = false (the default) does not mean \"it times out automatically.\" The timeout branch's condition is `!isPersistent && mutatePriority != UserInput`, and all gesture entries use UserInput — so a non-persistent tooltip popped by a touch long-press also doesn't time out; only programmatically calling state.show() (default MutatePriority.Default) consumes that TooltipDuration."
      severity: "high"
      evidence: "miuix-ui/src/commonMain/kotlin/top/yukonga/miuix/kmp/basic/Tooltip.kt:202"
    - text: "It remembers by (isPersistent, mutatorMutex) — using an isPersistent that changes with state rebuilds the whole state and loses the current show/hide. Also, the default mutatorMutex is `BasicTooltipDefaults.GlobalMutatorMutex`, which is @ExperimentalFoundationApi; the source shields it internally with @OptIn, but if you pass this value explicitly you need to add @OptIn yourself."
      severity: "medium"
      evidence: "miuix-ui/src/commonMain/kotlin/top/yukonga/miuix/kmp/basic/Tooltip.kt:243"
  visual: {}
  state: "Uses remember (not rememberSaveable). Under the same MutatorMutex only one tooltip is globally visible — a new show() preempts and closes the old one. isVisible remains true while the animation hasn't finished, to ensure an interrupted enter can play its exit in reverse."
  m3: "Corresponds to material3.rememberTooltipState(initialIsVisible, isPersistent, mutatorMutex), with basically identical signature and semantics. The difference is that Miuix's implementation forks from foundation's BasicTooltipState and restores the M3 behavior of \"a persistent one is not closed when the mouse leaves the anchor.\""

SnackbarHostState:
  summary: "The state holder for Snackbar (package top.yukonga.miuix.kmp.basic), passed to SnackbarHost(state = …). The display entry is the member function suspend fun showSnackbar(message: String, actionLabel: String? = null, withDismissAction: Boolean = false, duration: SnackbarDuration = SnackbarDuration.Short): SnackbarResult; there are also the suspend newestSnackbarData() / oldestSnackbarData()."
  gotchas:

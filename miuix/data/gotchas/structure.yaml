      severity: medium
      evidence: miuix-ui/src/commonMain/kotlin/top/yukonga/miuix/kmp/basic/Snackbar.kt:183-228
    - text: "SnackbarDuration is not a Material3 enum but a sealed interface: the three data objects Short, Long, Indefinite, plus Custom(durationMillis: Long) that can specify a millisecond count."

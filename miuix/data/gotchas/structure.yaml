# Structure and container components (Scaffold / top bar / navigation bars / scroll containers / feedback layers)

Scaffold:
  summary: "The library's only page-root container. It uses SubcomposeLayout to hand-place 7 slots (topBar / bottomBar / fab / floatingToolbar / snackbarHost / popupHost / content), and it is also the host for all Overlay* popups and dialogs. Any page that uses an Overlay-family component must wrap a layer of it."
  gotchas:
    - text: "The two host slots have asymmetric defaults: popupHost already mounts MiuixPopupHost() by default so popups work out of the box, whereas snackbarHost defaults to an empty lambda `{}`. Following intuition and only writing `SnackbarHostState()` + `showSnackbar()` makes nothing appear — you must explicitly write `snackbarHost = { SnackbarHost(state = snackbarHostState) }`. Worse, showSnackbar is suspend and completes via a timer inside SnackbarHost; with no host mounted that coroutine suspends forever and entries pile up in the state."
      severity: "high"
      evidence: "miuix-ui/src/commonMain/kotlin/top/yukonga/miuix/kmp/basic/Scaffold.kt:87"
    - text: "The PaddingValues that the content lambda receives do not take effect automatically. Scaffold measures content with looseConstraints and place(0, 0), i.e. content fills the whole screen and sits directly under topBar. You must apply `Modifier.padding(paddingValues)` yourself (or convert the top value into a LazyColumn's contentPadding). Omitting it will definitely be obscured when there is a topBar."
      severity: "high"
      evidence: "miuix-ui/src/commonMain/kotlin/top/yukonga/miuix/kmp/basic/Scaffold.kt:351"
    - text: "The content PaddingValues are computed only from topBar height / bottomBar height / contentWindowInsets; FAB and floatingToolbar do not participate at all. If you assume \"adding padding means it won't be covered,\" the bottom will still be covered by the FAB or the floating toolbar, and you need to add extra bottom spacing yourself."
      severity: "medium"
      evidence: "miuix-ui/src/commonMain/kotlin/top/yukonga/miuix/kmp/basic/Scaffold.kt:325"
    - text: "The available height for floatingToolbar is `layoutHeight - topBar height - topInset - bottomInset`, and only the bottomBar height is not subtracted. So a floating toolbar in a bottom position such as BottomCenter will sit directly on top of the NavigationBar (the FAB has dedicated avoidance logic). To have both coexist you must add bottom padding to the floatingToolbar yourself."
      severity: "medium"
      evidence: "miuix-ui/src/commonMain/kotlin/top/yukonga/miuix/kmp/basic/Scaffold.kt:282"
    - text: "The floatingToolbar's y coordinate is written as `topBarPlaceable.height + topInset + position.y - 4dp`, but TopAppBar/SmallTopAppBar already carry status-bar padding internally, so their height already includes topInset — which amounts to counting the status-bar height twice. BottomStart/BottomCenter/BottomEnd work out correctly because position.y carries a negative sign that cancels it out; the Top* and Center* positions shift down by about one status-bar height, and are also unconditionally pushed up 4dp into the topBar. Correct non-bottom positions yourself."
      severity: "medium"
      evidence: "miuix-ui/src/commonMain/kotlin/top/yukonga/miuix/kmp/basic/Scaffold.kt:290"
    - text: "Scaffold passes no insets to topBar / bottomBar — the contract is \"each bar handles its own side.\" So a custom bar must write its own windowInsetsPadding, otherwise it will be crushed under the status bar / gesture bar; and Scaffold's contentWindowInsets is no longer added to content when a bar is present."
      severity: "medium"
      evidence: "miuix-ui/src/commonMain/kotlin/top/yukonga/miuix/kmp/basic/Scaffold.kt:69"
    - text: "When Scaffolds are nested, each level news up its own popup/dialog list, but at the same time passes the outermost one through as LocalRootPopupStates/LocalRootDialogStates; and the renderInRootScaffold of Overlay* components defaults to true. The result is \"a dialog popped inside an inner Scaffold renders into the outermost Scaffold\" — to confine it to the inner one you must explicitly pass renderInRootScaffold = false."
      severity: "medium"
      evidence: "miuix-ui/src/commonMain/kotlin/top/yukonga/miuix/kmp/utils/MiuixPopupUtils.kt:176"
  visual:
    fab_spacing: "12.dp (spacing between the FAB and bottomBar / screen bottom; a private constant, not configurable)"
    floating_toolbar_spacing: "4.dp (spacing between the floating toolbar and the bottom edge; a private constant, not configurable)"
    container_color: "MiuixTheme.colorScheme.surface"
    content_window_insets: "WindowInsets.systemBars ∪ WindowInsets.displayCutout"
  state: "Stateless itself. snackbarHostState / the topAppBar's ScrollBehavior / the various selectedIndex are all remembered by the caller and passed into the slots. The only thing it holds is the popup/dialog list (a remembered mutableStateListOf, tied to the Scaffold lifecycle), dispatched down via 4 CompositionLocals. The PaddingValues passed to content is a mutable object whose identity never changes; value changes only trigger a re-measure of the nodes that read it and do not recompose content."
  m3: "Corresponds to androidx.compose.material3.Scaffold, with much of the implementation copied line by line from upstream (including the explicit copy of MutableWindowInsets). Differences: it adds the two extra slot groups floatingToolbar + floatingToolbarPosition and popupHost; FabPosition has an extra EndOverlay position (ignores bottomBar and covers it directly); snackbarHost defaults to empty (M3 is also empty, but nearly every tutorial in the M3 ecosystem writes one in, and the Miuix docs once claimed \"no SnackbarHost is provided,\" which was misleading); no M3 contentColor parameter."

TopAppBar:
  summary: "A MIUI-style collapsible large-title bar — when expanded it shows a large-font largeTitle, and as content scrolls up it collapses into a 52dp-tall small title bar. Use it when you want the collapse effect; use SmallTopAppBar for a fixed height."
  gotchas:
    - text: "Just passing scrollBehavior to TopAppBar will not collapse it. You must also attach `Modifier.nestedScroll(scrollBehavior.nestedScrollConnection)` to the scrolling content (LazyColumn / verticalScroll container) so the collapse amount has a source."
      severity: "high"
      evidence: "miuix-ui/src/commonMain/kotlin/top/yukonga/miuix/kmp/basic/TopAppBar.kt:451"
    - text: "`defaultWindowInsetsPadding = false` only turns off the left and right sides (the Horizontal of displayCutout + navigationBars); the top `systemBars.only(Top)` padding is written outside the if and takes effect unconditionally. Fully taking over the status-bar height yourself is impossible; you can only accept this padding instead."
      severity: "medium"
      evidence: "miuix-ui/src/commonMain/kotlin/top/yukonga/miuix/kmp/basic/TopAppBar.kt:806"
    - text: "The large title's fade-out endpoint is at 1/3 of the collapse progress (`1f - (frac * 3f).coerceIn(0,1)`), and the small title's appearance threshold is also 1/3 (`collapsedFraction * 3f >= 1f`). That is, by the time you scroll one third of the way the title switch is already complete, and only the height changes over the remaining two thirds. To \"keep the large title visible the whole time\" you need to enlarge the largeTitle's height yourself rather than tweak the animation."
      severity: "low"
      evidence: "miuix-ui/src/commonMain/kotlin/top/yukonga/miuix/kmp/basic/TopAppBar.kt:650"
    - text: "The `translationY` offset used when the small title fades in is hard-coded to 20f, and graphicsLayer's translationY unit is pixels, not dp. On a 3x-density screen the physical displacement is only one third of a 1x screen, so on high-density devices this animation is barely noticeable."
      severity: "low"
      evidence: "miuix-ui/src/commonMain/kotlin/top/yukonga/miuix/kmp/basic/TopAppBar.kt:684"
    - text: "The collapse limit heightOffsetLimit is written by the inner large-title Column's onSizeChanged, and it is a plain var, not snapshot state (changing it alone triggers no re-measure). Before the height is measured on the first frame this value is the initial -Float.MAX_VALUE, at which point collapsedFraction = heightOffset / -Float.MAX_VALUE is nearly always 0 (not NaN; the isNaN fallback in the measure lambda at TopAppBar.kt:867 guards heightOffset itself, not collapsedFraction). Don't read collapsedFraction on the first frame to make business decisions."
      severity: "low"
      evidence: "miuix-ui/src/commonMain/kotlin/top/yukonga/miuix/kmp/basic/TopAppBar.kt:758"
  visual:
    collapsed_height: "52.dp (TopAppBarDefaults.CollapsedHeight, the bar height after collapse)"
    title_padding: "26.dp (horizontal inner padding of the title and large title)"
    navigation_icon_padding: "16.dp"
    action_icon_padding: "16.dp"
    large_title_bottom_padding: "4.dp (when there is no subtitle); with a subtitle it switches to SubtitleBottomPadding = 8.dp"
    title_max_width: "90% of the available width (total width minus the navigation icon and action area); a private constant TITLE_WIDTH_FRACTION, not configurable"
    small_title_anim: "show folmeSpring(damping=1.0, response=0.3), hide response=0.15 (hide is twice as fast as show)"
  state: "A purely controlled shell + an externally hosted TopAppBarState. scrollBehavior is nullable (not passing it means a non-collapsing fixed large-title bar). During scrolling all state reads are sunk into the layout/draw phase (closures + Modifier.offset{} / graphicsLayer{} / measure lambda), so 60fps scrolling produces no recomposition; the only thing that recomposes is the derivedStateOf<Boolean> for the small title's show/hide, which flips only once or twice per scroll."
  m3: "Corresponds to material3's LargeTopAppBar / TopAppBar family, but the semantics differ. M3's TopAppBar is a single \"title + navigation + actions\" form and switches behavior via the three implementations of TopAppBarScrollBehavior (pinned/enterAlways/exitUntilCollapsed); Miuix has only one exitUntilCollapsed behavior (ScrollBehavior.isPinned is always false), merges the large/small titles into the same component, and additionally provides subtitle and bottomContent slots. M3's colors/windowInsets parameters are split here into color/titleColor/largeTitleColor/subtitleColor and a boolean switch defaultWindowInsetsPadding."

SmallTopAppBar:
  summary: "A fixed 52dp-tall small title bar with vertically centered content. Use it for wide screens, secondary pages, or when you don't need large-title collapse."
  gotchas:
    - text: "Although the parameters include scrollBehavior, it never collapses. The moment the component enters composition it uses SideEffect to set pinnedBySmallTopAppBar to true and zeroes out both heightOffsetLimit and heightOffset, so the collapse range is squashed to 0. Moreover scrollBehavior is never passed down to SmallTopAppBarLayout (TopAppBar.kt:213-227); there is no alpha animation in the layout, the small title is always visible and there is no fade-in. The only real use of passing scrollBehavior is to share the same behavior/state with a TopAppBar: it preserves contentOffset when switching between wide/narrow screens, so that switching back to TopAppBar lands directly on the correct collapse state. Expecting it to collapse per the TopAppBar docs is wrong."
      severity: "high"
      evidence: "miuix-ui/src/commonMain/kotlin/top/yukonga/miuix/kmp/basic/TopAppBar.kt:189"
    - text: "Switching the same ScrollBehavior between SmallTopAppBar and TopAppBar (wide/narrow-screen adaptation) is specifically supported: when switching back to TopAppBar it uses contentOffset to judge whether the content has already scrolled down and lands directly on fully collapsed or fully expanded, avoiding a sudden pop of the large title. Conversely, sharing one ScrollBehavior between two TopAppBars is undefined; don't do that."
      severity: "medium"
      evidence: "miuix-ui/src/commonMain/kotlin/top/yukonga/miuix/kmp/basic/TopAppBar.kt:653"
    - text: "As with TopAppBar, the top `systemBars.only(Top)` padding still takes effect when defaultWindowInsetsPadding = false."
      severity: "medium"
      evidence: "miuix-ui/src/commonMain/kotlin/top/yukonga/miuix/kmp/basic/TopAppBar.kt:1031"
  visual:
    bar_height: "52.dp (TopAppBarDefaults.CollapsedHeight)"
    content_vertical_center: "the baseline is SmallTopAppBarCenterHeight / 2 = 25.dp, 1dp higher than the geometric center of 52dp — this is deliberate visual balancing, not a typo"
    subtitle_bottom_padding: "8.dp"
  state: "Shares TopAppBarState with TopAppBar. It only writes, never reads: a SideEffect one-directionally pins the state. The small title's show/hide is judged under the pinned branch using `contentOffset < 0f` (because collapsedFraction is always 0 when limit==0)."
  m3: "Corresponds to material3.TopAppBar (CenterAlignedTopAppBar is semantically closer, since the title is centered and clamped by the navigation/action icons). M3 uses `TopAppBarDefaults.pinnedScrollBehavior()` to express \"no collapse,\" whereas Miuix flattens the state within the component itself, so whether it is pinned is determined by which component you use, not by the behavior."

MiuixScrollBehavior:
  summary: "The factory for TopAppBar collapse behavior; it returns a ScrollBehavior carrying a nestedScrollConnection. To collapse the title bar, first call it in composition, then pass the state to the bar and attach the connection to the content."
  gotchas:
    - text: "The name is upper camel case and looks like a constructor or object, but it is actually a @Composable function (the source uses @Suppress(\"ComposableNaming\") to silence the naming warning). It cannot be written as a top-level val, nor called inside remember{} / LaunchedEffect; it must be called directly in composition scope."
      severity: "high"
      evidence: "miuix-ui/src/commonMain/kotlin/top/yukonga/miuix/kmp/basic/TopAppBar.kt:249"
    - text: "In the sole implementation it returns, isPinned is always false, and there is no second ScrollBehavior in the library. Although the ScrollBehavior interface exposes an isPinned member, the whole repository has no read site for it — to \"pin\" you can only switch to SmallTopAppBar; there is no counterpart such as pinnedScrollBehavior."
      severity: "medium"
      evidence: "miuix-ui/src/commonMain/kotlin/top/yukonga/miuix/kmp/basic/TopAppBar.kt:480"
  visual:
    snap_spec: "spring(stiffness = 2500f) (the default snap stiffness is very high, nearly an instant return to place; this is the MIUI feel rather than Material's slow spring-back)"
    settle_threshold: "collapsedFraction < 0.5f springs back to expanded, otherwise collapses fully"
  state: "Each call remembers by the four-tuple (state, canScroll, snapAnimationSpec, flingAnimationSpec). state defaults to rememberTopAppBarState() (rememberSaveable, surviving configuration changes and process death). canScroll is a closure called in real time on every scroll, usable to forbid collapse under certain conditions."
  m3: "Corresponds to TopAppBarDefaults.exitUntilCollapsedScrollBehavior(). M3 provides three — pinned / enterAlways / exitUntilCollapsed; Miuix has only this one, and the factory function name carries neither a remember prefix nor a Defaults ownership."

rememberTopAppBarState:
  summary: "Creates and remembers a TopAppBarState (collapse limit, current collapse amount, cumulative content scroll amount). Normally you don't call it directly, since MiuixScrollBehavior's default parameter already does; call it explicitly only when you need to share it across components or read the collapse progress."
  gotchas:
    - text: "The default of initialHeightOffsetLimit is -Float.MAX_VALUE rather than 0. Before the large title's measured height is written in, collapsedFraction's denominator is this huge negative number and the ratio is almost always 0; don't treat the collapsedFraction read on the first frame as the real state."
      severity: "low"
      evidence: "miuix-ui/src/commonMain/kotlin/top/yukonga/miuix/kmp/basic/TopAppBar.kt:276"
    - text: "The overlappedFraction property exposed on TopAppBarState has no read site anywhere in the repository, and no component changes its appearance based on it. It is not a usable signal for \"whether content covers the bar\"; don't use it for visual judgments as the KDoc describes."
      severity: "low"
      evidence: "miuix-ui/src/commonMain/kotlin/top/yukonga/miuix/kmp/basic/TopAppBar.kt:356"
  visual: {}
  state: "rememberSaveable + listSaver, saving 4 values (limit / offset / contentOffset / pinnedBySmallTopAppBar); restore is backward-compatible with the old 3-element list. Note that heightOffsetLimit is a plain var, not snapshot state (changing it alone triggers no re-measure), while heightOffset is a mutableFloatStateOf whose setter does coerceIn(limit, 0f)."
  m3: "Corresponds to material3.rememberTopAppBarState, with basically identical parameters and semantics; Miuix adds one internal pinnedBySmallTopAppBar field used for wide/narrow-screen switching."

NavigationBar:
  summary: "A bottom navigation bar with a slot-based API (you place NavigationBarItems inside content yourself), with a divider and bottom system-bar spacing. Put it in the Scaffold's bottomBar."
  gotchas:
    - text: "It has no parameters like items / selected / onClick (such examples in the docs are wrong and won't compile). The only signature is slot-based: `NavigationBar { items.forEachIndexed { i, item -> NavigationBarItem(selected = ..., onClick = ..., icon = ..., label = ...) } }`, where content is a required trailing lambda."
      severity: "high"
      evidence: "miuix-ui/src/commonMain/kotlin/top/yukonga/miuix/kmp/basic/NavigationBar.kt:74"
    - text: "It doesn't handle horizontal window insets at all (TopAppBar handles the Horizontal of displayCutout/navigationBars, NavigationRail handles Start, only this one doesn't). In landscape + notch screens the outermost items get clipped; the caller must add windowInsetsPadding on the modifier."
      severity: "medium"
      evidence: "miuix-ui/src/commonMain/kotlin/top/yukonga/miuix/kmp/basic/NavigationBar.kt:109"
    - text: "On iOS the bottom spacing is hard-coded to 20.dp (it does not read WindowInsets.navigationBars), because that inset is unreliable for CMP on iOS. On an iPad or a device without a Home Indicator you get the same 20dp gap, which you can only turn off with defaultWindowInsetsPadding = false and then add your own."
      severity: "medium"
      evidence: "miuix-ui/src/commonMain/kotlin/top/yukonga/miuix/kmp/basic/NavigationBar.kt:113"
    - text: "The display mode (IconAndText / IconOnly / IconWithSelectedLabel) is dispatched to the item via CompositionLocal, so there is no mode parameter on the item. If you place a NavigationBarItem outside NavigationBar (or under a separate CompositionLocalProvider layer), you get the default IconAndText."
      severity: "low"
      evidence: "miuix-ui/src/commonMain/kotlin/top/yukonga/miuix/kmp/basic/NavigationBar.kt:105"
  visual:
    item_height: "64.dp"
    icon_size: "26.dp"
    label_font_size: "12.sp"
    icon_top_padding: "8.dp (selected state; when unselected in IconWithSelectedLabel it changes to (64-26)/2 = 19.dp, centered)"
    label_bottom_padding: "8.dp"
    caption_bar_anim: "when entering/leaving split-screen / freeform window, the captionBar height transitions with tween(300ms) to avoid an inset-jump flicker"
  state: "Purely controlled, zero state. The selected state is driven entirely by the caller's selected: Boolean + onClick; the component knows nothing about routing (miuix-nav is an independent module with no code dependency here). mode is dispatched down one-directionally via LocalNavigationBarDisplayMode."
  m3: "Corresponds to material3.NavigationBar. Differences: M3's NavigationBarItem has label/alwaysShowLabel/colors etc.; Miuix expresses the same thing with a three-way mode enum + CompositionLocal; M3 has a windowInsets parameter accepting any WindowInsets, while Miuix only has a boolean switch and no horizontal direction; M3's item has an indicator pill background, while Miuix's bottom-bar item has no indicator (it distinguishes only by color alpha)."

NavigationBarItem:
  summary: "A single item of the bottom navigation bar, icon + text, with badge support. Can only be placed inside NavigationBar."
  gotchas:
    - text: "It is an extension function on `RowScope` (internally using weight(1f) to split the width evenly). Placing it in a Column, Box, or any non-RowScope scope fails to compile directly; and the identically named FloatingNavigationBarItem is a plain function — the two are not interchangeable."
      severity: "high"
      evidence: "miuix-ui/src/commonMain/kotlin/top/yukonga/miuix/kmp/basic/NavigationBar.kt:145"
    - text: "The selected/pressed colors are `original color.alpha * factor` multiplied rather than replaced (unselected 0.4, unselected-pressed 0.6, selected-pressed 0.5). Passing Color.Transparent stays fully transparent, and passing a semi-transparent color multiplies once more on top of it — for \"grey when unselected, blue when selected\" you can't rely on colors alone; you must pass two different color values."
      severity: "medium"
      evidence: "miuix-ui/src/commonMain/kotlin/top/yukonga/miuix/kmp/basic/NavigationBar.kt:498"
    - text: "indication is explicitly set to null, so there is no ripple feedback; press feedback relies entirely on the alpha multiplication above. This is the deliberate MIUI look, but it means LocalIndication has no effect here."
      severity: "low"
      evidence: "miuix-ui/src/commonMain/kotlin/top/yukonga/miuix/kmp/basic/NavigationBar.kt:173"
    - text: "The morph in IconWithSelectedLabel mode uses `by animateDpAsState` / `by animateFloatAsState`, but both reads are sunk outside composition: iconTopPadding is read inside the measure lambda of `Modifier.layout{}` (NavigationBar.kt:219), and textAlpha inside `graphicsLayer{}` (NavigationBar.kt:237). So this 300ms animation only re-measures/redraws and does not recompose the item every frame. What actually reads the progress in composition is the label leaf of NavigationRailItem (font size is a composition-time parameter of Text and cannot be sunk)."
      severity: "low"
      evidence: "miuix-ui/src/commonMain/kotlin/top/yukonga/miuix/kmp/basic/NavigationBar.kt:205"
  visual:
    icon_size: "26.dp"
    label_font_size: "12.sp, bold when selected (FontWeight.Bold), Normal when unselected"
    alpha: "unselected 0.4 / unselected-pressed 0.6 / selected-pressed 0.5 / selected 1.0 (all multiplied with the original color's alpha)"
    morph_duration: "300ms tween (in IconWithSelectedLabel mode the icon moves up + the text fades in)"
  state: "Purely controlled. Both selected and onClick are required; there is no internal selected state. interactionSource is built internally and cannot be passed in from outside."
  m3: "Corresponds to material3.NavigationBarItem. That M3's is also a RowScope extension is the same; the differences are that M3 has alwaysShowLabel, an indicator pill, and a configurable NavigationBarItemColors with 6 color slots, while Miuix has only two base colors + fixed alpha factors and no indicator."

NavigationRail:
  summary: "A side navigation bar, for wide screens. Since 0.9.4 it is one of two overloads: `NavigationRail(expanded = …)` is a fixed layout (collapsed = the classic vertical stack with icon above and text below, expanded = a pill list with icon in front and text after, no toggle button, no animation); `NavigationRail(state = rememberNavigationRailState())` is a switchable layout (a built-in expand/collapse button at the top, with a continuous morph animation between the two layouts). Passing nothing means fixed collapsed."
  gotchas:
    - text: "0.9.4 is a breaking change: the original single `NavigationRail(modifier, state: NavigationRailState? = null, …)` was split into `NavigationRail(modifier, expanded: Boolean = false, …)` and `NavigationRail(state: NavigationRailState, modifier, …)`, with state becoming non-null and moved to first position. The old forms `NavigationRail(state = null)`, `NavigationRail(state = if (wide) railState else null)`, and the positional `NavigationRail(Modifier.x, railState)` all fail to compile on 0.9.4 because no matching overload exists (it does not silently fall through to the other overload); the named-parameter form `NavigationRail(modifier = m, state = railState)` still compiles. Migration: change nullable state to always passing a non-null state, and drive wide/narrow screens with expand()/collapse(); change places that passed null to omitting it or writing `expanded = false`. Conversely, `expanded = …` written for 0.9.4 also fails to compile on 0.9.4-rc01 and earlier."
      severity: "high"
      evidence: "miuix-ui/src/commonMain/kotlin/top/yukonga/miuix/kmp/basic/NavigationRail.kt:143"
    - text: "The two overloads have asymmetric capabilities: the expand/collapse button and the morph animation belong only to the state overload, and as soon as you use the state overload the button always appears — no parameter can hide it; the expanded overload never has a button, and when expanded flips, the width and item layout jump within one frame (the progress is a `remember(expanded) { mutableStateOf(0f/1f) }` constant, not an animation). So \"animation but no built-in button\" is impossible with either overload; for \"auto-expand on wide screens with animation\" you must use the state overload + call expand()/collapse() yourself in a LaunchedEffect."
      severity: "medium"
      evidence: "miuix-ui/src/commonMain/kotlin/top/yukonga/miuix/kmp/basic/NavigationRail.kt:196-204"
    - text: "expandContentDescription / collapseContentDescription exist only on the state overload (the expanded overload has no button and naturally lacks these two parameters); passing them to the expanded overload fails to compile. The defaults are hard-coded English \"Expand navigation rail\" / \"Collapse navigation rail\"; when using the state overload and needing localization you must pass them explicitly."
      severity: "medium"
      evidence: "miuix-ui/src/commonMain/kotlin/top/yukonga/miuix/kmp/basic/NavigationRail.kt:151-152"
    - text: "The library has no breakpoints or adaptive logic; whether it expands comes only from the caller's state or expanded (the sample app itself uses width >= 1200.dp). And although miuix-ui declares a dependency on material3-window-size-class, no line of Kotlin in the whole repository uses WindowSizeClass — don't expect the library to provide WindowSizeClass integration."
      severity: "medium"
      evidence: "miuix-ui/src/commonMain/kotlin/top/yukonga/miuix/kmp/basic/NavigationRail.kt:190"
    - text: "When expandedWidth is smaller than minWidth it is silently corrected to minWidth via coerceAtLeast (expanded equals not expanded, without an error). Also, changing minWidth away from the default 80.dp breaks a deliberately tuned numeric coincidence: the collapsed-state icon center (80-28)/2 = 26dp exactly equals the expanded state's 12dp outer margin + 14dp inner padding, so under the default parameters the X coordinates of the state overload's icon and toggle button stay perfectly still throughout the animation; after changing minWidth they drift left and right during expansion."
      severity: "medium"
      evidence: "miuix-ui/src/commonMain/kotlin/top/yukonga/miuix/kmp/basic/NavigationRail.kt:192"
    - text: "The insets order of the inner scroll column is deliberate: statusBars.only(Top) is outside verticalScroll (the top spacing stays fixed and doesn't scroll), navigationBars.only(Bottom) is inside verticalScroll (the bottom spacing scrolls with the content to the end). The background color is also deliberately drawn before the insets padding, so the rail's color spreads under the side notch. Changing the order of these lines produces visible visual bugs."
      severity: "low"
      evidence: "miuix-ui/src/commonMain/kotlin/top/yukonga/miuix/kmp/basic/NavigationRail.kt:242-244"
  visual:
    collapsed_width: "80.dp (MinWidth)"
    expanded_width: "240.dp (ExpandedWidth)"
    icon_size: "28.dp"
    label_font_size: "collapsed 12.sp → expanded 16.sp (the state overload interpolates; the expanded overload takes one of the two ends directly)"
    expanded_pill: "corner radius 16.dp, left/right outer margin 12.dp, inner padding 14.dp, icon-to-text spacing 16.dp"
    vertical_padding: "24.dp (top and bottom of content), HeaderSpacing 24.dp (after the expand button/header)"
    expand_content_description: "only the state overload has this parameter; the defaults are hard-coded English \"Expand navigation rail\" / \"Collapse navigation rail\"; for localization you must pass it explicitly"
  state: "The expanded overload is stateless: expanded is passed directly by the caller, and internally it only remembers a constant progress, flipping means an instant jump. The state overload's state is hosted by the caller's rememberNavigationRailState() (non-null, required); the expand animation is driven by a single State<Float> timeline, and it deliberately does not destructure with `by` — progress is passed to the item as a State<Float> via CompositionLocal and its .value is read only inside Modifier.layout{} and the measure lambda, so spring frames only re-measure and don't recompose. The sole composition-time read is isolated in the label leaf (font size is a composition-time parameter of Text and cannot be sunk)."
  m3: "Corresponds to material3.NavigationRail (and M3 expressive's WideNavigationRail). M3 expresses the narrow/wide forms with two separate components; Miuix uses two identically named overloads: the expanded boolean overload gives static narrow/wide layouts, and the state overload does a continuous morph animation between them; that M3 has a header slot is the same; M3's windowInsets parameter degenerates here into a boolean switch."

NavigationRailItem:
  summary: "An item of the side navigation bar. In a state-overload rail it continuously morphs with the expand progress between \"icon above, text below\" and \"a pill with icon in front, text after\"; in the expanded overload it is fixed to one of these."
  gotchas:
    - text: "The selected state is expressed only by a surfaceContainerHigh squircle behind the icon: tint is unconditionally onSurfaceContainer and fontWeight is unconditionally Medium; neither the icon/text color nor the weight changes with selected. Since 0.9.4 the collapsed (classic) layout also draws this background hugging the icon (14.dp left/right, 4.dp top/bottom); in 0.9.4-rc01 and earlier the classic rail (state == null) had no visual effect for selected at all — only the expandable rail drew the pill. On older versions you must wrap your own background to show selection; after upgrading to 0.9.4 you must delete that homemade background to avoid stacking two layers."
      severity: "medium"
      evidence: "miuix-ui/src/commonMain/kotlin/top/yukonga/miuix/kmp/basic/NavigationRail.kt:383-387"
    - text: "It has no colors parameter (NavigationBarItem does). All colors come from the theme's onSurfaceContainer / surfaceContainerHigh; to change them you can only swap the theme."
      severity: "medium"
      evidence: "miuix-ui/src/commonMain/kotlin/top/yukonga/miuix/kmp/basic/NavigationRail.kt:340-341"
    - text: "The two layout paths attach indication differently: the classic path (the fixed layout with expanded = false) attaches it on selectable (the whole item has a ripple); the morph path (state overload, or expanded = true) sets selectable's indication to null and instead attaches it on the indicator Box (the ripple only follows the icon/pill). So the same LocalIndication has a different visual scope in the two forms."
      severity: "low"
      evidence: "miuix-ui/src/commonMain/kotlin/top/yukonga/miuix/kmp/basic/NavigationRail.kt:477"
    - text: "Since 0.9.4 the padding wrapping the icon on the classic path (expanded = false) (14.dp left/right, 4.dp top/bottom) is unconditional, with only the background looking at selected: so an unselected item is also 8.dp taller than in 0.9.4-rc01, and the icon area grows from 28.dp wide to 56.dp wide. When upgrading from an older version, adjacent content aligned to the old dimensions will be misaligned, and a column of items will overflow its height and start scrolling earlier; the classic item in 0.9.4-rc01 and earlier had no such padding."
      severity: "low"
      evidence: "miuix-ui/src/commonMain/kotlin/top/yukonga/miuix/kmp/basic/NavigationRail.kt:392-395"
  visual:
    icon_size: "28.dp"
    collapsed_label: "12.sp; the icon is wrapped in a layer of padding (14.dp left/right, 4.dp top/bottom, regardless of selection; the classic path also has it since 0.9.4), the icon block is 56×36.dp; IconTextSpacing 4.dp is added between the icon block and the text, so the visual gap from the icon's bottom edge to the text is 8.dp (the morph path's collapsed state is likewise 8.dp); item top/bottom padding 12.dp (icon top edge to item top 16.dp)"
    expanded_label: "16.sp, overlong text uses TextOverflow.Ellipsis (no hard clip)"
    indicator: "a surfaceContainerHigh squircle with 16.dp corner radius; when collapsed it hugs the icon at 14.dp left/right, 4.dp top/bottom (the classic path also draws it since 0.9.4); when expanded it grows into a full pill (14.dp top/bottom)"
  state: "Purely controlled (selected + onClick). Whether it takes the morph path is decided by whether LocalNavigationRailExpandInfo is null: non-null when the rail uses the state overload or expanded = true, null taking the classic Column path when expanded = false; the item itself does not know the rail's state object. All geometry is interpolated by float in the measure lambda and each coordinate is rounded only once (to avoid odd/even rounding jitter between adjacent frames)."
  m3: "Corresponds to material3.NavigationRailItem. M3's item has alwaysShowLabel, an indicator pill, and a full NavigationRailItemColors; Miuix uses a single fixed-color squircle to indicate selection in both forms, the icon/text color does not change with selection, and the colors are not configurable."

rememberNavigationRailState:
  summary: "Creates and remembers the side bar's expanded/collapsed state. Only NavigationRail's state overload accepts it (non-null, required); once passed the rail gets a built-in toggle button and an expand animation."
  gotchas:
    - text: "currentValue is private set and can only be modified via expand() / collapse() / toggle(); it cannot be assigned directly."
      severity: "low"
      evidence: "miuix-ui/src/commonMain/kotlin/top/yukonga/miuix/kmp/basic/NavigationRail.kt:694"
    - text: "\"Auto-expand on wide screens\" must be written yourself: something like `LaunchedEffect(isWide) { if (isWide) state.expand() else state.collapse() }` (when you don't need the button and animation you can also just use `NavigationRail(expanded = isWide)`). Don't use if/else on width to switch between the state overload and the expanded overload — those are two different call sites, and state such as the rail's scroll position will be rebuilt with no animation; likewise, for wide/narrow-screen adaptation keep the navigation host at the same composition position, since placing a route container in each of the two if/else branches will rebuild the current route."
      severity: "medium"
      evidence: "miuix-ui/src/commonMain/kotlin/top/yukonga/miuix/kmp/basic/NavigationRail.kt:731"
  visual: {}
  state: "rememberSaveable + a Saver that stores the enum as its ordinal, surviving configuration changes and process death. The public NavigationRailState.Saver can be dropped into a custom listSaver/mapSaver. The expand animation is derived declaratively by the rail from currentValue, so changing the state makes it animate with no extra call needed."
  m3: "No counterpart. M3's NavigationRail has no state object and switches the wide/narrow form by swapping components; WideNavigationRail's expanded state in M3 is WideNavigationRailState / rememberWideNavigationRailState (expressive, still experimental), which is semantically close but has a different API."

FloatingNavigationBar:
  summary: "A capsule-shaped bottom navigation bar floating above content (50dp corner radius, with a shadow and an optional outline). Put it in the Scaffold's bottomBar or floatingToolbar slot."
  gotchas:
    - text: "The modifier the caller passes is not at the head of the chain — it is inserted via `.then(modifier)` after the library's own squircleBackground and before the horizontal padding (the source explicitly suppresses ktlint's modifier-not-used-at-root rule for this). Consequences: your `.background(...)` will cover the capsule background, your `.padding(...)` becomes inner padding rather than outer margin, and things like `.size()` also act at the wrong layer. To control the outer position, rely on the parent container, not the modifier."
      severity: "high"
      evidence: "miuix-ui/src/commonMain/kotlin/top/yukonga/miuix/kmp/basic/NavigationBar.kt:350"
    - text: "shadowElevation is just a boolean switch: the shadow is added only when `if (shadowElevation > 0.dp)`, and the shadow parameters are hard-coded to radius=10.dp, black, alpha=0.2f. Passing 1.dp and passing 40.dp render exactly the same."
      severity: "medium"
      evidence: "miuix-ui/src/commonMain/kotlin/top/yukonga/miuix/kmp/basic/NavigationBar.kt:336"
    - text: "The bottom spacing is a nameless magic number: iOS is always 36.dp; other platforms look at the bottom inset of `WindowInsets.navigationBars` — when non-zero it uses `26.dp + system inset` (so three-button navigation is about 74dp), and only when the inset is 0 (desktop / Web / landscape side navigation, etc.) does it fall back to 36.dp. Moreover this padding is added unconditionally (NavigationBar.kt:314); defaultWindowInsetsPadding = false only turns off the captionBar segment (NavigationBar.kt:317-322) and cannot turn it off — to change it you can only make a negative offset in the parent container or rewrite this component yourself."
      severity: "medium"
      evidence: "miuix-ui/src/commonMain/kotlin/top/yukonga/miuix/kmp/basic/NavigationBar.kt:289"
  visual:
    corner_radius: "50.dp (defaults to FloatingToolbarDefaults.CornerRadius)"
    min_height: "52.dp"
    horizontal_outside_padding: "36.dp (takes effect only when horizontalAlignment is Start/End)"
    horizontal_padding: "12.dp (inside the bar), item_spacing 12.dp"
    shadow: "fixed radius=10.dp / black / alpha=0.2f, switched by shadowElevation > 0.dp"
    divider: "when showDivider = true it fakes a 1px border with \"an outline-colored squircle background + 0.75.dp padding\" (avoiding the squircle outline calculation)"
  state: "Purely controlled, zero state. content is a plain lambda (not RowScope) and arranges itself into a Row internally."
  m3: "No direct counterpart. The closest is M3 expressive's FloatingToolbar/HorizontalFloatingToolbar, but that M3 set doesn't carry navigation semantics. M3's NavigationBar is bottom-anchored full width, with no floating capsule form."

FloatingNavigationBarItem:
  summary: "An item of the floating navigation bar, drawing only one icon."
  gotchas:
    - text: "The label parameter is never rendered as text — it is only used as the icon's contentDescription. This component is always icon-only (unlike NavigationBarItem's three modes). Assuming that passing label shows text is wrong."

    same_as_vertical: "thumb 3.64.dp / endPadding 3.46.dp / minLength 36.dp / touch band 48.dp"
  state: "Same as VerticalScrollBar, a read-only adapter."
  m3: "No counterpart."

rememberScrollBarAdapter:
  summary: "Normalizes a ScrollState / LazyListState / LazyGridState into the three quantities the scrollbar can read (total content length, current offset, viewport length). Three identically named overloads dispatch by state type."
  gotchas:
    - text: "A lazy list's contentSize is extrapolated as \"average visible-item size × total item count,\" not the real total length. When item heights differ, the thumb length and position jump during scrolling — this is a fundamental compromise of lazy scrollbars and the main source of known issues. Only equal-height lists scroll smoothly."
      severity: "medium"
      evidence: "miuix-ui/src/commonMain/kotlin/top/yukonga/miuix/kmp/basic/ScrollBar.kt:603"
    - text: "The column count of a LazyGrid is inferred from the visible items (counting consecutively increasing columns until they break). A grid containing spanning items (GridItemSpan > 1) miscounts the column count, distorting the thumb ratio."
      severity: "medium"
      evidence: "miuix-ui/src/commonMain/kotlin/top/yukonga/miuix/kmp/basic/ScrollBar.kt:773"
    - text: "Only these three states have overloads. TextFieldScrollState, PagerState, and custom scrollable components have no adapter; you must implement the ScrollBarAdapter interface yourself (four members, one of which, scrollTo, is suspend)."
      severity: "low"
      evidence: "miuix-ui/src/commonMain/kotlin/top/yukonga/miuix/kmp/basic/ScrollBar.kt:62"
  visual: {}
  state: "Stateless; it just remembers a read-only view keyed by the scroll state object. The adapter does not own scrolling; scrollTo forwards to the original state (a distance smaller than one screen uses precise scrollBy, otherwise it estimates the target index via average height and then snapTo)."
  m3: "No counterpart; corresponds to JetBrains Compose Desktop's identically named rememberScrollbarAdapter (mind the casing: Miuix is ScrollBar with two capitals)."

LinearProgressIndicator:
  summary: "A horizontal bar progress indicator. Passing null for progress means the indeterminate state (a looping rounded segment); passing 0f..1f means the determinate state."
  gotchas:
    - text: "The indeterminate state actually has only one segment scrolling, not three. The phase offset in `drawIndeterminateSegment` is written as `segmentIndex * (0.45f + 0.55f)`, and the parenthesized part exactly equals 1.0, while the position is taken modulo 1, so the three loop iterations draw completely identical rectangles. Visually it appears as \"one segment scrolling,\" and this is algebraically certain, not an illusion."
      severity: "medium"
      evidence: "miuix-ui/src/commonMain/kotlin/top/yukonga/miuix/kmp/basic/ProgressIndicator.kt:275"
    - text: "The modifier is followed by `.fillMaxWidth().height(height)` — a width constraint you write in the modifier is overridden by fillMaxWidth, and a height you write is overridden by the height parameter. To control the width, rely on the parent container."
      severity: "medium"
      evidence: "miuix-ui/src/commonMain/kotlin/top/yukonga/miuix/kmp/basic/ProgressIndicator.kt:72"
    - text: "The disabledForegroundColor parameter in progressIndicatorColors() never takes effect: none of the three indicators has an enabled parameter, and internally they all call `colors.foregroundColor(true)`. It is a color token shared over from Slider, and passing it does nothing."
      severity: "low"
      evidence: "miuix-ui/src/commonMain/kotlin/top/yukonga/miuix/kmp/basic/ProgressIndicator.kt:56"
  visual:
    height: "6.dp (DefaultLinearProgressIndicatorHeight)"
    corner_radius: "height / 2 (semicircles at both ends)"
    indeterminate_cycle: "tween(1250ms, LinearEasing) looping infinitely, segment width takes 45%"
  state: "Stateless, purely controlled. progress is coerceIn(0f, 1f). progress == null is the only way to express the indeterminate state (carrying the semantics via null, not two overloads)."
  m3: "Corresponds to material3.LinearProgressIndicator. M3 uses two separate overloads to distinguish determinate/indeterminate (one takes `() -> Float`, one doesn't), while Miuix merges them into one with a nullable Float; M3 has parameters like gapSize/drawStopIndicator/strokeCap, while Miuix only has height and a set of colors."

CircularProgressIndicator:
  summary: "A ring progress indicator. Passing null for progress means the indeterminate state (a rotating arc); passing 0f..1f means the determinate state."
  gotchas:
    - text: "size is a parameter, not decided by the modifier: `modifier.semantics{}.size(size)`, so a size written in the modifier is overridden by the trailing size."
      severity: "medium"
      evidence: "miuix-ui/src/commonMain/kotlin/top/yukonga/miuix/kmp/basic/ProgressIndicator.kt:161"
    - text: "It shares ProgressIndicatorColors with LinearProgressIndicator, so disabledForegroundColor likewise never takes effect (no enabled parameter)."
      severity: "low"

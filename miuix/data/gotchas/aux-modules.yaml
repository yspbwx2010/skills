isRuntimeShaderSupported:
  summary: "The single gating check for the whole shader capability set (blur, color blending, squircle fill). Android requires API 33, all other platforms are always true."
  gotchas:
    - text: "On Android it is API 33 (TIRAMISU), not 31. It carries @ChecksSdkIntAtLeast, so accessing API 33 symbols inside an if (isRuntimeShaderSupported()) { ... } block does not trigger the NewApi lint -- but this benefit only exists when importing directly from top.yukonga.miuix.kmp.shader; the same-named back-compat forwarder under the miuix-blur package is a plain common function that has lost this annotation."
      severity: medium
      evidence: miuix-shader/src/androidMain/kotlin/top/yukonga/miuix/kmp/shader/RuntimeShader.android.kt:18
    - text: "Non-Android platforms return true unconditionally, with no real detection. On Web (js/wasmJs), once WebGL is unavailable or the driver is blacklisted, SkSL compilation failure throws an exception directly rather than falling back -- this side has no failure exit at all (makeForShader has no try/catch and the cache does not cache failures)."
      severity: medium
      evidence: miuix-shader/src/skikoMain/kotlin/top/yukonga/miuix/kmp/shader/RuntimeShader.skiko.kt:18
    - text: "The miuix-blur module's minSdk is hardcoded to 33 (not via BuildConfig.MIN_SDK), so an app with minSdk<33 depending on miuix-blur fails manifest merging and needs tools:overrideLibrary. miuix-squircle / miuix-shader have minSdk 24, and 33 is only a runtime gate for them."

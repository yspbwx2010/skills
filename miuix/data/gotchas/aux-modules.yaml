  state: "Stateless; only writes scope.noiseCoefficient."
  m3: "No equivalent."

rememberDeviceTilt:
  summary: "Reads the device rotation sensor to feed parallax effects like rememberTiltLight. Only Android has real data."
  gotchas:
    - text: "On Desktop / iOS / macOS / Web it always returns DeviceTilt.Zero -- the skiko-side actual is just remember { mutableStateOf(DeviceTilt.Zero) }, one line. The supposed iOS implementation does not exist; it goes through exactly the same skikoMain as Desktop. Any tilt-dependent visual is static on these platforms, with no error."

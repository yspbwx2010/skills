Modifier.progressiveTextureBlur:
  summary: "Gradient blur: the radius transitions continuously from full to zero along the direction ProgressiveBlur specifies, and the clear end is genuinely full-resolution sharp. Use it for fading frosted-glass top/bottom bars."
  gotchas:
    - text: "It passes the gradient to both the progressiveTextureBlurEffect in the effects block and drawBackdrop's progressiveGradient -- neither can be omitted. When hand-rolling with drawBackdrop and you miss either side: passing only progressiveGradient makes the gradient silently ignored and draws a uniform blur; calling only progressiveBlur makes the clear end sample the downsampled layer, so it is soft rather than pixel-sharp."
      severity: high
      evidence: miuix-blur/src/commonMain/kotlin/top/yukonga/miuix/kmp/blur/TextureEffect.kt:249
    - text: "noiseCoefficient defaults to ProgressiveNoiseCoefficient = 0f (noise off), unlike textureBlur's 0.0045f. When switching over from textureBlur, if you rely on noise to de-band, pass it explicitly."
      severity: medium
      evidence: miuix-blur/src/commonMain/kotlin/top/yukonga/miuix/kmp/blur/TextureEffect.kt:240
    - text: "The ProgressiveBlur.Top/Bottom/Left/Right preset names refer to the end where blur is strongest (Top = top edge blurriest, clearing downward), not the gradient direction. The semantics of angle: 0 degrees fades out left→right, 90 degrees fades out top→bottom."
      severity: low
      evidence: miuix-blur/src/commonMain/kotlin/top/yukonga/miuix/kmp/blur/ProgressiveBlur.kt:31
    - text: "The clear end's color-grading behavior changes abruptly with radius. The intermediate sigma = max(rX,rY)×0.45×0.4, and when it falls below BOUNDARY_SIGMA[0]=3.5496 exp==0, in which case the whole stack runs at full resolution and the clear end binds directly to the source that has already gone through the pre chain (i.e. colorControls), with the sharp-end overlay skipped; a bit larger and exp>0, so the clear end is instead handled by drawSharpOverlay recording the raw backdrop and only applying the overlay effect, with the pre chain not participating. That works out to a threshold of about 19.7px (about 6.6dp at density 3) -- animating the radius from 6.5dp to 7dp makes the clear end's brightness/contrast/saturation suddenly disappear."

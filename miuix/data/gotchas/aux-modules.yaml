      evidence: miuix-blur/build.gradle.kts:31
  visual: {}
  state: "Pure function, stateless."
  m3: "No equivalent. M3 has no equivalent capability detection; the official Modifier.blur is silently ineffective on unsupported platforms."

isRenderEffectSupported:
  summary: "RenderEffect capability detection (Android API 31). A published public API, but with zero call sites in the library."

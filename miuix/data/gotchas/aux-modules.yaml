# Auxiliary modules: squircle / blur / shader / nav / core / icons

squircleBackground:
  summary: "A smooth rounded-corner background that only fills, never clips. To also clip child content at the corners you must use squircleSurface or squircleClip; with this modifier the area outside the corners still paints child content."
  gotchas:
    - text: "Using it as a clip. The first sentence of the KDoc states fill-only, descendants are NOT clipped -- child content (images, ripples, child backgrounds) still paints outside the corners, making it look like the rounding did not take effect. To clip child content too, use squircleSurface (fill + clip) or squircleClip (clip only)."
      severity: high
      evidence: miuix-squircle/src/commonMain/kotlin/top/yukonga/miuix/kmp/squircle/SquircleBackground.kt:40
    - text: "Assuming topStart/topEnd flip under RTL. The KDoc for all four parameters says flipped by LocalLayoutDirection, but the entire miuix-squircle module never reads LocalLayoutDirection (grep only hits the KDoc string). The shader path maps by fixed physical position (index 0 is always top-left), while the API<33 fallback path uses a real RoundedCornerShape, which does flip -- so the same component looks different under RTL before and after Android 33. For deterministic behavior, use absoluteSquircleBackground directly."
      severity: high
      evidence: miuix-squircle/src/commonMain/kotlin/top/yukonga/miuix/kmp/squircle/SquircleBackground.kt:61
    - text: "Assuming extension=1.0 gives a standard circular arc. The KDoc says 1.0 matches a circular arc, but extension only enlarges the corner tile size and never changes the control-handle ratio of that cubic Bézier, SQUIRCLE_CONTROL=0.643 (a circular arc needs 0.5523). At e=1.0 the 45° direction is still about 11.6% shallower than a circular arc, and the endpoint curvature is 0.576/r instead of 1/r."
      severity: medium
      evidence: miuix-squircle/src/commonMain/kotlin/top/yukonga/miuix/kmp/squircle/SquircleBackground.kt:47
    - text: "Assuming a larger extension gets closer to a superellipse. The direction is exactly the opposite: the circle-blend threshold is cornerSize > (π/4)·halfMin, and cornerSize = r×extension, so a larger extension blends toward a pure circle sooner. The default Button (r=16dp, height 40dp) at e=1.1 has blendWeight≈0.44 -- 44% is already pure circle; pushing e to 2.0 saturates the weight straight to 1.0 and the squircle component drops to zero."
      severity: medium
      evidence: miuix-squircle/src/commonMain/kotlin/top/yukonga/miuix/kmp/squircle/SquircleBackground.kt:406
    - text: "Using it on every item in a long list. The SquircleShaderBrush constructor calls RuntimeShader(SQUIRCLE_SHADER), and on Android that constructor compiles AGSL on the spot, with no process-level cache at this layer (Skiko has a RuntimeEffect cache, Android does not). The brush is remember(color, tiles) per call site, so 50 Cards = 50 AGSL compilations; a theme-color change rebuilds them all."
      severity: low
      evidence: miuix-squircle/src/commonMain/kotlin/top/yukonga/miuix/kmp/squircle/SquircleBackground.kt:392
  visual:
    extension: "Default 1.1 (SquircleDefaults.Extension), clamped to 1.0..2.0"
    control: "SQUIRCLE_CONTROL = 0.643f, manually kept in lockstep with the build-time baked SDF's control.set(0.643f), with no test guarding it"
    blend_threshold: "BLEND_THRESHOLD_RATIO = 0.7853982f (π/4); once cornerSize/halfMin exceeds it, blending toward a pure circle begins, reaching a pure circle at 1.0"
  state: "Stateless. A @Composable modifier; internally rememberSquircleBrush memoizes on (color, four-corner Dp, extension, density); when unsupported it returns null and falls back to Modifier.background(color, RoundedCornerShape(cornerRadius)). Note the fallback uses r without multiplying by extension, so its corners are 10% smaller than the main path, and toggling LocalSquircleEnabled makes the corners visibly jump."
  m3: "Corresponds to Modifier.background(color, RoundedCornerShape(r)). Difference: M3 goes through Shape/Outline and can be passed to any API that takes a Shape; miuix-squircle exports no Shape implementation, only a Modifier, so it cannot be fed to parameters like Surface(shape=) or drawBackdrop(shape=)."

squircleClip:
  summary: "Masks child content to a smooth rounded-corner outline. Note it is an alpha mask (BlendMode.DstIn), not a true outline clip."
  gotchas:
    - text: "Using it as Modifier.clip(shape). The implementation draws the content and then uses BlendMode.DstIn to multiply the corner alpha to 0, not a stencil/outline clip. The pixels outside the corners were actually drawn, just with alpha=0, and any subsequent non-SrcOver blend can still bring them back; when child content carries its own graphicsLayer(alpha=) or a non-SrcOver blendMode, the result differs from a true clip."
      severity: medium
      evidence: miuix-squircle/src/commonMain/kotlin/top/yukonga/miuix/kmp/squircle/SquircleBackground.kt:333
    - text: "When either side of the node exceeds 2048px it switches to a band path: the content is first recorded into a GraphicsLayer, then replayed with saveLayer in the top and bottom corner bands, while the straight-edge region in between opens no offscreen layer. The dst of DstIn differs between the two paths (a whole-node offscreen layer vs a band-height temporary layer), so results diverge when child content uses a non-SrcOver blend. Also the banding only cuts along the Y axis, so for a 4000×100 ultra-wide node each band's saveLayer width is still 4000px."
      severity: low
      evidence: miuix-squircle/src/commonMain/kotlin/top/yukonga/miuix/kmp/squircle/SquircleBackground.kt:261
    - text: "RTL parameters do not flip, same as squircleBackground (the KDoc says they flip, the code does not, and the fallback path does flip instead)."
      severity: high
      evidence: miuix-squircle/src/commonMain/kotlin/top/yukonga/miuix/kmp/squircle/SquircleBackground.kt:104
    - text: "Every node wastefully takes a GraphicsLayer. drawWithCache calls obtainGraphicsLayer() unconditionally, but it is only used on the >2048px band path. Button/Card/IconButton all go through the squircleSurface chain, so a single screen has dozens of unrecorded layers."
      severity: low
      evidence: miuix-squircle/src/commonMain/kotlin/top/yukonga/miuix/kmp/squircle/SquircleBackground.kt:269
  visual:
    max_offscreen: "MAX_OFFSCREEN_PX = 2048f -- when the node's max(w,h) does not exceed it, the single-offscreen-layer fast path is used; above it, the band path"
  state: "Stateless. The fallback path is Modifier.clip(RoundedCornerShape(...)), which is a true outline clip and differs semantically from the main path (see above)."
  m3: "Corresponds to Modifier.clip(RoundedCornerShape(r)). Difference: M3 is an outline clip, this modifier is an alpha mask."

squircleSurface:
  summary: "The combination of squircleBackground + squircleClip: in a single offscreen layer it both fills the base color and masks the corners. Miuix's Button/Card/IconButton go through it."
  gotchas:
    - text: "Inherits all of squircleClip's pitfalls (alpha mask rather than outline clip, 2048px banding, RTL does not flip, wasted GraphicsLayer). The fallback path is clip(RoundedCornerShape(...)).background(color), using the radius without multiplying by extension."
      severity: medium
      evidence: miuix-squircle/src/commonMain/kotlin/top/yukonga/miuix/kmp/squircle/SquircleBackground.kt:162
    - text: "When you want to background-blur a squircle region, squircleSurface and drawBackdrop cannot connect: miuix-squircle exports no Shape, and drawBackdrop's shape parameter only accepts a Shape. You can only wrap another squircleClip around drawBackdrop -- and then drawBackdrop's internal clipping and edge highlight still follow the RoundedCornerShape outline, which does not line up with the outer squircle."
      severity: medium
      evidence: miuix-squircle/src/commonMain/kotlin/top/yukonga/miuix/kmp/squircle/SquircleBackground.kt:152
  visual: {}
  state: "Stateless."
  m3: "Corresponds to Modifier.clip(shape).background(color), or M3's Surface(shape=, color=)."

squircleBorder:
  summary: "A smooth rounded-corner border. A pure Path implementation that needs no shader, but is still gated by the shader capability to keep its fallback consistent with the fill APIs."
  gotchas:
    - text: "The border and a same-radius squircleSurface do not coincide at common sizes. The fill goes through the shader with circle blending (the default Button at r=16dp/height 40dp is 44% pure circle), while the border goes through addSquircleRect with no blending logic at all, so the two outlines differ by about 0.021×tile in the 45° direction (a visible offset on a 1dp thin border)."
      severity: medium
      evidence: miuix-squircle/src/commonMain/kotlin/top/yukonga/miuix/kmp/squircle/SquircleBorder.kt:49
    - text: "The two overloads have different fallback paths. The first (width: Dp, color: Color), when isSquircleEnabled()==false, swaps entirely to Modifier.border(width, color, RoundedCornerShape(cornerRadius)); the second (the lambda version) does not swap the modifier but passes squircleEnabled into addSquircleRect to draw a rounded-rectangle border path. The same parameters give visually inconsistent fallbacks across the two overloads."
      severity: low
      evidence: miuix-squircle/src/commonMain/kotlin/top/yukonga/miuix/kmp/squircle/SquircleBorder.kt:36
    - text: "cornerRadius is the radius of the border's outer edge, not its centerline: internally it draws with cornerRadiusPx - halfStroke and translates the whole thing by translate(halfStroke). To align the border's outer edge with a fill of radius r, pass r directly, do not subtract yourself."
      severity: low
      evidence: miuix-squircle/src/commonMain/kotlin/top/yukonga/miuix/kmp/squircle/SquircleBorder.kt:48
  visual: {}
  state: "Stateless. The lambda overload (width: () -> Dp, color: () -> Color) reads its values only inside onDrawBehind, so driving the border with animateDpAsState/animateColorAsState does not trigger recomposition -- prefer it for animated scenarios."
  m3: "Corresponds to Modifier.border(width, color, RoundedCornerShape(r))."

absoluteSquircleBackground:
  summary: "absoluteSquircleBackground / absoluteSquircleClip / absoluteSquircleSurface -- parameters are named by physical corner (topLeft/topRight/bottomRight/bottomLeft) and explicitly do not flip with LayoutDirection."
  gotchas:
    - text: "On the shader path, the absolute variant and the relative variant produce identical output (the relative variant does not flip to begin with). The only real difference is in the API<33 fallback branch: absolute uses AbsoluteRoundedCornerShape, relative uses RoundedCornerShape (which flips). In other words, the value of the absolute variant is that its fallback path also does not flip, not that it does anything more than the relative variant."
      severity: medium
      evidence: miuix-squircle/src/commonMain/kotlin/top/yukonga/miuix/kmp/squircle/SquircleBackground.kt:193
    - text: "The parameter order is clockwise from top-left: topLeft, topRight, bottomRight, bottomLeft. It maps one-to-one with the relative variant's topStart, topEnd, bottomEnd, bottomStart positions, so under LTR you can just swap names without changing order."
      severity: low
      evidence: miuix-squircle/src/commonMain/kotlin/top/yukonga/miuix/kmp/squircle/SquircleBackground.kt:169
  visual: {}
  state: "Stateless, identical to the corresponding relative variant."
  m3: "Corresponds to AbsoluteRoundedCornerShape with background/clip."


isSquircleEnabled:
  summary: "A @Composable @ReadOnlyComposable switch query: LocalSquircleEnabled.current && isRuntimeShaderSupported(). Only useful when you need to pass this boolean to the non-Composable Path.addSquircleRect."
  gotchas:
    - text: "It does not just read the user switch, it also ANDs in the platform capability. On Android<33 it is always false, even when LocalSquircleEnabled is true. To check user intent alone, read LocalSquircleEnabled.current directly."
      severity: medium
      evidence: miuix-squircle/src/commonMain/kotlin/top/yukonga/miuix/kmp/squircle/LocalSquircleEnabled.kt:27
    - text: "LocalSquircleEnabled is a staticCompositionLocalOf, not a compositionLocalOf -- when its value changes, the entire subtree that reads it recomposes, with no fine-grained invalidation. That is correct for a global switch, but do not use it as per-frame changing state."
      severity: low
      evidence: miuix-squircle/src/commonMain/kotlin/top/yukonga/miuix/kmp/squircle/LocalSquircleEnabled.kt:18
  visual: {}
  state: "Read-only, stateless. Default value true."
  m3: "No equivalent."

Path.addSquircleRect:
  summary: "Appends a squircle outline to a Path. The only public API in the module that needs no shader, intended for per-frame path scenarios such as clipPath reveal animations."
  gotchas:
    - text: "All size parameters are pixels, not Dp (width/height/cornerRadius: Float). Passing the value 16f from 16.dp directly gives you a 16px corner. Inside DrawScope/CacheDrawScope use cornerRadius.toPx()."
      severity: high
      evidence: miuix-squircle/src/commonMain/kotlin/top/yukonga/miuix/kmp/squircle/SquirclePath.kt:49
    - text: "squircleEnabled defaults to true and does not read the CompositionLocal. It is a plain extension function and cannot read LocalSquircleEnabled, so when the user turns off the global switch or runs on Android<33, this path still draws a squircle while the surrounding modifiers have already fallen back to rounded corners -- you must call isSquircleEnabled() in the composable and pass it in explicitly."
      severity: high
      evidence: miuix-squircle/src/commonMain/kotlin/top/yukonga/miuix/kmp/squircle/SquirclePath.kt:54
    - text: "The squircleEnabled=false fallback branch uses cornerRadius without multiplying by extension, while the squircle branch uses cornerRadius×extension. Toggling the switch makes every corner's visual size jump by 10%."
      severity: low
      evidence: miuix-squircle/src/commonMain/kotlin/top/yukonga/miuix/kmp/squircle/SquirclePath.kt:58
    - text: "The outline it draws has none of the shader path's circle blending, so at capsule/pill sizes where r approaches halfMin it does not line up with an adjacent squircleSurface/squircleClip (ListPopup's clipPath reveal hits exactly this)."
      severity: medium
      evidence: miuix-squircle/src/commonMain/kotlin/top/yukonga/miuix/kmp/squircle/SquirclePath.kt:30
    - text: "The path is clockwise, starts at (tile, 0) and close()s, with the coordinate origin fixed at (0,0). To draw elsewhere you must translate yourself; the function accepts no offset. When width/height<=0 it silently appends nothing."
      severity: low
      evidence: miuix-squircle/src/commonMain/kotlin/top/yukonga/miuix/kmp/squircle/SquirclePath.kt:56
  visual:
    tile: "tile = cornerRadius × extension, then clamped to min(w,h)/2; when tile<=0 it degrades to a plain rectangle"
    handle: "handle = tile × (1 - 0.643) = 0.357 × tile"
  state: "Stateless, pure Path construction."
  m3: "Corresponds to Path.addRoundRect(RoundRect(...))."

Modifier.drawBackdrop:
  summary: "The middle layer of the blur system: a fully controllable background-drawing node where you write the effects block to decide the pipeline. Preset modifiers like textureBlur are thin wrappers over it."
  gotchas:
    - text: "The whole node is ANDed with isRuntimeShaderSupported(). The enabled parameter is &&'d with it, so on Android<33 whatever enabled you pass it degrades to a pure pass-through (no layer built, draw calls drawContent directly). So you need not add your own platform check, but do not expect any effect on API<33 either."
      severity: medium
      evidence: miuix-blur/src/commonMain/kotlin/top/yukonga/miuix/kmp/blur/DrawBackdropModifier.kt:118
    - text: "Passing progressiveGradient alone is ineffective. The KDoc clearly states it requires a matching progressiveBlur in effects -- when there is no progressiveBlur in the effects block the gradient is silently ignored and effects draws a uniform blur, with no error. Either pass the same gradient on both sides, or just use Modifier.progressiveTextureBlur."
      severity: high
      evidence: miuix-blur/src/commonMain/kotlin/top/yukonga/miuix/kmp/blur/DrawBackdropModifier.kt:97
    - text: "contentBlendMode is a non-null BlendMode, defaulting to SrcOver (not a nullable null). The sentinel value is SrcOver: drawBackdrop internally checks if (contentBlendMode == BlendMode.SrcOver) to take the plain drawContent(). The docs docs/guide/blur.md:417 write it as BlendMode? / default null; passing null fails to compile."
      severity: high
      evidence: miuix-blur/src/commonMain/kotlin/top/yukonga/miuix/kmp/blur/DrawBackdropModifier.kt:113
    - text: "layerBlock is used twice: once as a real Modifier.graphicsLayer applied to this component, and once passed into the node to inverse-transform the backdrop sampling (it only inverts rotationZ/scaleX/scaleY, not translation or rotationX/Y). So do not wrap another graphicsLayer around it doing the same scaling, or it scales twice; 3D rotation also cannot be inverted."
      severity: medium
      evidence: miuix-blur/src/commonMain/kotlin/top/yukonga/miuix/kmp/blur/DrawBackdropModifier.kt:121
    - text: "onDrawBackdrop is called twice, in two different coordinate spaces: once on the downsampled recording surface (downscaleFactor of 1 or 2), and once on the progressive blur's full-resolution sharp-end overlay (always 1). The hook cannot get downscaleFactor and can only infer it from DrawScope.size, and the downsampled path additionally wraps a translate(scaledPadding) around it. The library's docs/ and example/ have zero usage samples for it."
      severity: medium
      evidence: miuix-blur/src/commonMain/kotlin/top/yukonga/miuix/kmp/blur/DrawBackdropModifier.kt:110
    - text: "highlight is silently skipped on unsupported platforms rather than degrading to a flat-color stroke. HighlightStyle.color's KDoc promises Tint applied when no createShader is available, and createShader's KDoc says Return null to fall back to a flat color stroke, but drawHighlight, after getting null, does ?: return and draws nothing."
      severity: medium
      evidence: miuix-blur/src/commonMain/kotlin/top/yukonga/miuix/kmp/blur/highlight/HighlightDrawing.kt:36
    - text: "The draw order is fixed: onDrawBehind → blurred background (+ sharp-end overlay) → onDrawSurface → drawContent (per contentBlendMode) → highlight → onDrawFront. The drawBackdrop section of docs/guide/blur.md only covers the four parameters backdrop/shape/effects/highlight, omitting the other 8 and the draw order."
      severity: low
      evidence: miuix-blur/src/commonMain/kotlin/top/yukonga/miuix/kmp/blur/DrawBackdropModifier.kt:86
  visual: {}
  state: "Stateless host. shape is () -> Shape (re-read every frame, the shape can animate), highlight is (BackdropEffectScope.() -> Highlight?)? (evaluated in the scope, can read size/shape/density and can animate with press progress) -- note that on the third-layer preset modifiers these two are simplified to a plain Shape / Highlight?."
  m3: "No equivalent. Compose's official Modifier.blur blurs its own content and does not sample the background; third-party libraries like HazeMaterials are the real counterpart."

Modifier.layerBackdrop:
  summary: "Records the content this composable draws into a LayerBackdrop's GraphicsLayer for drawBackdrop to sample. The capture side, which must be paired with rememberLayerBackdrop."
  gotchas:
    - text: "Draw order is part of correctness, yet the API surface gives no hint. It records only in its own draw phase, and the consumer side just takes the already-recorded layer. The subtree with layerBackdrop must be drawn before the blurred component within the same frame (typical structure: a Scaffold's content before its topBar); a reversed order neither errors nor flashes black, it just samples the previous frame's content -- visible only during scrolling/animation."
      severity: high
      evidence: miuix-blur/src/commonMain/kotlin/top/yukonga/miuix/kmp/blur/LayerBackdropModifier.kt:58
    - text: "The content is drawn twice: once with drawContent() straight to screen, and once recorded into a GraphicsLayer. This is a fixed per-frame cost, and this modifier has no enabled parameter -- once attached you keep paying. When blur is not needed (user disabled it, platform unsupported) you should branch with an if outside, so that when rememberBlurBackdrop returns null you do not attach it at all."
      severity: medium
      evidence: miuix-blur/src/commonMain/kotlin/top/yukonga/miuix/kmp/blur/LayerBackdropModifier.kt:59
    - text: "If you forget to attach it, or after the node detaches, the drawBackdrop side silently draws nothing: the first thing LayerBackdrop.drawBackdrop does is layerCoordinates ?: return. The symptom is a blank blur region, with no log or exception."
      severity: high
      evidence: miuix-blur/src/commonMain/kotlin/top/yukonga/miuix/kmp/blur/LayerBackdrop.kt:81
  visual: {}
  state: "No self-held state; it writes the LayoutCoordinates into the passed-in LayerBackdrop and sets it to null on onDetach. Attaching the same LayerBackdrop in two places at once makes them overwrite each other's coordinates."
  m3: "No equivalent."

rememberLayerBackdrop:
  summary: "Creates and remembers a LayerBackdrop (a GraphicsLayer snapshot-style background source). The only implementation of the library's Backdrop interface."
  gotchas:
    - text: "The default onDraw is just { drawContent() } -- in the recorded layer, wherever the subtree did not draw is transparent. Blur spreads color into the transparent region, producing a visible halo at the edges. The standard practice is to pass onDraw = { drawRect(surfaceColor); drawContent() } to lay down an opaque base color first."
      severity: high
      evidence: miuix-blur/src/commonMain/kotlin/top/yukonga/miuix/kmp/blur/LayerBackdrop.kt:26
    - text: "remember keys only on graphicsLayer, and onDraw goes through rememberUpdatedState. So creating a new onDraw lambda each frame does not rebuild the backdrop (this is intentional), but it also means changing onDraw does not trigger a redraw -- rely on the State it reads internally to invalidate itself."
      severity: low
      evidence: miuix-blur/src/commonMain/kotlin/top/yukonga/miuix/kmp/blur/LayerBackdrop.kt:46
    - text: "It has no enabled/fallback of its own. When blur is unsupported you should return null at the call site (if (!isRuntimeShaderSupported()) return null) and branch layerBackdrop out with null, otherwise you pay the capture layer's double-draw cost for nothing."
      severity: medium
      evidence: miuix-blur/src/commonMain/kotlin/top/yukonga/miuix/kmp/blur/LayerBackdrop.kt:41
  visual: {}
  state: "An @Stable class that internally holds layerCoordinates (mutableStateOf) and offsetResidualX/Y. isCoordinatesDependent is hardcoded to true -- no implementation in the library takes the interface's false branch, and a custom Backdrop that wrongly declares false gets null coordinates and then silently draws nothing."
  m3: "No equivalent."

Modifier.textureBlur:
  summary: "A one-line HyperOS frosted-glass preset: the fixed recipe noiseDither → colorControls → blur → blendColors. It is enough for the vast majority of cases."
  gotchas:
    - text: "blurRadius is in dp (internally multiplied by density to pixels), whereas the lower-level BackdropEffectScope.blur is in pixels. Mixing the two makes the radius off by a factor of density (3x on a 3x screen)."
      severity: high
      evidence: miuix-blur/src/commonMain/kotlin/top/yukonga/miuix/kmp/blur/TextureEffect.kt:54
    - text: "contentBlendMode is a non-null ComposeBlendMode, defaulting to SrcOver. The KDoc of all six overloads says Optional ... null means content draws normally on top (TextureEffect.kt:24/26, 61/63, 99/101, 138/140, 192, 231), and the docs docs/guide/blur.md:417 copied it as BlendMode? / null -- passing null fails to compile. For a foreground blur (content alpha as mask) pass ComposeBlendMode.DstIn."
      severity: high
      evidence: miuix-blur/src/commonMain/kotlin/top/yukonga/miuix/kmp/blur/TextureEffect.kt:26
    - text: "The radius is silently clamped to [0, BlurDefaults.MaxBlurRadius] (150dp). Passing a larger value does not error, it just does not get blurrier."
      severity: low
      evidence: miuix-blur/src/commonMain/kotlin/top/yukonga/miuix/kmp/blur/BackdropEffects.kt:395
    - text: "BlurColors is marked @Immutable but contains a List<BlendColorEntry>, and Compose treats List as unstable -- constructing BlurColors(...) directly invalidates the caller on every recomposition. The KDoc itself states you should use the remembered BlurDefaults.blurColors factory."
      severity: medium
      evidence: miuix-blur/src/commonMain/kotlin/top/yukonga/miuix/kmp/blur/BlurDefaults.kt:15
  visual:
    blur_radius: "BlurDefaults.BlurRadius = 20f (dp)"
    noise: "BlurDefaults.NoiseCoefficient = 0.0045f; the progressive version defaults to ProgressiveNoiseCoefficient = 0f"
    max_radius: "BlurDefaults.MaxBlurRadius = 150f (dp)"
  state: "Stateless. At this layer shape is a plain Shape (not () -> Shape) and highlight is a plain Highlight? (not a scope lambda) -- if you need shape/highlight to animate you must drop down to drawBackdrop."
  m3: "No equivalent."

Modifier.textureEffect:
  summary: "The per-axis radius version of textureBlur (blurRadiusX/blurRadiusY independent); all four textureBlur/textureEffect overloads ultimately land on it."

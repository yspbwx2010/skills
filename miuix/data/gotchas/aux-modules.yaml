    - text: "In composite mode (drawBackdrop was passed a progressiveGradient) this call only registers the target radius and downsampling and does not actually chain a RenderEffect -- and a blendColors immediately after it is also folded into the stack's ramp pass rather than the normal chain. Inserting a custom effect between them behaves counterintuitively."
      severity: medium

BackdropEffectScope.noiseDither:
  summary: "Anti-banding noise dithering. It builds no RenderEffect and only writes noiseCoefficient to the scope; the actual application is decided by the draw path."
  gotchas:
    - text: "When coefficient <= 0 the whole call is ignored (it does not even write the field). To turn off noise on a chain, passing 0 is enough, no conditional branch needed."
      severity: low
      evidence: miuix-blur/src/commonMain/kotlin/top/yukonga/miuix/kmp/blur/BackdropEffects.kt:246
    - text: "0.005 is a semantic boundary (NOISE_GRAIN_THRESHOLD): below it, noise is treated as pure anti-banding and folding it into the downsampled stack (capped at 0.009) is enough, skipping the full-resolution round trip; above it, it is treated as deliberate visible grain and runs a full-resolution noise pass. The default 0.0045f falls just below the threshold -- raising it to 0.006 adds an entire full-resolution draw."
      severity: medium
      evidence: miuix-blur/src/commonMain/kotlin/top/yukonga/miuix/kmp/blur/DrawBackdropModifier.kt:72

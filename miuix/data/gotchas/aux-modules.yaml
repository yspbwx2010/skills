    gradient_default: "ProgressiveBlur.Top (angle=90, startFraction=0, endFraction=1, curve=1)"
  state: "Stateless. gradient is an @Immutable data class, and you can animate its startFraction/endFraction/curve directly."
  m3: "No equivalent."

BackdropEffectScope.blur:
  summary: "A separable Gaussian blur in the effects DSL. Besides chaining a RenderEffect, it also sets downscaleFactor and padding -- the latter two affect other effects in the chain."
  gotchas:
    - text: "The parameter names are radiusX / radiusY (radiusY defaults to radiusX), there is no radius and no edgeTreatment. The docs docs/guide/blur.md:363 write blur(radius = 60f), and the extension table at :381 writes blur(radius, edgeTreatment) -- both parameter names have zero hits across the repo, and edgeTreatment was mistakenly copied from Compose's official Modifier.blur. The Chinese mirror docs/zh_CN/guide/blur.md:358/376 has the same error."
      severity: high
      evidence: miuix-blur/src/commonMain/kotlin/top/yukonga/miuix/kmp/blur/BackdropEffects.kt:46
    - text: "The radius is in pixels, not dp. BackdropEffectScope extends Density, and the KDoc's example is exactly blur(20f * density). Writing blur(20f) directly gives only 6.7dp of blur on a 3x screen -- three times off from Modifier.textureBlur(blurRadius = 20f), which is in dp."
      severity: high
      evidence: miuix-blur/src/commonMain/kotlin/top/yukonga/miuix/kmp/blur/BackdropEffects.kt:43
    - text: "It raises downscaleFactor. A runtimeShaderEffect chained after it receives coords in the downsampled layer's pixel space, so all pixel-unit uniforms (size, padding, corner radius, refraction bandwidth...) must be divided by downscaleFactor yourself, otherwise the geometry runs outside the layer and every sample hits transparent black. This is the biggest cognitive-load leak in this API."
      severity: high
      evidence: miuix-blur/src/commonMain/kotlin/top/yukonga/miuix/kmp/blur/BackdropEffectScope.kt:109
    - text: "Order has performance implications: raising padding after blur is safe but re-runs the entire effects block once; setting padding before blur saves that rebuild."
      severity: low
      evidence: miuix-blur/src/commonMain/kotlin/top/yukonga/miuix/kmp/blur/BackdropEffects.kt:33
    - text: "blur(0f) is not zero-cost: when the radius is 0, createBlurEffect returns null and exits early (the `?: return` at :104 in the same file), but padding was already set to 13 beforehand, so the recording surface still gains 13px on each side. During a 0→20 radius animation the first frame wastefully records an extra ring."
      severity: low
      evidence: miuix-blur/src/commonMain/kotlin/top/yukonga/miuix/kmp/blur/BackdropEffects.kt:67
  visual: {}
  state: "Stateless; it writes the scope's three fields renderEffect / padding / downscaleFactor. On Android<33 it simply returns, with no error."
  m3: "No equivalent."

BackdropEffectScope.progressiveBlur:
  summary: "A variable-radius progressive blur. It works alone, but the clear end is only a soft transition of the downsampled layer; only with drawBackdrop(progressiveGradient=) do you get a genuinely pixel-sharp end."
  gotchas:
    - text: "The radius is likewise in pixels (radiusX/radiusY), and gradient defaults to ProgressiveBlur.Top. As with blur, you must multiply by density yourself."

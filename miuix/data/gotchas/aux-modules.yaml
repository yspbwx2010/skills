    - text: "smoothing is the key of the DisposableEffect -- animating it with something like animateFloatAsState repeatedly unregisters/re-registers the sensor and clears the smoothing state (initialized=false), reconverging from scratch each time. To adjust smoothing dynamically, interpolate the State value yourself outside."
      severity: medium

    - text: "Each call site registers its own SensorEventListener, with no sharing. N tilt-using components on a page means N SENSOR_DELAY_GAME listeners. To reuse, call it once higher up and pass the State down."
      severity: medium
      evidence: miuix-blur/src/androidMain/kotlin/top/yukonga/miuix/kmp/blur/sensor/DeviceTilt.android.kt:77

NavDisplay:
  summary: "The navigation render host: it drives the entire back-stack's transitions by a continuous depth float. Three overloads -- one taking a NavBackStack, one taking a NavController, and an internal entryProvider version."
  gotchas:
    - text: "Route matching is by the key's exact runtime KClass, and a supertype/interface registration does not cover subtypes (KClass in common code has no portable supertype traversal). Registering one entry<Route> for a sealed interface Route does not work; you must register each concrete subtype once; missing one crashes at composition with error(No entry { } registered for ...)."
      severity: high
      evidence: miuix-nav/src/commonMain/kotlin/top/yukonga/miuix/kmp/nav/core/NavDisplay.kt:172
    - text: "contentKey must be unique across the entire back stack. Pushing the same route value twice (e.g. tapping Detail(id=1) twice) fails a require during reconcile and throws IllegalArgumentException, not silent deduplication. To allow duplicate instances, pass entry(contentKey = { route -> ... }) to generate a per-instance key."
      severity: high
      evidence: miuix-nav/src/commonMain/kotlin/top/yukonga/miuix/kmp/nav/core/NavDisplay.kt:381
    - text: "saveable state is namespaced by contentKey.toString(), which brings two extra constraints: (1) two keys that are unequal but have the same toString() are rejected (a data class's toString does not include the package name, so same-named route classes in different packages collide); (2) a key that keeps the default identity toString (pkg.Cls@1a2b3c) passes all runtime checks but resolves to a new string after process death, silently resetting that entry's rememberSaveable state. Use a data class / data object, or a contentKey derived from the value."
      severity: high
      evidence: miuix-nav/src/commonMain/kotlin/top/yukonga/miuix/kmp/nav/core/NavDisplay.kt:117
    - text: "An entry that was just popped but is still running its exit animation still occupies its saveable slot -- pushing a new entry that would collide with the same saveable key during this window likewise fails the require. The symptom is an occasional crash on rapid pop+push."
      severity: medium
      evidence: miuix-nav/src/commonMain/kotlin/top/yukonga/miuix/kmp/nav/core/NavDisplay.kt:406
    - text: "An empty backStack fails the require and crashes. The library's back gesture and swipe-dismiss are both gated on backStack.size > 1 / topIndex > 0, so the default paths are safe; but passing an unconditional pop other than onBack = { backStack.removeLastOrNull() }, or calling backStack.clear() directly, throws NavDisplay back stack cannot be empty on the next composition."
      severity: high
      evidence: miuix-nav/src/commonMain/kotlin/top/yukonga/miuix/kmp/nav/core/NavDisplay.kt:1032
    - text: "The entry just below the top (relativeDepth ≤ opaqueDepth, default 1) is still composing, just invisible: NavDisplay adds a hit-testable but non-consuming pointer filter to each entry, so touches on blank areas do not pass through to it, and you need not block it yourself with zIndex / clickable. But its focus is not cleared automatically on push -- if a lower TextField still holds focus, keyboard input still goes into it, so focusManager.clearFocus() yourself before navigating."
      severity: low
      evidence: miuix-nav/src/commonMain/kotlin/top/yukonga/miuix/kmp/nav/core/NavDisplay.kt:922
    - text: "Deeper entries (relativeDepth > opaqueDepth, i.e. the stack bottom after pushing two layers by default) are culled out of composition, though still in the back stack: plain remember state is lost, LaunchedEffect / DisposableEffect are cancelled and re-run when you pop back. rememberSaveable state and that entry's ViewModel are retained (the ViewModelStore is managed by the display-level registry and is cleared only when the entry is permanently popped). Put state that must survive culling into rememberSaveable or a ViewModel."
      severity: medium
      evidence: miuix-nav/src/commonMain/kotlin/top/yukonga/miuix/kmp/nav/core/NavDisplay.kt:638
    - text: "Since 0.9.4 the entry's LocalViewModelStoreOwner implements HasDefaultViewModelProviderFactory, inheriting the parent owner's default factory and CreationExtras, and is also a SavedStateRegistryOwner with extras carrying SAVED_STATE_REGISTRY_OWNER_KEY (the LocalSavedStateRegistryOwner it gets comes from the SaveableStateProvider that NavDisplay wraps around each entry: Compose 1.12's SaveableStateProvider provides a separate registry per key, stored in that entry's saveable slot, not the host Activity's shared registry), so viewModel { Vm(createSavedStateHandle()) }, a ViewModel with a SavedStateHandle constructor parameter, and hiltViewModel() are directly usable inside an entry. On 0.9.4-rc01 and earlier the entry owner was a bare ViewModelStoreOwner that gets empty CreationExtras: createSavedStateHandle() throws IllegalArgumentException (missing SAVED_STATE_REGISTRY_OWNER_KEY), and hiltViewModel() relying on the default factory also fails to create -- on old versions you can only use ViewModels that do not need a SavedStateHandle."
      severity: high
      evidence: miuix-nav/src/commonMain/kotlin/top/yukonga/miuix/kmp/nav/state/NavEntryViewModel.kt:115-121
  visual: {}
  state: "Purely controlled: the state is the NavBackStack passed in from outside (SnapshotStateList<NavKey>), and NavDisplay does not hold the stack itself. onBack defaults to backStack.removeLastOrNull() (the NavController overload defaults to navController.pop()). Each entry has its own LifecycleOwner, ViewModelStoreOwner (since 0.9.4 also providing the extras SavedStateHandle needs), a saveable slot carved out of the shared SaveableStateHolder by contentKey.toString(), and a LocalNavTransitionScope."
  m3: "No direct equivalent. Compared to androidx.navigation's NavHost: there are no route strings, no deep links, no result channel (explicitly not done in v1), and the back stack is a SnapshotStateList you can add/removeAt directly."

rememberNavBackStack:
  summary: "Remembers and persists a back stack. NavBackStack is just a typealias for SnapshotStateList<NavKey> -- backStack.add(route) directly is navigation."
  gotchas:
    - text: "When seeding with a single concrete key you must write the supertype explicitly: rememberNavBackStack(Route.Home) infers T as Route.Home, and later pushing Route.Detail throws SerializationException when saving state (and it fails late -- no error at navigation time, it blows up on rotation/backgrounding). The correct form is rememberNavBackStack<Route>(Route.Home), which the KDoc itself calls out."
      severity: high
      evidence: miuix-nav/src/commonMain/kotlin/top/yukonga/miuix/kmp/nav/core/NavBackStack.kt:61
    - text: "The key type must be @Serializable, otherwise the serializer capture at first composition throws SerializationException. The two failure points are asymmetric: an unannotated type crashes at first composition (fail fast), while an instance escaping the captured type hierarchy crashes only at save time (fail late)."
      severity: high
      evidence: miuix-nav/src/commonMain/kotlin/top/yukonga/miuix/kmp/nav/core/NavBackStack.kt:42
    - text: "The vararg elements are only a seed at first composition. After rememberSaveable restores, it is ignored, and changing these parameters does not change an existing stack."
      severity: low
      evidence: miuix-nav/src/commonMain/kotlin/top/yukonga/miuix/kmp/nav/core/NavBackStack.kt:72
    - text: "The Json used for serialization has ignoreUnknownKeys on -- that only relaxes unknown fields, not an unknown polymorphic discriminator. Restoring from old persisted state after deleting or renaming a route class still throws."
      severity: medium
      evidence: miuix-nav/src/commonMain/kotlin/top/yukonga/miuix/kmp/nav/core/NavBackStack.kt:32
    - text: "For tests or non-composition contexts use navBackStackOf(vararg), which places no serializability requirement on keys (a pure in-memory stack, no persistence)."
      severity: low
      evidence: miuix-nav/src/commonMain/kotlin/top/yukonga/miuix/kmp/nav/core/NavBackStack.kt:28
  visual: {}
  state: "It returns the SnapshotStateList<NavKey> itself, fully controlled: add / removeAt / removeLastOrNull / directly mutating elements are all valid navigation operations. It persists as a single JSON String (not a List<Any>), sidestepping Android Bundle's type restrictions."
  m3: "Corresponds to androidx.navigation's NavBackStackEntry stack, but that one is not directly mutable; this is a bare SnapshotStateList."

rememberNavController:
  summary: "A layer of push/pop/replace/popUntil sugar wrapped around rememberNavBackStack. Entirely optional -- operating on backStack directly is equivalent."
  gotchas:
    - text: "Inherits rememberNavBackStack's type-inference pitfall: you must write rememberNavController<Route>(Route.Home), otherwise T is inferred as a concrete subtype and pushing a different route later throws when saving state."
      severity: high
      evidence: miuix-nav/src/commonMain/kotlin/top/yukonga/miuix/kmp/nav/core/NavController.kt:60
    - text: "pop() does not pop when only the root remains and returns false (neither throwing nor clearing). To actually exit the app, check the return value yourself and then invoke the system back."
      severity: medium
      evidence: miuix-nav/src/commonMain/kotlin/top/yukonga/miuix/kmp/nav/core/NavController.kt:30
    - text: "popUntil(predicate) pops all the way down to just the root when the predicate never matches, with no error. The predicate is evaluated against the top element; note it does not check the root itself."
      severity: medium
      evidence: miuix-nav/src/commonMain/kotlin/top/yukonga/miuix/kmp/nav/core/NavController.kt:50
    - text: "NavController has zero state beyond wrapping that list, and two controllers wrapping the same backStack are fully equivalent. So do not try to use it as a singleton or for cross-screen sharing -- what should be shared is the backStack."
      severity: low
      evidence: miuix-nav/src/commonMain/kotlin/top/yukonga/miuix/kmp/nav/core/NavController.kt:13
  visual: {}
  state: "A pure thin shell, no self-held state. There is no result channel (navigateForResult/setResult/observeResult are explicitly not done in v1), so cross-screen return values must go through shared state yourself."
  m3: "Corresponds to androidx.navigation.NavController, but with only four methods, no graph, no deep link, and no previousBackStackEntry.savedStateHandle-style return channel (the SavedStateHandle of a ViewModel inside an entry is available since 0.9.4, see NavDisplay)."

LocalNavTransitionScope:
  summary: "Added in 0.9.4. Inside a NavDisplay entry's content, read LocalNavTransitionScope.current to get this entry's own live NavTransitionScope (relativeDepth is relative to this entry: 0 top of stack, positive covered, negative entering/leaving), used for entry-local transition coordination, such as pausing heavy work during a transition or fading out one of your child elements by depth. 0.9.4-rc01 and earlier have neither this property nor isRunning."
  gotchas:
    - text: "The default value is error(): reading it outside a NavDisplay entry (@Preview, a UI test rendering a screen composable standalone, a top/bottom bar wrapped outside NavDisplay) throws IllegalStateException directly. For components that may render outside NavDisplay, do not read it internally; instead have the caller pass the needed values in as parameters."
      severity: high
      evidence: miuix-nav/src/commonMain/kotlin/top/yukonga/miuix/kmp/nav/core/LocalNavTransitionScope.kt:19-24
    - text: "relativeDepth and role change every frame, gesture becomes a new instance on every move event, and settle.elapsedMillis also advances per frame -- reading them during composition (the composable function body, remember calculations) recomposes the entire entry per frame. Read these values only in deferred-read blocks like graphicsLayer { } / drawBehind; during composition read only isRunning, a derived coarse-grained signal that flips only at transition start / end."
      severity: medium
      evidence: miuix-nav/src/commonMain/kotlin/top/yukonga/miuix/kmp/nav/core/LiveNavTransitionScope.kt:39-50
    - text: "isRunning is at the whole-NavDisplay level, not this entry's: as long as this NavDisplay has a gesture, a release settle, or a programmatic animation running, every composing entry in the stack reads true, including layers not participating in this transition. To know whether this entry is moving, look at relativeDepth (in a deferred-read block). With nested NavDisplays an inner entry reads the inner scope, and the outer one is shadowed."
      severity: low
      evidence: miuix-nav/src/commonMain/kotlin/top/yukonga/miuix/kmp/nav/core/LiveNavTransitionScope.kt:50

Modifier.navSwipeDismiss:
  summary: "Finger-following swipe-dismiss that directly drives the animatedTop depth float. NavDisplay already attaches its internal version on the container -- this public one is for custom hosts."
  gotchas:
    - text: "It is not plug-and-play swipe-dismiss. You must hold an Animatable<Float, AnimationVector1D> yourself as the depth driver, maintain topIndex yourself, and pop yourself in onCommit. Attaching it again inside NavDisplay's page content fights the host's already-attached one for the same gesture."
      severity: high
      evidence: miuix-nav/src/commonMain/kotlin/top/yukonga/miuix/kmp/nav/gesture/NavSwipeDismiss.kt:104
    - text: "Once it claims the gesture, every subsequent pointer change is consumed on both axes and it ends only when the finger lifts -- there is no cross-axis cancel path. This means any nested scroll or in-page tap receives no events during that time (intentional design, fixing an old bug where a swipe was interrupted by horizontal drift), but it makes in-page interaction completely silent during a swipe."
      severity: medium
      evidence: miuix-nav/src/commonMain/kotlin/top/yukonga/miuix/kmp/nav/gesture/NavSwipeDismiss.kt:57
    - text: "NavSwipeDirection.None turns off the gesture entirely (you can only pop via the back key), which is also how the root entry is handled. enabled=false is the same. The two are semantically identical but come from different sources: direction is usually inherited from the transition's dismissDirection, and enabled is given by the host based on topIndex > 0."
      severity: low
      evidence: miuix-nav/src/commonMain/kotlin/top/yukonga/miuix/kmp/nav/gesture/NavSwipeDismiss.kt:62
    - text: "onCommit is called synchronously at the moment the release is judged a commit, not waiting for the settle animation to finish (the KDoc explains why: deferring the pop until after settle is unsafe in the per-entry coroutine scope). So after popping in onCommit the animation is still running -- do not do cleanup there that assumes the animation has completed."
      severity: medium
      evidence: miuix-nav/src/commonMain/kotlin/top/yukonga/miuix/kmp/nav/gesture/NavSwipeDismiss.kt:92
    - text: "It is a Modifier.composed { } implementation (needing the composition scope's coroutine and latest callbacks), not a Modifier.Node. It has extra overhead in scenarios that rebuild the modifier chain at very high frequency, and the source locally suppresses the no-composed lint."
      severity: low
      evidence: miuix-nav/src/commonMain/kotlin/top/yukonga/miuix/kmp/nav/gesture/NavSwipeDismiss.kt:101
  visual:
    commit_rule: "The release decision is velocity-first with position as fallback (NavDriverSpec.COMMIT_VELOCITY_THRESHOLD / COMMIT_POSITION_THRESHOLD); velocity uses VelocityTracker to take an instantaneous value converted to progress/second"
  state: "It does not hold navigation state; it drives the animatedTop passed in by the caller. The onGesture callback gives null after gesture resolution completes, but on the commit branch clearing null is the host's responsibility (when the leaving entry unloads)."
  m3: "Corresponds to M3's SwipeToDismissBox, but that is a component with its own state; this is a low-level modifier to be wired into the depth-driven model."

navDirectionalTransition:
  summary: "Composes the three NavTransitions push / pop / predictivePop into one and dispatches by drive direction. Use it for asymmetric forward/back transitions."
  gotchas:
    - text: "push.motion is never consumed. The composed motion takes commit/cancel from predictivePop and programmatic from pop. To give the forward direction its own motion curve, use entry(transition = ...)'s per-route override, not push here."
      severity: medium
      evidence: miuix-nav/src/commonMain/kotlin/top/yukonga/miuix/kmp/nav/transition/NavDirectionalTransition.kt:23
    - text: "dismissDirection comes only from predictivePop -- setting dismissDirection on push or pop is useless, and the swipe-dismiss direction is decided by predictivePop alone. opaqueDepth takes the max of the three."
      severity: medium
      evidence: miuix-nav/src/commonMain/kotlin/top/yukonga/miuix/kmp/nav/transition/NavDirectionalTransition.kt:52
    - text: "A gesture can take over midway through a programmatic settle, at which point dispatch switches from pop/push to predictivePop on the spot. If the two branches are geometrically inconsistent at that depth, a frame jumps. The source lists this as a known tradeoff (the platform makes commit animations non-interruptible; here interruptibility is kept). When writing branches, keep them close within the grabbable range."
      severity: medium
      evidence: miuix-nav/src/commonMain/kotlin/top/yukonga/miuix/kmp/nav/transition/NavDirectionalTransition.kt:26
    - text: "Dispatch uses the internal threshold-level derived flag LiveNavTransitionScope.gestureActive, not the raw scope.gesture -- the latter is a new instance on every move event, and transformEntry is called during composition, so reading it there recomposes per event. gestureActive is not public: when implementing your own NavTransition and needing a composition-time signal, you can only use scope.isRunning from 0.9.4 (true during a gesture, the post-release settle, and programmatic animation, unable to tell whether it is a gesture); to distinguish a gesture, put the read of scope.gesture inside graphicsLayer { }."
      severity: low
      evidence: miuix-nav/src/commonMain/kotlin/top/yukonga/miuix/kmp/nav/transition/NavDirectionalTransition.kt:79
  visual: {}
  state: "An @Stable stateless wrapper; all three branches are immutable NavTransitions. pop defaults to push, predictivePop defaults to pop."
  m3: "No equivalent. M3/androidx's AnimatedContent transitionSpec selects by targetState and does not distinguish gesture-driven from programmatic."

PredictiveBackHandler:
  summary: "A cross-platform back-event bridge: Android's system predictive back, Desktop's ESC, iOS edge gesture, unified into a single Flow<NavBackEvent> + onCommit/onCancel."
  gotchas:
    - text: "Without a LocalNavigationEventDispatcherOwner it silently does nothing (the first line of the function body is ?: return), neither registering nor erroring. When the host has not wired a back-event source, the back key is completely unresponsive with no way to diagnose."
      severity: high
      evidence: miuix-nav/src/commonMain/kotlin/top/yukonga/miuix/kmp/nav/gesture/PredictiveBackHandler.kt:104
    - text: "Discrete triggers (Desktop pressing ESC, programmatic back) skip onProgress and call onCommit directly -- so onProgress is not guaranteed to be called, and any initialization written only in onProgress does not run on the discrete path. Each resolution triggers exactly one of onCommit / onCancel."
      severity: medium
      evidence: miuix-nav/src/commonMain/kotlin/top/yukonga/miuix/kmp/nav/gesture/PredictiveBackHandler.kt:70
    - text: "Arbitration favors the last-composed and enabled one. An open dialog / bottom sheet / popup menu registers the same way and consumes back before navigation -- this is automatic, do not add your own priority logic. Conversely, when enabled=false, back passes through to the next handler (on Android that means exiting the app)."
      severity: medium
      evidence: miuix-nav/src/commonMain/kotlin/top/yukonga/miuix/kmp/nav/gesture/PredictiveBackHandler.kt:56
    - text: "NavBackEvent.progress saturates near 1f (the driving finger's upper bound) and does not overflow even if the device reports over 1. Do not use progress == 1f as a commit signal; commit is indicated only by onCommit. frameTimeMillis is 0 on a discrete trigger."
      severity: low
      evidence: miuix-nav/src/commonMain/kotlin/top/yukonga/miuix/kmp/nav/gesture/PredictiveBackHandler.kt:33
  visual: {}
  state: "Stateless host. onProgress receives a cold Flow that is independent per gesture; callbacks are continuously updated onto the adapter via SideEffect, so creating a new lambda each frame does not re-register. When a gesture is cancelled the in-flight collection is cancelled and then onCancel is called."
  m3: "Corresponds to androidx.activity.compose.PredictiveBackHandler, but this one is cross-platform and its callback shape aligns with Miuix's single-float depth-driven model."

getRoundedCorner:
  summary: "Reads the device screen's physical corner radius. Used to align edge-hugging cards/navigation containers with the screen's corners."
  gotchas:
    - text: "On all non-Android platforms it always returns 0.dp (the skiko actual is one line). Any layout that relies on it for visual alignment degrades to square corners on Desktop / iOS / Web, with no error. Provide a fallback value before using it."
      severity: high
      evidence: miuix-core/src/skikoMain/kotlin/top/yukonga/miuix/kmp/utils/Utils.skiko.kt:16
    - text: "On Android it can also be 0: API 31+ goes through WindowInsets.getRoundedCorner(POSITION_BOTTOM_LEFT), and only when that returns nothing does it fall back to reading the system-private dimen rounded_corner_radius_bottom (a MIUI convention), returning 0 when that resource does not exist. In other words, on non-Xiaomi Android 11-and-below devices it is essentially always 0."
      severity: medium
      evidence: miuix-core/src/androidMain/kotlin/top/yukonga/miuix/kmp/utils/Utils.android.kt:51
    - text: "It reads only the bottom-left position, assuming all four corners have the same radius. On irregular screens (different top and bottom corners) it reads the wrong value."
      severity: low
      evidence: miuix-core/src/androidMain/kotlin/top/yukonga/miuix/kmp/utils/Utils.android.kt:39
  visual:
    non_android: "always 0.dp"
  state: "@Composable read-only. On Android it is remember keyed on (context, rootWindowInsets), and insets changes (rotation, multi-window) recompute it."
  m3: "No equivalent. M3 does not expose the screen corner radius."

platformDialogProperties:
  summary: "The platform default DialogProperties for Miuix's own dialogs. Together with RemovePlatformDialogDefaultEffects, the goal is to fully turn off the platform's default window animation and scrim so Miuix can draw its own."
  gotchas:
    - text: "Both platforms set dismissOnBackPress to false. Using it to open a plain Dialog gives you a dialog the back key cannot close -- you must wire the close logic yourself (Miuix's dialog components go through the PredictiveBackHandler chain)."
      severity: high
      evidence: miuix-core/src/androidMain/kotlin/top/yukonga/miuix/kmp/utils/Utils.android.kt:58
    - text: "The DialogProperties fields returned by the two platforms are not the same: Android is (dismissOnBackPress=false, usePlatformDefaultWidth=false, decorFitsSystemWindows=false), skiko is (dismissOnBackPress=false, usePlatformDefaultWidth=false, usePlatformInsets=false, scrimColor=Transparent, animateTransition=false). The skiko version also carries @OptIn(ExperimentalComposeUiApi). Do not assume the two behave identically."
      severity: medium
      evidence: miuix-core/src/skikoMain/kotlin/top/yukonga/miuix/kmp/utils/Utils.skiko.kt:25
    - text: "Turning off the platform window animation and dim is not done in this function -- that is RemovePlatformDialogDefaultEffects() (on Android it changes the window's windowAnimations / dimAmount / FLAG_DIM_BEHIND, on skiko it is a no-op). Using platformDialogProperties without calling it means on Android you still see the system's window animation and scrim layered over Miuix's own animation."
      severity: medium
      evidence: miuix-core/src/androidMain/kotlin/top/yukonga/miuix/kmp/utils/Utils.android.kt:64
  visual: {}
  state: "A @Composable pure factory, stateless."
  m3: "Corresponds to constructing androidx.compose.ui.window.DialogProperties() directly. The difference is that these defaults are tuned for Miuix's self-drawn dialogs, not general defaults."

MiuixIcons:
  summary: "An icon namespace: a carrier with just six empty nested objects (Basic / Light / Normal / Regular / Medium / Demibold), with the actual icons attached as extension properties by two different modules."
  gotchas:
    - text: "MiuixIcons.Save does not exist. docs/components/icon.md:145 and the Chinese mirror both use it, but the Kotlin source across the repo has zero hits. The closest are MiuixIcons.Download / FileDownloads / TopDownloads."
      severity: high
      evidence: miuix-core/src/commonMain/kotlin/top/yukonga/miuix/kmp/icon/MiuixIcons.kt:6
    - text: "MiuixIcons.Basic.Audio does not exist. docs/components/sliderpreference.md:114 and rangesliderpreference.md:113 (4 places across the two language versions) use it, but the Basic group has only 7 in total: ArrowRight / ArrowUpDown / Check / Close / Search / SearchCleanup / Sidebar."
      severity: high
      evidence: miuix-ui/src/commonMain/kotlin/top/yukonga/miuix/kmp/icon/basic/Close.kt:14
    - text: "The Basic group and the extended group belong to different modules: the MiuixIcons.Basic.* extension properties are in miuix-ui (package top.yukonga.miuix.kmp.icon.basic), and the rest are all in miuix-icons (package top.yukonga.miuix.kmp.icon.extended). Depending on miuix-ui only, writing MiuixIcons.Ok does not compile; depending on miuix-icons only, writing MiuixIcons.Basic.Search does not compile."
      severity: high
      evidence: miuix-icons/src/commonMain/kotlin/top/yukonga/miuix/kmp/icon/extended/Close.kt:15
    - text: "Close / Search / Sidebar exist in both groups and are two completely different graphics (Basic.Close is a 24x24 viewport, 2.2f round-cap stroked cross; extended's Close is a 1003.2 viewport filled path). The receivers differ (MiuixIcons.Basic.Close vs MiuixIcons.Close), and when both dependencies are present writing the wrong receiver silently compiles and draws the other icon -- harder to spot than a compile error. The Basic Icons table in docs/guide/icons.md only gives bare icon names and never states the receiver is MiuixIcons.Basic, which is the root cause of the two doc bugs above."
      severity: high
      evidence: miuix-ui/src/commonMain/kotlin/top/yukonga/miuix/kmp/icon/basic/Search.kt:14
    - text: "Writing MiuixIcons.X bare gets an alias for the Regular weight (get() = MiuixIcons.Regular.X), not some neutral version. The five weights Light/Normal/Regular/Medium/Demibold are each a separate ImageVector, each with a file-level private var cache. The Basic group has no weight axis."
      severity: medium
      evidence: miuix-icons/src/commonMain/kotlin/top/yukonga/miuix/kmp/icon/extended/Home.kt:15
    - text: "The extended group is one icon per file (156 files, about 780 ImageVectors across five weights), and the physical layout serves DCE/R8 tree-shaking -- only the icon extension properties actually referenced are retained, and adding the dependency does not mean all of them enter the package."
      severity: low
      evidence: miuix-icons/src/commonMain/kotlin/top/yukonga/miuix/kmp/icon/extended/Add.kt:15
  visual:
    weights: "Five weights Light / Normal / Regular / Medium / Demibold; bare MiuixIcons.X == MiuixIcons.Regular.X"
    basic_set: "The Basic group has 7 in total: ArrowRight, ArrowUpDown, Check, Close, Search, SearchCleanup, Sidebar (living in miuix-ui)"
  state: "They are all lazy val extension properties, built on first read and stored in a file-level private var (not thread-safe, worst case building once redundantly, with no correctness impact)."
  m3: "Corresponds to androidx.compose.material.icons.Icons (five styles Filled/Outlined/Rounded/Sharp/TwoTone). Difference: M3's axis is style, Miuix's axis is stroke weight; and Miuix puts the Basic group in the UI module and the extended group in a separate module, requiring separate dependencies."

NavKey:
  summary: "The marker interface every route key must implement (package top.yukonga.miuix.kmp.nav.core). Minimal form:\n\n```kotlin\n@Serializable\nsealed interface Route : NavKey {\n    @Serializable data object Home : Route\n    @Serializable data class Detail(val id: Int) : Route\n}\n\nval backStack = rememberNavBackStack<Route>(Route.Home)\nNavDisplay(backStack = backStack) {\n    entry<Route.Home> { /* Home; navigate: backStack.add(Route.Detail(42)) */ }\n    entry<Route.Detail> { key -> /* Detail screen, read key.id; back: backStack.removeLastOrNull() */ }\n}\n```"
  gotchas:
    - text: "With rememberNavBackStack every key type must be @Serializable, which requires applying the kotlinx-serialization **compiler plugin** on the module (plugins { kotlin(\"plugin.serialization\") } or id(\"org.jetbrains.kotlin.plugin.serialization\")). Adding only the annotation without the plugin still compiles, and it throws SerializationException only when the serializer is captured at first composition. You need not add the runtime library yourself; miuix-nav transitively provides kotlinx-serialization-json as an api dependency."
      severity: high
      evidence: miuix-nav/src/commonMain/kotlin/top/yukonga/miuix/kmp/nav/core/NavKey.kt:21-23
    - text: "A stack that does not need cross-process restoration can use navBackStackOf(...): in-memory only, requiring no serializable key and thus no compiler plugin."
      severity: low
      evidence: miuix-nav/src/commonMain/kotlin/top/yukonga/miuix/kmp/nav/core/NavKey.kt:23-24

NavEntryBuilder:
  summary: "The receiver of NavDisplay's content lambda, with a single route-registration function: inline fun <reified T : NavKey> entry(contentKey: ((T) -> Any)? = null, transition: NavTransition? = null, swipeDismiss: NavSwipeDirection? = null, metadata: Map<String, Any> = emptyMap(), content: @Composable (T) -> Unit). It is a member function of the class, so it does not appear in the signature list generated for top-level functions; for usage see the NavKey entry."
  gotchas:
    - text: "Each concrete key type needs its own entry<ConcreteType> once: matching is by exact runtime KClass, and registering entry<Route> for a sealed parent interface does not cover subtypes (see the NavDisplay entry for details). transition can override the global transition per screen."
      severity: high
      evidence: miuix-nav/src/commonMain/kotlin/top/yukonga/miuix/kmp/nav/core/NavDisplay.kt:132-138

Modifier.drawCheckerboard:
  summary: "A top-level public Modifier extension that draws a 'transparency' checkerboard behind the node; it's what the four Alpha sliders use. Zero documentation coverage, but it is the only part in this set that can be reused independently on your own components —— to back your own transparent-color preview block with a checkerboard, use it directly, don't write your own. It lives in the top.yukonga.miuix.kmp.basic package (the file is ColorPicker.kt)."
  gotchas:
    - text: "It first lays down an opaque lightColor full-area rectangle and then overlays the dark cells, so it covers up earlier drawBehind content in the chain. It must be placed before the gradient/content drawing (closer to the head of the chain), and it doesn't clip itself —— when used alone you must clip first, or the checkerboard fills the whole node's bounding box rather than the rounded interior."
      severity: medium
      evidence: miuix-ui/src/commonMain/kotlin/top/yukonga/miuix/kmp/basic/ColorPicker.kt:1141-1144
    - text: "The default colors #CCCCCC / #AAAAAA are hardcoded light gray and don't read the theme. In a dark theme you must explicitly pass lightColor / darkColor, or it will be a glaring bright-gray block."
      severity: medium
      evidence: miuix-ui/src/commonMain/kotlin/top/yukonga/miuix/kmp/basic/ColorPicker.kt:1113-1116
    - text: "The cells are constructed all at once as a single Path inside drawWithCache, with a rectangle count of about area/(2×cell²). The default 3.dp cell is designed for a 26.dp-tall slider bar; spread over a full-screen-sized area it builds a Path of tens of thousands of rectangles (though it only rebuilds when the size/density changes). For large areas, increase cellSizeDp."
      severity: medium
      evidence: miuix-ui/src/commonMain/kotlin/top/yukonga/miuix/kmp/basic/ColorPicker.kt:1118-1139
    - text: "cellSizeDp is coerceAtLeast(1f)'d to at least 1 physical pixel, so passing 0.dp won't infinite-loop, but on low-density devices 1.dp and 0.5.dp render as the same 1px cell."
      severity: low
      evidence: miuix-ui/src/commonMain/kotlin/top/yukonga/miuix/kmp/basic/ColorPicker.kt:1119
  visual:
    cell: "cellSizeDp default 3.dp (clamped to a minimum of 1px)"
    colors: "lightColor default Color(0xFFCCCCCC), darkColor default Color(0xFFAAAAAA), both hardcoded and theme-independent"
    order: "even rows start drawing dark from the 2nd cell, odd rows from the 1st cell (a standard checkerboard); the dark cells are drawn with a single drawPath on one Path"
  state: "Stateless, a pure drawing modifier. It draws in the onDrawBehind phase (beneath the content)."
  m3: "No counterpart. Neither Compose proper nor material3 has a checkerboard modifier; the usual approach is to write your own drawBehind or use a ShaderBrush + TileMode.Repeated bitmap shader —— the latter is much faster than this Path implementation over large areas."

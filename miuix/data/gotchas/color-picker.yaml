OkLabColorPicker:
  summary: "The implementation behind ColorPicker(colorSpace = ColorSpace.OKLAB), with three Cartesian sliders (L / a green-red axis / b blue-yellow axis) plus Alpha. Good for axis-oriented tuning like 'nudge a bit toward green', not for picking a hue. Note the OkLab it uses is not standard OkLab (see below)."
  gotchas:
    - text: "The OkLab on this path skips sRGB linearization and is not the same thing as standard OkLab. Transforms contains two transforms with identical coefficients: rgbToOkLab/okLabToRgb eat the gamma-encoded sRGB components directly, while the private linearSrgbToOklab/oklabToLinearSrgb are the correct versions that linearize first. Color.toOkLab(), OkLab.toColor(), and this Picker all take the former; the OkHSV panel takes the latter. How much they differ: #808080's standard OkLab L is 0.600, computed here as 0.795 (primary-color endpoints like #FF0000 happen to agree because 0/1 are fixed points of the transfer function; the midtones differ most). The consequence is that Color → OkLab → Color round-trips consistently and works functionally, but ① the L axis is not perceptually linear, and the value slider's midpoint is not perceptual mid-gray; ② the numbers you get don't match CSS oklab() / culori / any other implementation, so don't store them in a cross-platform data format."
      severity: high
      evidence: miuix-ui/src/commonMain/kotlin/top/yukonga/miuix/kmp/color/core/Transforms.kt:30-40
    - text: "a/b have only two numeric scales, but the slider-track window is a third confusing number: the OkLab data class's a/b fields are a ±100 'human scale', converted to and from the internal ±0.4 absolute values via (v/0.4f)*100f; the Picker's internal state and OkLabAChannelSlider/OkLabBChannelSlider's inputs and callbacks all use the same ±0.4 internal values, and the Picker does no conversion when passing them to the sliders. (currentA+0.3f)/0.6f merely maps the internal value to a 0..1 position on the track, with the side effect that the track covers only ±0.3 and the callback output is also clamped within ±0.3. To assemble these sliders yourself, just distinguish the two numbers '±100 data class' and '±0.4 internal value', and don't add a conversion between state and slider."
      severity: high
      evidence: miuix-ui/src/commonMain/kotlin/top/yukonga/miuix/kmp/basic/ColorPicker.kt:642-659
    - text: "Out-of-gamut combinations get no gamut mapping and are hard-clipped per channel with coerceIn(0,1) inside okLabToRgb. Clipping changes both lightness and hue, so pushing a or b to extremes makes the displayed color 'turn a corner' rather than simply darken/desaturate. The file actually implements full cusp/gamut-boundary computation (findCusp/getSTMax), but uses it only on the OkHSV path."
      severity: medium
      evidence: miuix-ui/src/commonMain/kotlin/top/yukonga/miuix/kmp/color/core/Transforms.kt:56-60
    - text: "Same as ColorPicker: self-holding state + SideEffect weak sync; when the external side changes color back to the last synced value it won't roll back."
      severity: high
      evidence: miuix-ui/src/commonMain/kotlin/top/yukonga/miuix/kmp/basic/ColorPicker.kt:661-676
  visual:
    layout: "Column spacedBy 12.dp: preview bar 26.dp (CircleShape) + four 26.dp sliders"
    order: "L → a → b → Alpha"
  state: "Same as ColorPicker. Internally it stores currentL (0..1), currentA / currentB (±0.4 internal scale, but the sliders only reach ±0.3), and currentAlpha (0..1)."
  m3: "No counterpart."


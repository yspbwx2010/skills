# The color-picker family (ColorPicker / ColorPalette / four color-space slider sets / drawCheckerboard)
#
# 24 public APIs in total (21 Composables in ColorPicker.kt + Modifier.drawCheckerboard + the ColorSpace enum, plus ColorPalette).
# The official docs have two pages (colorpicker / colorpalette): ColorPicker, ColorPalette and ColorSpace have prose, the four Hsv* sliders have their own sections and examples,
# but the other 12 OkHsv/OkLch/OkLab sliders are only listed by name in a table with no parameter docs; Modifier.drawCheckerboard and the whole top.yukonga.miuix.kmp.color package have zero docs.
# Three facts that run through the whole family; keep them in mind before the individual entries:
#   1. No slider has a modifier parameter; they hardcode fillMaxWidth() + height(26.dp), so the size is not adjustable.
#   2. All four pickers are "self-held state + weak sync", not purely controlled: changing the reported color back to an old value does not roll them back.
#   3. OkLab / OkLch use a non-standard OkLab that skips sRGB linearization, a different definition from the one OkHSV uses.

ColorPicker:
  summary: The unified entry point for the color picker; it dispatches by colorSpace to one of the four implementations HsvColorPicker / OkHsvColorPicker / OkLabColorPicker / OkLchColorPicker; it contains no UI logic itself, just a when dispatcher. When you want to fix a specific color space, using the concrete implementation directly saves a layer.
  gotchas:
    - text: "It is not a purely controlled component. The child Picker stores the internal H/S/V in a keyless remember, and only reflows when the external color differs from both 'the last synced external value' and 'the current internal value'. A typical failure: after the user drags, you store color (internal value == external value, so no sync and lastApplied isn't updated either), then tapping 'reset' changes color back to the initial value —— at this point externalArgb == lastAppliedExternalColorArgb, the condition short-circuits, and the sliders and preview don't budge. To truly reset you must swap the Picker's key to force a rebuild."
      severity: high
      evidence: miuix-ui/src/commonMain/kotlin/top/yukonga/miuix/kmp/basic/ColorPicker.kt:161-176
    - text: "Conversely, when onColorChanged does nothing (or hardcodes color to a constant), the Picker can still be dragged and change color —— because the state is internal. It looks 'usable', but the color you receive is always stale."
      severity: medium
      evidence: miuix-ui/src/commonMain/kotlin/top/yukonga/miuix/kmp/basic/ColorPicker.kt:142-146
    - text: "Switching colorSpace at runtime discards the internal state being edited. The four branches are different groups of the when, so switching away destroys it and switching back re-initializes via remember from the current color. Only when you actually write the value from onColorChanged back to color is the switch lossless; otherwise a single switch returns to the original color. The official example opens a separate card for each of the four color spaces, each holding its own state, rather than switching a single Picker."
      severity: medium
      evidence: miuix-ui/src/commonMain/kotlin/top/yukonga/miuix/kmp/basic/ColorPicker.kt:78-118
    - text: "colorSpace is of type top.yukonga.miuix.kmp.basic.ColorSpace, which shares its name with androidx.compose.ui.graphics.colorspace.ColorSpace. IDE auto-import very easily picks the wrong one, and when it does the error is a type mismatch rather than 'symbol not found'. The docs' Import section doesn't give this line either."
      severity: medium
      evidence: miuix-ui/src/commonMain/kotlin/top/yukonga/miuix/kmp/basic/ColorPicker.kt:1298-1303
    - text: "In the when, HSV takes the else fallback rather than an explicit ColorSpace.HSV branch; behaviorally equivalent, but it means any future enum value silently falls to HSV instead of a compile error."
      severity: low
      evidence: miuix-ui/src/commonMain/kotlin/top/yukonga/miuix/kmp/basic/ColorPicker.kt:109-117
  visual:
    layout: "Column + Arrangement.spacedBy(12.dp), a preview bar + 4 sliders, 5 rows total"
    preview: "fillMaxWidth × 26.dp, clipped to CircleShape, the whole block disappears when showPreview=false (and loses 12.dp of spacing too)"
    modifier: "modifier only affects the outermost Column; the slider height, preview height, and row spacing are all hardcoded and unchangeable"
  state: "Self-holding state (uncontrolled with sync). Internally it stores the decomposed channel values in a remember{} plus a lastAppliedExternalColorArgb watermark, and does a one-way weak sync in a SideEffect. onColorChanged is required and non-null, and fires only when the new color's toArgb() differs from the passed color's toArgb() (the same ARGB won't call back twice). You must remember a Color state yourself and write it back in the callback, or the external and internal will drift apart permanently."
  m3: "There is no color picker in androidx.compose.material3, so there is no counterpart. The only analogy is M3's Slider —— but M3 Slider is purely controlled (value/onValueChange), while this Miuix set is self-holding state, and that difference is the easiest one to trip over when migrating."

ColorPalette:
  summary: "An HSV swatch grid (default 7 rows × 12 hue columns + 1 gray column) plus a built-in Alpha slider, drawn on a single Canvas, select-on-press, drag-to-select continuously. Good for 'picking one from preset colors', not for precise color selection —— it can only produce the discrete colors in the grid."
  gotchas:
    - text: "It is snap-based: the color you pass isn't displayed as-is but decomposed into HSV and snapped to the nearest cell. In the default rows=7 S/V table, when s=1 the highest v is only 0.85, so there is no pure color anywhere in the swatch —— pass Color.Red and the indicator ring lands on the Hsv(0,100,85) cell (about #D90000), while the top preview bar on first render still shows the pure red you passed; the two don't match; only tapping that cell makes onColorChanged emit #D90000. The first composition doesn't proactively fire the callback, so 'parent state == highlighted cell' never holds until the user's first tap."
      severity: high
      evidence: miuix-ui/src/commonMain/kotlin/top/yukonga/miuix/kmp/basic/ColorPalette.kt:104-113
    - text: "The nearest-rounding of hue columns doesn't handle wraparound. col is obtained by rounding (h%360)/360*hueColumns and then coerceIn(0, hueColumns-1); with hueColumns=12, h≥345° is computed as 12 and clamped back to 11 (i.e. the 330° cell), whereas the truly nearest is the 0° cell. That is, colors in the 345°–360° magenta-toward-red segment are snapped to the wrong column."
      severity: medium
      evidence: miuix-ui/src/commonMain/kotlin/top/yukonga/miuix/kmp/basic/ColorPalette.kt:97-103
    - text: "rows=7 uses a hand-tuned hardcoded S/V table, while other rows use a different formula. Changing rows from 7 to 8 is not 'one more row' but swaps the entire saturation/value distribution to a different algorithm, and the swatch's appearance changes abruptly."
      severity: medium
      evidence: miuix-ui/src/commonMain/kotlin/top/yukonga/miuix/kmp/basic/ColorPalette.kt:338-359
    - text: "Passing 0 for rows or totalColumns crashes with an index out-of-bounds: the indicator reads cell edges via rowEdges[selectedRow+1] / colEdges[selectedCol+1], the array lengths are rows+1 / totalColumns+1, and there is no input validation. hueColumns=0 with includeGrayColumn=false is the same landmine."
      severity: medium
      evidence: miuix-ui/src/commonMain/kotlin/top/yukonga/miuix/kmp/basic/ColorPalette.kt:236-241
    - text: "External color changes have a tolerance window of 1.5° hue / 0.02 saturation and value: an external color falling within the window only updates alpha and doesn't move the indicator ring. This is to avoid fighting the user's drag, but it also means programmatically nudging the color a tiny bit 'won't take'."
      severity: low
      evidence: miuix-ui/src/commonMain/kotlin/top/yukonga/miuix/kmp/basic/ColorPalette.kt:85-95
    - text: "The built-in Alpha slider can't be hidden (showPreview only governs the top preview bar), and ColorPalette has no hapticEffect parameter —— the internal HsvAlphaSlider uses the default haptics, which is not configurable and is inconsistent with ColorPicker."
      severity: low
      evidence: miuix-ui/src/commonMain/kotlin/top/yukonga/miuix/kmp/basic/ColorPalette.kt:163-175
    - text: "cornerRadius goes through Miuix's squircleClip rather than RoundedCornerShape, so the corner shape is a superellipse and doesn't line up with adjacent elements you build with RoundedCornerShape yourself."
      severity: low
      evidence: miuix-ui/src/commonMain/kotlin/top/yukonga/miuix/kmp/basic/ColorPalette.kt:199-202
  visual:
    grid: "fillMaxWidth × 180.dp (hardcoded; modifier only affects the outermost Column, so the height can't be adjusted)"
    preview: "fillMaxWidth × 26.dp, squircleBackground with 13.dp corners"
    indicator: "diameter = indicatorRadius×2 (default 20.dp), a 6.dp white stroke ring + a 2.dp black 25% outer glow"
    corner: "cornerRadius default 16.dp, squircleClip (superellipse), not RoundedCornerShape"
    layout: "Column + Arrangement.spacedBy(12.dp): preview bar / grid / Alpha slider"
  state: "Self-holding state: internally it stores only three values, selectedRow / selectedCol / alpha, and the color is computed live from the cell coordinates. The external color is reverse-solved into row/column via LaunchedEffect(color, rows, hueColumns, includeGrayColumn), with the tolerance short-circuit described above. The top preview shows lastEmittedColor ?: color, so before the first interaction it shows the external color and afterward always shows the color it emitted itself."
  m3: "No counterpart."

HsvColorPicker:
  summary: "The implementation behind ColorPicker(colorSpace = ColorSpace.HSV); it can also be called directly to bypass dispatch. The classic four HSV sliders (hue / saturation / value / alpha), the most intuitive and least perceptually uniform option; use it for 'just pick a color' scenarios."
  gotchas:
    - text: "Same as ColorPicker: self-holding state + SideEffect weak sync; when the external side changes color back to the last synced value it won't roll back."
      severity: high
      evidence: miuix-ui/src/commonMain/kotlin/top/yukonga/miuix/kmp/basic/ColorPicker.kt:161-176
    - text: "The hue of grayscale colors (black / white / any gray) is undefined in HSV, and at initialization colorToHsv returns h=0. Pass Color.White in and the hue slider sits at the far left (red), so as soon as the user moves saturation it jumps straight to the red family, looking like the component 'messes with the color'."
      severity: medium
      evidence: miuix-ui/src/commonMain/kotlin/top/yukonga/miuix/kmp/color/core/Transforms.kt:153-158
    - text: "The initial value goes through 8-bit quantization: Color.toHsv() internally multiplies red/green/blue by 255 and rounds before computing HSV, so a non-8-bit-aligned float color (e.g. a Color from interpolation/animation) drifts on the order of 1/255 in and out."
      severity: low
      evidence: miuix-ui/src/commonMain/kotlin/top/yukonga/miuix/kmp/color/core/Transforms.kt:170-179
  visual:
    layout: "Column spacedBy 12.dp: preview bar 26.dp (CircleShape) + four 26.dp sliders for hue / saturation / value / alpha"
    order: "H → S → V → A"
  state: "Same as ColorPicker: remember four Floats (hue stored as 0..360, s/v/alpha stored as 0..1) + lastAppliedExternalColorArgb, and selectedColor is computed live with derivedStateOf."
  m3: "No counterpart."

HsvHueSlider:
  summary: "A standalone HSV hue slider; its background is a 36-segment full-saturation, full-value rainbow gradient. It is the only one of the four Hsv* sliders that needs only its own hue value and no side channels."
  gotchas:
    - text: "The input and output units are asymmetric, the easiest thing in the whole set to get wrong: currentHue takes a 0..360 angle, while the onHueChanged callback gives you a 0..1 normalized value. If you write onHueChanged = { hue = it } per 'take it back and store it directly', the hue is compressed into the tiny 0..1 degree range and the slider appears stuck at the far left. The correct form is hue = it * 360f (the official docs example is correct, but nothing outside the KDoc warns you)."
      severity: high
      evidence: miuix-ui/src/commonMain/kotlin/top/yukonga/miuix/kmp/basic/ColorPicker.kt:256-271
    - text: "There is no modifier parameter. Internally it hardcodes Modifier.fillMaxWidth() wrapped in a fixed 26.dp height, so you can neither change the dimensions nor add padding/click area —— to leave whitespace you must wrap it in a Box outside. All 16 sliders are like this."
      severity: medium
      evidence: miuix-ui/src/commonMain/kotlin/top/yukonga/miuix/kmp/basic/ColorPicker.kt:265-271
    - text: "Only a draggable gesture, no tap gesture. Clicking the slider bar won't jump the thumb to the click position; you must drag past the touch slop for it to respond (the drag jumps to the finger position as soon as it begins, so it's 'jumps on drag' rather than 'no response and no jump on tap'). The ColorPalette on the same page uses awaitFirstDown and selects on a single tap —— the two have inconsistent interaction feel."
      severity: medium
      evidence: miuix-ui/src/commonMain/kotlin/top/yukonga/miuix/kmp/basic/ColorPicker.kt:1198-1218
    - text: "The passed-in value isn't clamped. A currentHue outside 0..360 (e.g. if you accumulate it yourself without taking the modulo) sends the indicator ring outside the track and it won't be clamped."
      severity: low
      evidence: miuix-ui/src/commonMain/kotlin/top/yukonga/miuix/kmp/basic/ColorPicker.kt:1240-1246
  visual:
    size: "fillMaxWidth × 26.dp (fixed, no modifier parameter)"
    corner: "CircleShape pill"
    track: "36-segment Hsv(h,100,100) gradient; the gradient's start and end are inset by half the height (13.dp), so the 13.dp at each end is a solid-color plateau, aligned with the indicator ring's travel range"
    indicator: "20.dp, a 6.dp white stroke ring + a 2.dp black 25% outer glow"
    border: "0.5.dp stroke at Color.Gray 10% opacity"
  state: "Purely controlled, no internal state. currentHue in (degrees), 0..1 out; you must multiply by 360 yourself to store it back."
  m3: "No counterpart; M3 has only a generic Slider, and it is symmetric value/onValueChange."

HsvSaturationSlider:
  summary: "HSV saturation slider. The background gradient varies with currentHue (from that hue's white to that hue's full saturation), so you must pass the current hue in as well."
  gotchas:
    - text: "Here currentHue takes a 0..360 angle (the same unit as HsvHueSlider's input), while currentSaturation and the callback are 0..1. With two units mixed within the same slider set, when copying code it's very easy to feed in the 0..1 value from HsvHueSlider's callback directly, and the whole gradient then stays stuck at red forever."
      severity: high
      evidence: miuix-ui/src/commonMain/kotlin/top/yukonga/miuix/kmp/basic/ColorPicker.kt:283-301
    - text: "No modifier parameter, size hardcoded; only a drag gesture, no tap gesture. Same as HsvHueSlider."
      severity: medium
      evidence: miuix-ui/src/commonMain/kotlin/top/yukonga/miuix/kmp/basic/ColorPicker.kt:283-288
  visual:
    size: "fillMaxWidth × 26.dp (fixed)"
    track: "two-stop gradient Hsv(h,0,100) → Hsv(h,100,100); note value is locked at 100 and doesn't vary with currentValue —— so for dark colors the gradient bar is brighter than the actual result"
  state: "Purely controlled, no internal state."
  m3: "No counterpart."

HsvValueSlider:
  summary: "HSV value slider; the gradient runs from pure black to the color at 'the current hue + current saturation, value maxed'. You must pass both hue and saturation."
  gotchas:
    - text: "currentHue is 0..360, while currentSaturation / currentValue / the callback are all 0..1. The unit mixing is as above."
      severity: high
      evidence: miuix-ui/src/commonMain/kotlin/top/yukonga/miuix/kmp/basic/ColorPicker.kt:314-330
    - text: "No modifier parameter, size hardcoded; only a drag gesture, no tap gesture."
      severity: medium
      evidence: miuix-ui/src/commonMain/kotlin/top/yukonga/miuix/kmp/basic/ColorPicker.kt:314-319
  visual:
    size: "fillMaxWidth × 26.dp (fixed)"
    track: "Color.Black → Hsv(h, s*100, 100)"
  state: "Purely controlled, no internal state."
  m3: "No counterpart."

HsvAlphaSlider:
  summary: "HSV alpha slider, backed by a Modifier.drawCheckerboard() checkerboard. You must pass all three H/S/V channels for it to draw the correct 'current color from transparent to opaque' gradient. This is also the one ColorPalette reuses internally."
  gotchas:
    - text: "currentHue is 0..360, and the other three parameters and the callback are all 0..1. All three side channels are required, and missing one fails to compile (there are no defaults)."
      severity: high
      evidence: miuix-ui/src/commonMain/kotlin/top/yukonga/miuix/kmp/basic/ColorPicker.kt:344-355
    - text: "The checkerboard base is a hardcoded #CCCCCC/#AAAAAA light gray that doesn't follow MiuixTheme's light/dark. In a dark theme this slider is the only bright-gray block on screen, visually jarring, and the component exposes no parameter to change it (drawCheckerboard's color parameters are the hardcoded defaults here)."
      severity: medium
      evidence: miuix-ui/src/commonMain/kotlin/top/yukonga/miuix/kmp/basic/ColorPicker.kt:361-364
    - text: "No modifier parameter, size hardcoded; only a drag gesture, no tap gesture."
      severity: medium
      evidence: miuix-ui/src/commonMain/kotlin/top/yukonga/miuix/kmp/basic/ColorPicker.kt:344-350
  visual:
    size: "fillMaxWidth × 26.dp (fixed)"
    track: "baseColor(alpha=0) → baseColor(alpha=1), with a 3.dp checkerboard #CCCCCC / #AAAAAA underneath"
  state: "Purely controlled, no internal state."
  m3: "No counterpart."

OkHsvColorPicker:
  summary: "The implementation behind ColorPicker(colorSpace = ColorSpace.OKHSV). Based on Ottosson OkHSV, with perceptual-lightness correction and gamut-cusp reparameterization, so the hue bar has no HSV-style 'bright yellow-green, dark blue-purple' light/dark banding. It is the most mathematically complete of the four color spaces and the only one that takes the correct sRGB linearization path."
  gotchas:
    - text: "Passing pure black (Color.Black / any r=g=b=0 color) as the initial value turns the internal state into NaN. When c=0, srgbToOkhsv takes the hue direction vector as a=b=0 (Transforms.kt:193-194), and in computeMaxSaturation(0,0) f1 and f2 happen to both be 0, so s -= (f*f1)/(f1*f1 - 0.5f*f*f2) is 0/0 = NaN (Transforms.kt:413-419); the NaN spreads through findCusp/getSTMax into tMax, and in the end both s and v are NaN (h is still 0). Consequences: the value and alpha bar gradients all become black-to-black, the two sliders' indicator-ring positions are undefined, and the SideEffect can never rescue it (the selectedColor computed from NaN happens to also be black, so externalArgb == internalArgb and the sync condition short-circuits). Because s and v are both broken, dragging just one slider is still black; you must drag both saturation and value to recover. Before passing pure black, offset it a little (e.g. Color(0.004f,0.004f,0.004f))."
      severity: high
      evidence: miuix-ui/src/commonMain/kotlin/top/yukonga/miuix/kmp/color/core/Transforms.kt:413-419
    - text: "Same as ColorPicker: self-holding state + SideEffect weak sync; when the external side changes color back to the last synced value it won't roll back."
      severity: high
      evidence: miuix-ui/src/commonMain/kotlin/top/yukonga/miuix/kmp/basic/ColorPicker.kt:409-424
    - text: "The public OkHsv data class's own KDoc is wrong, and following it will necessarily fail. The KDoc declares h as 0..360 degrees and s/v as 0..100 percent, but toColor() merely forwards the three fields as-is to Transforms.okhsvToColor, which wants three 0..1 values. In testing, OkHsv(180f, 50f, 50f).toColor() (supposedly 'a medium-saturation cyan') returns pure red #FF0000; OkHsv(0f, 100f, 100f) is also #FF0000. The correct usage is OkHsv(0.5f, 0.5f, 0.5f). The library's own OkHsvColorPicker uses 0..1, contrary to the KDoc."
      severity: high
      evidence: miuix-ui/src/commonMain/kotlin/top/yukonga/miuix/kmp/color/space/OkHsv.kt:9-17
    - text: "OkHSV is the only one of the four spaces without a Color.toOkHsv() extension —— to convert yourself outside the Picker you can only call Transforms.colorToOkhsv(color) directly, which returns a FloatArray rather than the OkHsv data class, with all three components 0..1."
      severity: medium
      evidence: miuix-ui/src/commonMain/kotlin/top/yukonga/miuix/kmp/color/api/Extensions.kt:12-37
    - text: "When OkHSV's v is dragged to 0, inside okhsvToSrgb c = (c*lNew)/l is 0/0 and all three channels compute to NaN; Compose's Color(Float,...) turns NaN into 0, so the result lands as opaque black rather than a crash, but any code on this path that catches the intermediate values itself must guard against NaN."
      severity: low
      evidence: miuix-ui/src/commonMain/kotlin/top/yukonga/miuix/kmp/color/core/Transforms.kt:246-254
  visual:
    layout: "Column spacedBy 12.dp: preview bar 26.dp (CircleShape) + four 26.dp sliders"
    order: "H → S → V → A"
  state: "Same as ColorPicker. All three internal channels are stored as 0..1 (unlike the HSV set which stores 0..360), and the initial value comes from Transforms.colorToOkhsv()."
  m3: "No counterpart."

OkHsvHueSlider:
  summary: "OkHSV hue slider; its background is a perceptually uniform rainbow bar of 36 segments of okhsvToColor(h,1,1) —— placed next to HsvHueSlider you can directly see the latter's light/dark banding."
  gotchas:
    - text: "currentH is 0..1, not an angle —— exactly the opposite of HsvHueSlider's 0..360, while the callbacks on both are 0..1. Across the whole set 'hue' has three units in all: HsvHueSlider's input uses degrees, OkHsvHueSlider / OkLchHueSlider inputs use 0..1, and the h fields of the three data classes Hsv/OkHsv/OkLch are all in degrees. Always check when copying code across families."
      severity: high
      evidence: miuix-ui/src/commonMain/kotlin/top/yukonga/miuix/kmp/basic/ColorPicker.kt:497-519
    - text: "No modifier parameter, size hardcoded; only a drag gesture, no tap gesture."
      severity: medium
      evidence: miuix-ui/src/commonMain/kotlin/top/yukonga/miuix/kmp/basic/ColorPicker.kt:504-508
  visual:
    size: "fillMaxWidth × 26.dp (fixed)"
    track: "36 segments of Transforms.okhsvToColor(h, 1f, 1f), recomputed on each composition (no cache, but the call site is inside a remember)"
  state: "Purely controlled, no internal state, both input and output 0..1."
  m3: "No counterpart."


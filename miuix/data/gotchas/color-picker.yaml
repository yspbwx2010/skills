OkLchColorPicker:
  summary: "The implementation behind ColorPicker(colorSpace = ColorSpace.OKLCH), the polar form of OkLab: lightness / chroma / hue / alpha. Use this when you want to 'keep lightness fixed and only change hue'; it is the handiest of the four spaces for deriving theme colors. The slider order is H → L → C → A, different from the other three spaces."
  gotchas:
    - text: "The underlying OkLab likewise skips sRGB linearization (sharing colorToOkLab/okLabToRgb with OkLabColorPicker), so the L and C here are not standard OkLch values and don't match CSS oklch(). Don't store the result of Color.toOkLch() as interoperable numbers."
      severity: high
      evidence: miuix-ui/src/commonMain/kotlin/top/yukonga/miuix/kmp/color/core/Transforms.kt:30-40
    - text: "The chroma cap is hardcoded to 0.4, but the maximum chroma actually reachable in sRGB is only about 0.3225 (at pure magenta). That means the rightmost ~19% of the chroma slider's travel is entirely out of gamut, and dragging into it only triggers per-channel clipping —— the color no longer gets more vivid, and instead the lightness and hue both distort."
      severity: medium
      evidence: miuix-ui/src/commonMain/kotlin/top/yukonga/miuix/kmp/color/core/Transforms.kt:483-490
    - text: "Same as ColorPicker: self-holding state + SideEffect weak sync; when the external side changes color back to the last synced value it won't roll back."
      severity: high
      evidence: miuix-ui/src/commonMain/kotlin/top/yukonga/miuix/kmp/basic/ColorPicker.kt:791-806
    - text: "The slider order has hue on top, then lightness, then chroma, unlike HSV/OkHSV's H→S→V and OkLab's L→a→b. When building a UI with four tabs side by side, the row positions don't line up."
      severity: low
      evidence: miuix-ui/src/commonMain/kotlin/top/yukonga/miuix/kmp/basic/ColorPicker.kt:830-877
